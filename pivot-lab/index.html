<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MacroWatch Pivot Lab</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/charts/economic-series-catalog.js"></script>
</head>
<body>
  <main class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div>
          <p class="eyebrow">Temporary tool</p>
          <h1>Indicator Pivot Lab</h1>
        </div>
        <span id="series-count" class="count">-</span>
      </div>
      <input id="search" class="search" type="search" placeholder="지표 검색" autocomplete="off">
      <div id="series-list" class="series-list" aria-label="경제지표 목록"></div>
    </aside>

    <section class="workspace">
      <header class="workspace-head">
        <div>
          <p id="series-meta" class="eyebrow">지표를 선택해 주세요</p>
          <h2 id="series-title">경제지표 차트</h2>
        </div>
        <div class="summary">
          <span id="point-count">데이터 -</span>
          <span id="pivot-count">원시값</span>
        </div>
      </header>

      <div id="status" class="status">왼쪽에서 지표를 선택하면 저장된 원시 시계열을 그대로 표시합니다.</div>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
      </div>
      <div class="legend-note">
        <span>DB 저장 원시값만 표시</span>
        <span>피봇·월중 고저점·밴드 가공 없음</span>
      </div>
    </section>
  </main>

  <script src="./app.js?v=raw-series-20260916-1"></script>
</body>
</html>
