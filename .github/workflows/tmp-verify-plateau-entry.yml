name: Verify plateau entry and render real temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-verify-plateau-entry.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check matplotlib
      - name: Verify and render
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m py_compile backend/historical_pivot_stage2.py backend/historical_pivot_stage3.py
          mkdir -p tmp-real-plateau-entry
          PYTHONPATH=backend python - <<'PY'
          import matplotlib.pyplot as plt
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines

          db=SupabaseRest()

          def run(series_code):
              rows,freq,start,end=load_case_series(
                  db,
                  case_code="tightening_2022",
                  index_code="NASDAQ_COMPOSITE",
                  series_code=series_code,
              )
              raw=normalize_rows(rows)
              vals=[p.value for p in raw if start<=p.day<=end]
              lo,hi=min(vals),max(vals)
              pad=(hi-lo)*.08 if hi!=lo else 1.0
              g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)
              s1=calculate_base_pivots(rows,freq)
              s2=classify_special_structures(s1,g)
              s3=simplify_pivot_lines(s2,g)
              return raw,start,end,g,s1,s2,s3

          raw,start,end,g,s1,s2,s3=run("US10Y_REAL")
          print("REAL_SPIKES",[(s.point.day.isoformat(),s.point.value,s.direction,None if s.entry is None else (s.entry.day.isoformat(),s.entry.value,s.entry.pivot_type),s.marker_only) for s in s2.spike_peaks])
          print("REAL_ADDED_LOW",[(p.day.isoformat(),p.value) for p in s2.low_pivots if (p.day,p.value,p.pivot_type) not in {(q.day,q.value,q.pivot_type) for q in s1.low_pivots}])
          print("REAL_S3",[(p.day.isoformat(),p.value,p.pivot_type) for p in s3.markers])

          # Regression: NFCI should keep only the lower sideways found after the prior fix.
          *_,n2,n3=run("NFCI_RISK")[-3:]
          print("NFCI_SIDEWAYS_H",[(s.start.day.isoformat(),s.end.day.isoformat()) for s in n2.high_sideways_segments])
          print("NFCI_SIDEWAYS_L",[(s.start.day.isoformat(),s.end.day.isoformat()) for s in n2.low_sideways_segments])

          fig,ax=plt.subplots(figsize=(14,7))
          ax.plot([p.day for p in raw],[p.value for p in raw],linewidth=1.0,label="raw")
          ax.plot([p.day for p in s2.high_pivots],[p.value for p in s2.high_pivots],linewidth=1.8,label="upper RDP")
          ax.plot([p.day for p in s2.low_pivots],[p.value for p in s2.low_pivots],linewidth=1.8,label="lower RDP")
          ax.scatter([p.day for p in s2.high_pivots],[p.value for p in s2.high_pivots],s=34,marker="^")
          ax.scatter([p.day for p in s2.low_pivots],[p.value for p in s2.low_pivots],s=34,marker="v")
          for sp in s2.spike_peaks:
              ax.scatter([sp.point.day],[sp.point.value],s=120,marker="*",label="spike")
              if sp.entry is not None:
                  ax.plot([sp.entry.day,sp.point.day],[sp.entry.value,sp.point.value],linewidth=3)
          for seg in (*s2.high_sideways_segments,*s2.low_sideways_segments):
              ax.plot([seg.start.day,seg.end.day],[seg.start.value,seg.end.value],linewidth=4,alpha=.7)
          ax.set_title("US 10Y Real Yield · Stage 2 · plateau-entry restored")
          ax.set_xlim(start,end); ax.set_ylim(g.y_min,g.y_max); ax.grid(True,alpha=.2); ax.legend(loc="best")
          fig.tight_layout(); fig.savefig("tmp-real-plateau-entry/US10Y_REAL_STAGE2_CURRENT.png",dpi=160); plt.close(fig)

          fig,ax=plt.subplots(figsize=(14,7))
          ax.plot([p.day for p in raw],[p.value for p in raw],linewidth=1.0,label="raw")
          for seg in s3.segments:
              ax.plot([seg.start.day,seg.end.day],[seg.start.value,seg.end.value],linewidth=2.4)
          highs=[p for p in s3.markers if p.pivot_type=="high"]; lows=[p for p in s3.markers if p.pivot_type=="low"]
          if highs: ax.scatter([p.day for p in highs],[p.value for p in highs],s=40,marker="^",label="Stage 3 high")
          if lows: ax.scatter([p.day for p in lows],[p.value for p in lows],s=40,marker="v",label="Stage 3 low")
          ax.set_title("US 10Y Real Yield · Stage 3 · plateau-entry restored")
          ax.set_xlim(start,end); ax.set_ylim(g.y_min,g.y_max); ax.grid(True,alpha=.2); ax.legend(loc="best")
          fig.tight_layout(); fig.savefig("tmp-real-plateau-entry/US10Y_REAL_STAGE3_CURRENT.png",dpi=160); plt.close(fig)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-plateau-entry
          path: tmp-real-plateau-entry/*.png
          if-no-files-found: error
