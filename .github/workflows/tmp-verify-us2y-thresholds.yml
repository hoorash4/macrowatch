name: Verify US2Y thresholds temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-verify-us2y-thresholds.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Inspect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures, SPIKE_MIN_VISUAL_Y_SHARE, RAPID_MOVE_MIN_VISUAL_Y_SHARE

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US2Y")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals);pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)
          s2=classify_special_structures(calculate_base_pivots(rows,freq),g)
          print("THRESH",SPIKE_MIN_VISUAL_Y_SHARE,RAPID_MOVE_MIN_VISUAL_Y_SHARE)
          print("SPIKES",[(s.point.day.isoformat(),s.point.value,s.direction,round(s.angle_deg,2),None if s.entry is None else (s.entry.day.isoformat(),s.entry.value,s.entry.pivot_type)) for s in s2.spike_peaks])
          print("RAPID",[(c.start.day.isoformat(),c.start.value,c.start.pivot_type,c.end.day.isoformat(),c.end.value,c.end.pivot_type,c.direction,round(c.visual_y_share,4)) for c in s2.rapid_move_candidates])
          PY
