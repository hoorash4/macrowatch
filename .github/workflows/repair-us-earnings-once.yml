name: Repair U.S. earnings once

on:
  push:
    paths:
      - ".github/workflows/repair-us-earnings-once.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EARNINGS_WRITE_MODE: automatic
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Repair incomplete U.S. earnings
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: backend
          SEC_USER_AGENT: "MacroWatch/1.0 (contact: hoorash44@gmail.com)"
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m earnings_us.repair_cli --write
