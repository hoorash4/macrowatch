name: Repair U.S. earnings once

on:
  push:
    paths:
      - ".github/workflows/repair-us-earnings-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh workflow run earnings-us-repair.yml -f write=true
