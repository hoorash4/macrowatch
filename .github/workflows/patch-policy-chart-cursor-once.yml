name: Patch policy chart cursor once

on:
  push:
    branches: [fix/policy-chart-cursor-20260912]
    paths:
      - ".github/workflows/patch-policy-chart-cursor-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/policy-chart-cursor-20260912
          fetch-depth: 0
      - name: Align policy cursor with shared chart behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/js/charts/policy-chart.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "period: `${String(row.meeting_date).slice(2, 4)}년 ${String(row.meeting_date).slice(5, 7)}월`,",
              "period: `${String(row.meeting_date).slice(0, 4)}년 ${String(row.meeting_date).slice(5, 7)}월`,",
              1,
          )
          text = text.replace(
              '<text data-policy-cursor-action text-anchor="middle" y="${PADDING.top + 11}" class="policy-chart-cursor-action"></text><text data-policy-cursor-period text-anchor="middle" y="${HEIGHT - PADDING.bottom + 14}" class="policy-chart-cursor-period"></text>',
              '<text data-policy-cursor-action text-anchor="middle" y="${PADDING.top + 12}" class="analysis-chart-cursor-text analysis-chart-cursor-value" visibility="hidden"></text><text data-policy-cursor-period text-anchor="middle" y="${HEIGHT - PADDING.bottom + 12}" class="analysis-chart-cursor-text analysis-chart-cursor-date" visibility="hidden"></text>',
              1,
          )
          old = '''      cursorPeriod.setAttribute('x', nearest.x); cursorPeriod.textContent = nearest.period;
      cursorAction.setAttribute('x', nearest.x); cursorAction.textContent = `${nearest.action}${Number.isFinite(nearest.changeBps) ? `(${nearest.changeBps}bp)` : ''} · 점수 ${nearest.eventScore > 0 ? '+' : ''}${Math.round(nearest.eventScore)}`;
      for (const element of [cursor, cursorPeriod, cursorAction]) element.classList.add('is-visible');
'''
          new = '''      cursorPeriod.textContent = nearest.period;
      cursorAction.textContent = `${chartUtils.cursorValueText({ displayValue: nearest.value }, [{ key: 'displayValue', label: '정책 스트레스', format: (value) => chartUtils.formatChartNumber(value, { showPlus: true }) }])}${nearest.action ? ` · ${nearest.action}${Number.isFinite(nearest.changeBps) ? ` ${chartUtils.formatChartNumber(nearest.changeBps)}bp` : ''}` : ''}`;
      cursorPeriod.setAttribute('visibility', 'visible');
      cursorAction.setAttribute('visibility', 'visible');
      chartUtils.positionCursorText(cursorPeriod, nearest.x, frame);
      chartUtils.positionCursorText(cursorAction, nearest.x, frame);
      cursor.classList.add('is-visible');
'''
          assert old in text, 'policy pointer block not found'
          text = text.replace(old, new, 1)
          old = '''      selectedPoint = null;
      for (const element of [cursor, cursorPeriod, cursorAction]) element.classList.remove('is-visible');
'''
          new = '''      selectedPoint = null;
      cursor.classList.remove('is-visible');
      cursorPeriod.setAttribute('visibility', 'hidden');
      cursorAction.setAttribute('visibility', 'hidden');
'''
          assert old in text, 'policy pointerleave block not found'
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_dashboard.js')
          tests = test_path.read_text(encoding='utf-8')
          marker = "  assert.match(chart, /data-policy-cursor-action/);\n"
          addition = "  assert.match(chart, /analysis-chart-cursor-text analysis-chart-cursor-value/);\n  assert.match(chart, /analysis-chart-cursor-text analysis-chart-cursor-date/);\n  assert.match(chart, /positionCursorText\\(cursorPeriod, nearest\\.x, frame\\)/);\n  assert.match(chart, /positionCursorText\\(cursorAction, nearest\\.x, frame\\)/);\n  assert.match(chart, /slice\\(0, 4\\).*년/);\n  assert.doesNotMatch(chart, /cursorPeriod\\.setAttribute\\('x', nearest\\.x\\)/);\n  assert.doesNotMatch(chart, /cursorAction\\.setAttribute\\('x', nearest\\.x\\)/);\n"
          assert marker in tests, 'policy dashboard test marker not found'
          tests = tests.replace(marker, marker + addition, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
          rm .github/workflows/patch-policy-chart-cursor-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/charts/policy-chart.js tests/test_dashboard.js .github/workflows/patch-policy-chart-cursor-once.yml
          git diff --cached --check
          git commit -m "Align policy chart cursor with shared formatting"
          git push origin HEAD:fix/policy-chart-cursor-20260912
