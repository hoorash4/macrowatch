name: Earnings U.S. automatic

on:
  schedule:
    # KST 11:00 quarter-end snapshot, 11:30 new SEC filings, 12:00 pending-only retry.
    # Run every day because the U.S. Friday close is Saturday morning in Korea.
    - cron: "0 2 * * *"
    - cron: "30 2 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: Automatic collection phase
        required: true
        default: all
        type: choice
        options: [snapshot, edgar, incomplete, all]
      write:
        description: Persist U.S. collection results
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: earnings-us-automatic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Run selected U.S. collection phase
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: backend
          WRITE: ${{ github.event_name == 'schedule' && 'true' || inputs.write }}
          PHASE: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 2 * * *' && 'snapshot' || (github.event.schedule == '30 2 * * *' && 'edgar' || 'incomplete')) || inputs.phase }}
          SEC_USER_AGENT: "MacroWatch/1.0 (contact: hoorash44@gmail.com)"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--phase "$PHASE")
          [[ "$WRITE" == "true" ]] && args+=(--write)
          timeout --signal=TERM --kill-after=10s 660s python -m earnings_us.automatic_cli "${args[@]}"

  notify_failure:
    needs: collect
    if: ${{ always() && needs.collect.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send failure email
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          OUTLOOK_APP_PASSWORD: ${{ secrets.OUTLOOK_APP_PASSWORD }}
          PHASE: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 2 * * *' && 'snapshot' || (github.event.schedule == '30 2 * * *' && 'edgar' || 'incomplete')) || inputs.phase }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          account = os.environ.get("ADMIN_EMAIL", "").strip()
          password = os.environ.get("OUTLOOK_APP_PASSWORD", "").strip()
          if not account:
              raise RuntimeError("ADMIN_EMAIL GitHub Actions secret is missing")
          if not password:
              raise RuntimeError("OUTLOOK_APP_PASSWORD GitHub Actions secret is missing")

          phase = os.environ.get("PHASE") or "unknown"
          run_url = os.environ["RUN_URL"]
          message = EmailMessage()
          message["From"] = account
          message["To"] = account
          message["Subject"] = f"[MacroWatch] 미국 실적 자동 실행 실패 ({phase})"
          message.set_content(
              "MacroWatch 미국 실적 자동 실행이 실패했습니다.\n\n"
              f"단계: {phase}\n"
              f"실행 시도: {os.environ['RUN_ATTEMPT']}\n"
              f"커밋: {os.environ['COMMIT_SHA']}\n"
              f"로그: {run_url}\n"
          )

          with smtplib.SMTP("smtp-mail.outlook.com", 587, timeout=30) as smtp:
              smtp.ehlo()
              smtp.starttls(context=ssl.create_default_context())
              smtp.ehlo()
              smtp.login(account, password)
              smtp.send_message(message)
          PY
