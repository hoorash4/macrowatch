name: Temporary compare US10Y REAL 10deg history
on:
  push:
    paths:
      - ".github/workflows/tmp-compare-us10y-real-10deg.yml"
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        ref:
          - "0bdf6deadee7354be3cf638353c87ee9dc19ebfa"
          - "2691028c05a1b84dfa6ac2e980115aaab1651de8"
          - "090c6957316b8d14107ab499e69631cb16bcd8d2"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Trace 10-degree output
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REF_SHA: ${{ matrix.ref }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import date
          import os
          import historical_pivot_base as h
          db=h.SupabaseRest()
          rows,freq,start,end=h.load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US10Y_REAL")
          pts=h.normalize_rows(rows)
          vals=[p.value for p in pts if start<=p.day<=end]
          lo,hi=min(vals),max(vals); pad=(hi-lo)*0.08 if hi!=lo else 1.0
          g=h.ChartGeometry(start,end,lo-pad,hi+pad,1200,600)
          base=h.calculate_base_pivots(rows,freq)
          aug=h.augment_spike_entry_points(base,g)
          orig10=h.prune_same_trend_extremes
          origfinal=getattr(h,"prune_unconfirmed_retracements",None)
          h.prune_same_trend_extremes=lambda result,geometry,**kwargs: result
          if origfinal is not None:
              h.prune_unconfirmed_retracements=lambda result: result
          simp=h.simplify_pivot_lines(aug,g)
          h.prune_same_trend_extremes=orig10
          ten=orig10(simp,g)
          target=(date(2018,11,27),1.15,"high")
          keys={(p.day,p.value,p.pivot_type) for p in ten.markers}
          print("REF",os.environ["REF_SHA"],"TARGET_ALIVE",target in keys)
          print("EARLY",[(str(p.day),p.value,p.pivot_type) for p in ten.markers if date(2018,3,1)<=p.day<=date(2020,4,1)])
          PY
