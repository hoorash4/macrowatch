name: Temporary economic embed layout fixer
on:
  push:
    branches:
      - fix/embed-economic-menu-20260913
    paths:
      - .github/scripts/fix_economic_embed_layout.py
      - .github/workflows/tmp-fix-economic-embed-layout.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/embed-economic-menu-20260913
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python .github/scripts/fix_economic_embed_layout.py
      - run: rm -f .github/scripts/fix_economic_embed_layout.py .github/workflows/tmp-fix-economic-embed-layout.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve economic embed layout"
          git push origin HEAD:fix/embed-economic-menu-20260913
