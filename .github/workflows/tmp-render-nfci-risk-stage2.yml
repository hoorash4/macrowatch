name: Render NFCI_RISK Stage2 temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-render-nfci-risk-stage2.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check matplotlib
      - name: Render Stage2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p tmp-stage2
          PYTHONPATH=backend python - <<'PY'
          import matplotlib.pyplot as plt
          from common import SupabaseRest
          from historical_pivot_base import load_case_series, ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots, augment_spike_entry_points
          from historical_pivot_stage2 import finalize_sideways_protection

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(
              db,
              case_code="tightening_2022",
              index_code="NASDAQ_COMPOSITE",
              series_code="NFCI_RISK",
          )
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals)
          pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          base=calculate_base_pivots(rows,freq)
          s1=augment_spike_entry_points(base,g)
          s2=finalize_sideways_protection(s1,g)

          fig,ax=plt.subplots(figsize=(14,7))
          ax.plot([p.day for p in raw],[p.value for p in raw],linewidth=1.0,label="raw")

          highs=sorted(s2.high_pivots,key=lambda p:p.day)
          lows=sorted(s2.low_pivots,key=lambda p:p.day)

          if highs:
              ax.plot([p.day for p in highs],[p.value for p in highs],linewidth=2.0,marker="^",label="Stage2 high RDP")
          if lows:
              ax.plot([p.day for p in lows],[p.value for p in lows],linewidth=2.0,marker="v",label="Stage2 low RDP")

          for seg in s2.high_sideways_segments:
              ax.plot([seg.start.day,seg.end.day],[seg.start.value,seg.end.value],linewidth=6.0,alpha=.35,label="high sideways" if seg is s2.high_sideways_segments[0] else None)
          for seg in s2.low_sideways_segments:
              ax.plot([seg.start.day,seg.end.day],[seg.start.value,seg.end.value],linewidth=6.0,alpha=.35,label="low sideways" if seg is s2.low_sideways_segments[0] else None)

          for spike in s2.spike_peaks:
              ax.scatter([spike.point.day],[spike.point.value],s=70,marker="*",label="spike" if spike is s2.spike_peaks[0] else None)

          ax.set_xlim(start,end)
          ax.set_ylim(g.y_min,g.y_max)
          ax.grid(True,alpha=.2)
          ax.legend(loc="best")
          fig.tight_layout()
          fig.savefig("tmp-stage2/NFCI_RISK_STAGE2.png",dpi=160)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nfci-risk-stage2
          path: tmp-stage2/NFCI_RISK_STAGE2.png
          if-no-files-found: error
