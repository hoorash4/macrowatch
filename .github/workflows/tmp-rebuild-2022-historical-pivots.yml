name: Rebuild 2022 historical pivots temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-rebuild-2022-historical-pivots.yml"

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Rebuild all 2022 frontend indicator pivots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALGORITHM_VERSION: ${{ github.sha }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          import os
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots, augment_spike_entry_points
          from historical_pivot_stage2 import finalize_sideways_protection
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import prune_same_trend_extremes
          from historical_pivot_stage5 import prune_unconfirmed_retracements
          from historical_pivot_store import store_pipeline_result

          CASE="tightening_2022"
          INDEX="NASDAQ_COMPOSITE"
          SERIES=[
              "US2Y","US10Y","US10Y_REAL","US10Y2Y","US_POLICY_RATE_MID",
              "HY_OAS","NFCI_CREDIT","NFCI_RISK","EM_OAS","WTI","RRP","TGA",
              "REDBOOK","WEI","EMRATIO","US_RETAIL_SALES","US_CPI","US_CORE_CPI",
              "US_PPI","US_CORE_PPI","US_PCE","US_CORE_PCE","US_SBDI_31_180",
              "DRALACBS","US_SBDFI","US_COMMERCIAL_CH11"
          ]

          db=SupabaseRest()
          ok=[]
          skipped=[]
          failed=[]

          for code in SERIES:
              try:
                  rows,freq,start,end=load_case_series(
                      db,case_code=CASE,index_code=INDEX,series_code=code
                  )
                  raw=normalize_rows(rows)
                  vals=[p.value for p in raw if start<=p.day<=end]
                  if not vals:
                      raise RuntimeError("no normalized points in buffer")
                  lo,hi=min(vals),max(vals)
                  pad=(hi-lo)*.08 if hi!=lo else 1.0
                  g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

                  base=calculate_base_pivots(rows,freq)
                  s1=augment_spike_entry_points(base,g)
                  s2=finalize_sideways_protection(s1,g)
                  s3=simplify_pivot_lines(s2,g)
                  s4=prune_same_trend_extremes(s3,g)
                  s5=prune_unconfirmed_retracements(s4)

                  count=store_pipeline_result(
                      db,
                      case_code=CASE,index_code=INDEX,series_code=code,
                      algorithm_version=os.environ["ALGORITHM_VERSION"],
                      source_rows=rows,frequency=freq,
                      buffer_start=start,buffer_end=end,
                      base=base,stage1=s1,stage2=s2,stage3=s3,stage4=s4,final=s5,
                  )
                  ok.append((code,freq,count,len(rows)))
                  print("OK",code,freq,"pivots",count,"points",len(rows))
              except RuntimeError as exc:
                  msg=str(exc)
                  if "not part of this base pipeline" in msg or "No economic-chart rows" in msg:
                      skipped.append((code,msg))
                      print("SKIP",code,msg)
                  else:
                      failed.append((code,msg))
                      print("FAIL",code,msg)
              except Exception as exc:
                  failed.append((code,repr(exc)))
                  print("FAIL",code,repr(exc))

          print("SUMMARY_OK",len(ok),ok)
          print("SUMMARY_SKIPPED",len(skipped),skipped)
          print("SUMMARY_FAILED",len(failed),failed)
          if failed:
              raise SystemExit(1)
          PY
