name: Temporary final RDP spike verification
on:
  push:
    paths:
      - ".github/workflows/tmp-final-rdp-spike-verify.yml"
      - "tools/tmp_verify_final_rdp_spike.py"
      - "backend/historical_pivot_base.py"
      - "tests/test_historical_pivot_base.py"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Targeted tests
        run: |
          python -m unittest             tests.test_historical_pivot_base.HistoricalPivotBaseTests.test_stage1_spike_correction_adds_missing_upward_entry_before_final_rdp             tests.test_historical_pivot_base.HistoricalPivotBaseTests.test_stage1_spike_correction_adds_missing_downward_entry_before_final_rdp             tests.test_historical_pivot_base.HistoricalPivotBaseTests.test_spike_inside_opposite_sideways_is_marker_only             tests.test_historical_pivot_base.HistoricalPivotBaseTests.test_spike_reuses_existing_entry_rdp_instead_of_adding_duplicate             tests.test_historical_pivot_base.HistoricalPivotBaseTests.test_spike_peak_is_recorded_separately_from_added_entry -v
      - name: Live US10Y real verification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python tools/tmp_verify_final_rdp_spike.py
