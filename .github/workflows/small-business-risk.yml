name: Refresh U.S. small business risk

on:
  push:
    branches: [main]
    paths:
      - backend/signals/small_business_risk_pipeline.py
      - backend/sources/small_business_risk.py
      - backend/common.py
      - supabase/migrations/**
      - .github/workflows/small-business-risk.yml
  schedule:
    # 06:20 KST: NFIB ì ê· ìì ë§¤ì¼ íì¸íë¤.
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      replace:
        description: "ì¸ë¶ ììë£ë¡ 10ë êµ¬ê° ì ì²´ êµì²´"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macrowatch-small-business-risk
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install data clients
        run: pip install --disable-pip-version-check requests
      - name: Collect small business risk
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.replace }}" = "true" ]; then
            PYTHONPATH=backend python -m signals.small_business_risk_pipeline --years 10 --replace
          else
            PYTHONPATH=backend python -m signals.small_business_risk_pipeline --years 10
          fi
