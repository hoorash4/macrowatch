name: Refresh U.S. small business risk

on:
  schedule:
    # 08:15 KST: run after the 07:30 economic-chart/Equifax refresh.
    - cron: "15 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macrowatch-small-business-risk
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install data clients
        run: pip install --disable-pip-version-check requests
      - name: Collect canonical NFIB source observations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python -m signals.small_business_risk_pipeline --months 5 --stage sources

  derived:
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime client
        run: pip install --disable-pip-version-check requests
      - name: Calculate small business risk from stored observations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python -m signals.small_business_risk_pipeline --months 5 --stage derived
