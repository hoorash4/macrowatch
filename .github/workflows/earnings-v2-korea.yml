name: Earnings V2 Korea stored-quarter recalculation

on:
  workflow_dispatch:
    inputs:
      year:
        description: Fiscal year
        required: true
        default: "2026"
        type: string
      quarter:
        description: Fiscal quarter
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "3", "4"]
permissions:
  contents: read

concurrency:
  group: earnings-v2-korea-quarter
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EARNINGS_WRITE_MODE: manual
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Recalculate one stored quarter
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: backend
          EARNINGS_V2_DEADLINE_SECONDS: "600"
          YEAR: ${{ inputs.year || '' }}
          QUARTER: ${{ inputs.quarter || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$YEAR" =~ ^[0-9]{4}$ ]]
          python -m earnings_v2.recalculate_cli --year "$YEAR" --quarter "$QUARTER" --write
