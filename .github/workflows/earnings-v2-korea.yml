name: Earnings V2 Korea quarter

on:
  schedule:
    # 19:30 KST. 정기공시 신규 접수와 매출 대기 기업만 증분 갱신합니다.
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: Fiscal year
        required: true
        default: "2026"
        type: string
      quarter:
        description: Fiscal quarter
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "3", "4"]
      write:
        description: Write only after the dry-run result is accepted
        required: true
        default: false
        type: boolean
      allow_review:
        description: Continue after an incomplete quarter (normally false)
        required: true
        default: false
        type: boolean
      recalculate_only:
        description: Recalculate from stored facts without external provider calls
        required: true
        default: false
        type: boolean
      incremental:
        description: Keep stored facts and collect only new or missing companies
        required: true
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: earnings-v2-korea-quarter
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Collect and validate one quarter
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: backend
          YEAR: ${{ inputs.year || '' }}
          QUARTER: ${{ inputs.quarter || '' }}
          WRITE: ${{ github.event_name == 'schedule' && 'true' || inputs.write }}
          ALLOW_REVIEW: ${{ inputs.allow_review }}
          RECALCULATE_ONLY: ${{ inputs.recalculate_only }}
          INCREMENTAL: ${{ inputs.incremental }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            args=(--daily)
          else
            [[ "$YEAR" =~ ^[0-9]{4}$ ]]
            args=(--year "$YEAR" --quarter "$QUARTER")
          fi
          [[ "$WRITE" == "true" ]] && args+=(--write)
          [[ "$ALLOW_REVIEW" == "true" ]] && args+=(--allow-review)
          [[ "$RECALCULATE_ONLY" == "true" ]] && args+=(--recalculate-only)
          [[ "$INCREMENTAL" == "true" ]] && args+=(--incremental)
          # 요청별 제한과 별개로 분기 프로세스 전체에도 명시적인 상한을 둔다.
          # 124는 정상 실패로 처리되며 다음 분기를 자동 실행하지 않는다.
          timeout --signal=TERM --kill-after=10s 270s python -m earnings_v2.cli "${args[@]}"
