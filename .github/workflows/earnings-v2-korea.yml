name: Earnings V2 Korea quarter

on:
  # 최소 15년 역사 백필이 검증될 때까지 수동 실행만 허용한다.
  workflow_dispatch:
    inputs:
      year:
        description: Fiscal year
        required: true
        default: "2026"
        type: string
      quarter:
        description: Fiscal quarter
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "3", "4"]
      write:
        description: Write only after the dry-run result is accepted
        required: true
        default: false
        type: boolean
      # 현재 배포된 admin-control이 보내는 이전 입력 계약과의 경계다.
      # 백엔드는 이 값을 사용하지 않으며 admin-control 재배포 후 제거한다.
      allow_review:
        description: Deprecated compatibility input; incomplete runs always continue
        required: true
        default: false
        type: boolean
      recalculate_only:
        description: Recalculate from stored facts without external provider calls
        required: true
        default: false
        type: boolean
      pending_only:
        description: Retry only pending companies in the selected historical quarter
        required: true
        default: false
        type: boolean
      trust_previous_backfill:
        description: Use cumulative source freshly written by the preceding backfill quarter
        required: true
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: earnings-v2-korea-quarter
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Collect and validate one quarter
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: backend
          EARNINGS_V2_DEADLINE_SECONDS: "600"
          YEAR: ${{ inputs.year || '' }}
          QUARTER: ${{ inputs.quarter || '' }}
          WRITE: ${{ inputs.write }}
          RECALCULATE_ONLY: ${{ inputs.recalculate_only }}
          PENDING_ONLY: ${{ inputs.pending_only }}
          TRUST_PREVIOUS_BACKFILL: ${{ inputs.trust_previous_backfill }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$YEAR" =~ ^[0-9]{4}$ ]]
          args=(--year "$YEAR" --quarter "$QUARTER")
          [[ "$WRITE" == "true" ]] && args+=(--write)
          [[ "$RECALCULATE_ONLY" == "true" ]] && args+=(--recalculate-only)
          [[ "$PENDING_ONLY" == "true" ]] && args+=(--pending-only)
          [[ "$TRUST_PREVIOUS_BACKFILL" == "true" ]] && args+=(--trust-previous-backfill)
          # 애플리케이션 마감선보다 30초 뒤의 외부 제한은 실패 상태 기록까지
          # 고장 난 경우에만 사용하는 최후 강제 종료 안전망이다.
          timeout --signal=TERM --kill-after=10s 660s python -m earnings_v2.cli "${args[@]}"

