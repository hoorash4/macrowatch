name: Earnings V2.5 two-quarter pilot

on:
  push:
    paths:
      - ".github/workflows/earnings-v25-two-quarter-pilot.yml"

permissions:
  contents: read

concurrency:
  group: earnings-v25-two-quarter-pilot
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Replace 2016 Q1 and Q2 sequentially
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: backend
          EARNINGS_V2_DEADLINE_SECONDS: "1200"
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python -m earnings_v25.cli --year 2016 --quarter 1 --write
          python -m earnings_v25.cli --year 2016 --quarter 2 --write --trust-previous-backfill

