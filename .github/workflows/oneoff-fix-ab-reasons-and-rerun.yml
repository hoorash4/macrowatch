name: One-off fix A/B reason UI and rerun
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-fix-ab-reasons-and-rerun.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply patch
        run: python tools/patch_history_ab_ui.py
      - name: Verify
        run: |
          node --check assets/js/historical-insight/historical-insight.js
          grep -q "Number(item.overallScore)>0" assets/js/historical-insight/historical-insight.js
          grep -q "appendRemainingABReasons" assets/js/historical-insight/historical-insight.js
      - name: Commit result
        run: |
          git config user.name "hoorash4"
          git config user.email "hoorash4@gmail.com"
          rm .github/workflows/oneoff-fix-ab-reasons-and-rerun.yml tools/patch_history_ab_ui.py
          git add assets/js/historical-insight/historical-insight.js assets/css/historical-insight.css historical-insight.html .github/workflows/historical-pivot-ai-backfill.yml .github/workflows/oneoff-fix-ab-reasons-and-rerun.yml tools/patch_history_ab_ui.py
          git commit -m "Show remaining A/B reasons and rerun US10Y2Y"
          git push
