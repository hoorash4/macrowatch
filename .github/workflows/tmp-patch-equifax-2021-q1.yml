name: tmp patch Equifax Q1 2021
on:
  push:
    branches: [main]
    paths: [".github/workflows/tmp-patch-equifax-2021-q1.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch Q1 observations and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/sources/paynet_loan_performance.py')
          s=p.read_text()
          anchor='    date(2021, 4, 1): (1.40, 0.55, 2.97, "Equifax-Jul-2021-derived-from-May-MoM"),\n'
          extra=(
            '    date(2021, 3, 1): (1.52, 0.60, 3.13, "Equifax-May-2022-derived-from-Mar-YoY"),\n'
            '    date(2021, 2, 1): (1.62, 0.64, 3.24, "Equifax-Apr-2022-derived-from-Feb-YoY"),\n'
          )
          if 'date(2021, 3, 1)' not in s:
              if anchor not in s: raise SystemExit('anchor missing')
              p.write_text(s.replace(anchor,anchor+extra,1))
          Path('.github/workflows/tmp-patch-equifax-2021-q1.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pin Equifax Q1 2021 derived observations"
          git push
