name: Temporary render four final pivot charts v2
on:
  push:
    paths:
      - "tools/tmp_render_final_four_v2.py"
      - ".github/workflows/tmp-render-final-four-v2.yml"
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests matplotlib
      - name: Render
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python tools/tmp_render_final_four_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-four-charts-v2
          path: tmp_final_four_charts_v2/*.png
