name: Diagnose one legacy DART filing

on:
  workflow_dispatch:
    inputs:
      receipt_no:
        description: "Official DART receipt number"
        required: true
        type: string
      report_code:
        description: "DART report code"
        required: true
        type: choice
        default: "11013"
        options: ["11013", "11012", "11014", "11011"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install worker dependency
        run: pip install -r backend/requirements.txt
      - name: Inspect public statement candidates
        env:
          PYTHONPATH: backend
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          LEGACY_DART_DIAGNOSTIC_RECEIPT: ${{ inputs.receipt_no }}
          LEGACY_DART_DIAGNOSTIC_REPORT_CODE: ${{ inputs.report_code }}
        run: python -m earnings.diagnose_legacy_archive
