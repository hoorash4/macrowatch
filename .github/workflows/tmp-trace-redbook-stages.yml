name: Trace REDBOOK stages temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-trace-redbook-stages.yml"

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Trace REDBOOK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series, ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots, augment_spike_entry_points
          from historical_pivot_stage2 import finalize_sideways_protection
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import prune_same_trend_extremes
          from historical_pivot_stage5 import prune_unconfirmed_retracements

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(
              db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="REDBOOK"
          )
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals); pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          base=calculate_base_pivots(rows,freq)
          s1=augment_spike_entry_points(base,g)
          s2=finalize_sideways_protection(s1,g)
          s3=simplify_pivot_lines(s2,g)
          s4=prune_same_trend_extremes(s3,g)
          s5=prune_unconfirmed_retracements(s4)

          for name,obj in [("S1",s1),("S2",s2),("S3",s3),("S4",s4),("S5",s5)]:
              pts=getattr(obj,"markers",None) or getattr(obj,"display_markers",None) or tuple((*getattr(obj,"high_pivots",()),*getattr(obj,"low_pivots",())))
              print(name,[(p.day.isoformat(),round(p.value,4),p.pivot_type) for p in sorted(pts,key=lambda x:(x.day,x.pivot_type)) if p.day.year>=2020 and p.day.year<=2022])
          print("SIDEWAYS_H",[(x.start.day.isoformat(),round(x.start.value,4),x.end.day.isoformat(),round(x.end.value,4),round(x.angle_deg,3)) for x in s2.high_sideways_segments])
          print("SIDEWAYS_L",[(x.start.day.isoformat(),round(x.start.value,4),x.end.day.isoformat(),round(x.end.value,4),round(x.angle_deg,3)) for x in s2.low_sideways_segments])
          print("S3SEG",[(x.start.day.isoformat(),round(x.start.value,4),x.end.day.isoformat(),round(x.end.value,4),x.kind) for x in s3.segments if x.start.day.year>=2020 and x.start.day.year<=2022])
          print("S4SEG",[(x.start.day.isoformat(),round(x.start.value,4),x.end.day.isoformat(),round(x.end.value,4),x.kind) for x in s4.segments if x.start.day.year>=2020 and x.start.day.year<=2022])
          print("S5SEG",[(x.start.day.isoformat(),round(x.start.value,4),x.end.day.isoformat(),round(x.end.value,4),x.kind) for x in s5.segments if x.start.day.year>=2020 and x.start.day.year<=2022])
          PY
