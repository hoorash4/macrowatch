name: Trace NFCI spike temp
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-trace-nfci-spike.yml"
permissions: {contents: read}
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Trace NFCI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import date,timedelta
          from common import SupabaseRest
          from historical_pivot_base import _get_rows_paginated,_single_row
          from historical_pivot_shared import ChartGeometry,normalize_rows,buffer_bounds
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements
          db=SupabaseRest();CASE='tightening_2022';INDEX='NASDAQ_COMPOSITE';CODE='NFCI_RISK'
          cyc=_single_row(db,'historical_case_market_cycles',{'select':'start_date,trough_date','case_code':f'eq.{CASE}','index_code':f'eq.{INDEX}','limit':'2'})
          s=date.fromisoformat(str(cyc['start_date'])[:10]);t=date.fromisoformat(str(cyc['trough_date'])[:10]);bs,be=buffer_bounds(s,t)
          W=950.;H=464.;SX=W*.12;TX=W*.88;ppd=(TX-SX)/(t-s).days;ds=s-timedelta(days=SX/ppd);de=t+timedelta(days=(W-TX)/ppd)
          rows=_get_rows_paginated(db,'economic_chart_series_points',{'select':'observation_date,value,frequency','series_code':f'eq.{CODE}','observation_date':f'gte.{bs.isoformat()}','and':f'(observation_date.lte.{be.isoformat()})','order':'observation_date.asc'})
          raw=normalize_rows(rows);vis=[p for p in raw if ds<=p.day<=de];lo=min(p.value for p in vis);hi=max(p.value for p in vis);yp=(hi-lo)*(.08/.84);g=ChartGeometry(ds,de,lo-yp,hi+yp,W,H)
          a=calculate_base_pivots(rows,rows[0]['frequency']);b=classify_special_structures(a,g);c=simplify_pivot_lines(b,g);d=finalize_rapid_moves(c,g);e=prune_same_trend_extremes(d,g);f=prune_unconfirmed_retracements(e,g)
          print('SPIKES',[(x.point.day.isoformat(),x.point.value,None if x.entry is None else x.entry.day.isoformat(),None if x.entry is None else x.entry.value,x.marker_only) for x in b.spike_peaks])
          print('S3_SEG_SPIKE',[(x.start.day.isoformat(),x.start.value,x.end.day.isoformat(),x.end.value,x.kind) for x in c.segments if x.kind=='spike'])
          print('S3',[(p.day.isoformat(),p.value) for p in c.markers])
          print('S4',[(p.day.isoformat(),p.value) for p in d.markers])
          print('S5',[(p.day.isoformat(),p.value) for p in e.markers])
          print('S6',[(p.day.isoformat(),p.value) for p in f.markers])
          PY
