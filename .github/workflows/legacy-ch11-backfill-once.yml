name: Backfill ABI Chapter 11 archives once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/legacy-ch11-backfill-once.yml"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Collect explicit ABI/Epiq monthly Chapter 11 counts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import date
          from html import unescape
          import re
          from urllib.parse import quote, urljoin
          import requests
          from common import SupabaseRest
          from signals.economic_chart_pipeline import _insert_missing
          from sources.business_credit_monthly import _extract_epiq_ch11

          UA={"User-Agent":"Mozilla/5.0 (compatible; MacroWatch/1.0)"}
          base='https://dev.abi.org'
          q='commercial chapter 11 filings'
          links=set()
          empty=0
          for page in range(0,80):
              url=f'{base}/search/node/{quote(q)}?page={page}'
              try:
                  r=requests.get(url,headers=UA,timeout=20)
                  if r.status_code!=200: continue
              except Exception: continue
              page_links={urljoin(base,unescape(h)) for h in re.findall(r'href=["\']([^"\']+)["\']',r.text,re.I)
                          if ('/node/' in h or '/newsroom/' in h) and not any(x in h for x in ('search/node','user/login'))}
              before=len(links); links |= page_links
              empty=empty+1 if len(links)==before else 0
              if page>3 and empty>=3: break

          # ABI tag archives expose some releases that Drupal search may omit.
          for page in range(0,260):
              url=f'{base}/terms/journal-article-tags/business-reorganization?page={page}'
              try:
                  r=requests.get(url,headers=UA,timeout=15)
                  if r.status_code!=200: continue
              except Exception: continue
              text=re.sub(r'<(script|style)\b.*?</\1>',' ',r.text,flags=re.I|re.S)
              plain=re.sub(r'\s+',' ',unescape(re.sub(r'<[^>]+>',' ',text)))
              if re.search(r'commercial\s+chapter\s+11',plain,re.I):
                  for y,m,c in _extract_epiq_ch11(plain):
                      if date(2016,9,1)<=date(y,m,1)<=date.today():
                          links.add(url+'#inline')
              # also capture article links from each tag page
              links |= {urljoin(base,unescape(h)) for h in re.findall(r'href=["\']([^"\']+)["\']',r.text,re.I)
                        if ('/node/' in h or '/newsroom/' in h) and 'commercial' in h.lower()}

          values={}
          # Parse inline tag pages and individual release pages; only explicit month/year pairs qualify.
          for url in sorted(links):
              target=url.split('#')[0]
              try:
                  r=requests.get(target,headers=UA,timeout=20)
                  if r.status_code!=200: continue
              except Exception: continue
              html=re.sub(r'<(script|style)\b.*?</\1>',' ',r.text,flags=re.I|re.S)
              plain=re.sub(r'\s+',' ',unescape(re.sub(r'<[^>]+>',' ',html)))
              if not re.search(r'commercial\s+chapter\s+11',plain,re.I): continue
              for y,m,c in _extract_epiq_ch11(plain):
                  obs=date(y,m,1)
                  if date(2016,9,1)<=obs<=date.today():
                      values.setdefault((y,m),(c,target))

          rows=[{'series_code':'US_COMMERCIAL_CH11','observation_date':f'{y:04d}-{m:02d}-01','value':c,'frequency':'M','source':f'ABI-Epiq:{u}'} for (y,m),(c,u) in sorted(values.items())]
          db=SupabaseRest(); inserted=_insert_missing(db,rows,date(2016,9,1))
          print('links',len(links),'fetched',len(rows),'inserted',inserted,'first',rows[0]['observation_date'] if rows else None,'last',rows[-1]['observation_date'] if rows else None)
          print('months',','.join(r['observation_date'][:7] for r in rows))
          PY
