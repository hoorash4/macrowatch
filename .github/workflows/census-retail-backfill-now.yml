name: Census retail sales backfill now

on:
  push:
    paths:
      - ".github/workflows/census-retail-backfill-now.yml"

permissions:
  contents: read

concurrency:
  group: census-retail-backfill-now
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Backfill Census retail sales only
        env:
          PYTHONPATH: backend
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m signals.economic_chart_backfill --only census-retail
