name: Backfill US 10Y real yield once

on:
  push:
    paths:
      - ".github/workflows/us10y-real-backfill-temp.yml"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Backfill only US 10Y real yield
        env:
          PYTHONPATH: backend
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from common import SupabaseRest
          from signals.economic_chart_pipeline import _insert_missing
          from sources.us_treasury_yields import fetch_treasury_real_yield_rows

          end = date.today()
          start = end - timedelta(days=3660)
          db = SupabaseRest()
          rows = fetch_treasury_real_yield_rows(start, end)["US10Y_REAL"]
          inserted = _insert_missing(db, rows, start)
          print({"series": "US10Y_REAL", "start": start.isoformat(), "end": end.isoformat(), "fetched": len(rows), "inserted": inserted})
          PY
