name: Probe business-risk sources

on:
  push:
    branches: [main]
    paths:
      - "backend/tools/probe_business_risk_sources.py"
      - ".github/workflows/probe-business-risk-sources.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - name: Probe sources
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python backend/tools/probe_business_risk_sources.py
