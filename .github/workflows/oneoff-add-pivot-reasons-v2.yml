name: One-off add Pivot AI v2 reasons
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-add-pivot-reasons-v2.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch turning point reasons
        shell: python
        run: |
          from pathlib import Path
          p=Path('supabase/functions/pivot-ai-v2/index.ts')
          s=p.read_text()
          s=s.replace('const VERSION="trend-structure-v1";','const VERSION="trend-structure-v2";')
          s=s.replace('grade:{type:"string",enum:["A","B","C"]},level:', 'grade:{type:"string",enum:["A","B","C"]},reason:{type:"string",minLength:1,maxLength:400},level:')
          s=s.replace('required:["id","visual_date","type","grade","level","previous_trend_id","next_trend_id"]', 'required:["id","visual_date","type","grade","reason","level","previous_trend_id","next_trend_id"]')
          s=s.replace('TP id를 넣지 마라."', 'TP id를 넣지 마라. 각 turning_point의 reason에는 왜 그 지점이 해당 레벨의 반전/수렴/돌파이며 왜 그 등급인지 시각적 구조를 근거로 1~2문장으로 기록하라. 원시 수치 근거는 쓰지 마라."')
          s=s.replace('prompt_cache_key:"macrowatch-visual-trend-v1"', 'prompt_cache_key:"macrowatch-visual-trend-v2"')
          s=s.replace('reason:`${tp.level==="skeleton"?"골격":"서브"} 추세 ${tp.type}`', 'reason:String(tp.reason||`${tp.level==="skeleton"?"골격":"서브"} 추세 ${tp.type}`).trim().slice(0,400)')
          p.write_text(s)
      - name: Commit and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/pivot-ai-v2/index.ts
          git rm .github/workflows/oneoff-add-pivot-reasons-v2.yml
          git commit -m "Store Pivot AI v2 turning point reasons"
          git push
