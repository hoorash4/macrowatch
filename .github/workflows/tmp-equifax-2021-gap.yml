name: tmp Equifax 2021 gap
on:
  push:
    branches: [main]
    paths: [".github/workflows/tmp-equifax-2021-gap.yml"]
permissions:
  contents: read
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check requests
      - name: Upsert verified 2021 observations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os, requests
          url=os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/economic_chart_points?on_conflict=series_code,observation_date'
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          rows=[
            {'series_code':'US_SBDI_31_180','observation_date':'2021-08-01','value':1.70,'frequency':'M','source':'Equifax-public:SBDI31-90+91-180:Equifax-Nov-2021-derived-from-Sep-MoM'},
            {'series_code':'US_SBDFI','observation_date':'2021-08-01','value':2.34,'frequency':'M','source':'Equifax-public:SBDFI:Equifax-Nov-2021-derived-from-Sep-MoM'},
            {'series_code':'US_SBDI_31_180','observation_date':'2021-07-01','value':1.73,'frequency':'M','source':'Equifax-public:SBDI31-90+91-180:Equifax-Sep-2021'},
            {'series_code':'US_SBDFI','observation_date':'2021-07-01','value':2.50,'frequency':'M','source':'Equifax-public:SBDFI:Equifax-Sep-2021'},
            {'series_code':'US_SBDI_31_180','observation_date':'2021-06-01','value':1.75,'frequency':'M','source':'Equifax-public:SBDI31-90+91-180:Equifax-Aug-2021'},
            {'series_code':'US_SBDFI','observation_date':'2021-06-01','value':2.64,'frequency':'M','source':'Equifax-public:SBDFI:Equifax-Aug-2021'},
            {'series_code':'US_SBDI_31_180','observation_date':'2021-05-01','value':1.83,'frequency':'M','source':'Equifax-public:SBDI31-90+91-180:Equifax-Aug-2021-derived-from-Jun-MoM'},
            {'series_code':'US_SBDFI','observation_date':'2021-05-01','value':2.81,'frequency':'M','source':'Equifax-public:SBDFI:Equifax-Aug-2021-derived-from-Jun-MoM'},
          ]
          h={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}
          r=requests.post(url,headers=h,json=rows,timeout=30)
          r.raise_for_status()
          print('upserted',len(rows))
          PY
