name: Verify trend-gated sideways temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-verify-sideways-trend-gate.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Run focused Stage2 assertions
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import date,timedelta
          from historical_pivot_shared import ChartGeometry,PivotPoint
          from historical_pivot_stage1 import SpikeAugmentedPivotResult
          from historical_pivot_stage2 import finalize_sideways_protection

          d=date(2020,1,1)
          g=ChartGeometry(d,d+timedelta(days=100),0.0,10.0,100.0,100.0)

          # Flat highs after falling highs are NOT an uptrend-side sideways.
          highs=(PivotPoint(d+timedelta(days=10),10.0,"high"),PivotPoint(d+timedelta(days=20),8.0,"high"),PivotPoint(d+timedelta(days=80),8.1,"high"))
          lows=(PivotPoint(d+timedelta(days=15),5.0,"low"),PivotPoint(d+timedelta(days=50),4.0,"low"),PivotPoint(d+timedelta(days=90),3.0,"low"))
          s2=finalize_sideways_protection(SpikeAugmentedPivotResult(highs,lows,()),g)
          assert not s2.high_sideways_segments, s2.high_sideways_segments

          # Flat lows after falling lows ARE a downtrend-side sideways.
          highs=(PivotPoint(d+timedelta(days=5),10.0,"high"),PivotPoint(d+timedelta(days=45),9.0,"high"),PivotPoint(d+timedelta(days=95),8.0,"high"))
          lows=(PivotPoint(d+timedelta(days=10),6.0,"low"),PivotPoint(d+timedelta(days=30),4.0,"low"),PivotPoint(d+timedelta(days=80),4.1,"low"))
          s2=finalize_sideways_protection(SpikeAugmentedPivotResult(highs,lows,()),g)
          assert len(s2.low_sideways_segments)==1, s2.low_sideways_segments
          print("FOCUSED_STAGE2_ASSERTIONS_OK")
          PY
      - name: Trace NFCI_RISK after Stage2 fix
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series, ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots, augment_spike_entry_points
          from historical_pivot_stage2 import finalize_sideways_protection
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import prune_same_trend_extremes
          from historical_pivot_stage5 import prune_unconfirmed_retracements

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(
              db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="NFCI_RISK"
          )
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals); pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)
          base=calculate_base_pivots(rows,freq)
          s1=augment_spike_entry_points(base,g)
          s2=finalize_sideways_protection(s1,g)
          s3=simplify_pivot_lines(s2,g)
          s4=prune_same_trend_extremes(s3,g)
          s5=prune_unconfirmed_retracements(s4)

          print("HIGH_SIDEWAYS",[(x.start.day.isoformat(),x.end.day.isoformat(),round(x.angle_deg,4)) for x in s2.high_sideways_segments if x.end.day.year>=2022])
          print("LOW_SIDEWAYS",[(x.start.day.isoformat(),x.end.day.isoformat(),round(x.angle_deg,4)) for x in s2.low_sideways_segments if x.end.day.year>=2022])
          print("S3",[(p.day.isoformat(),round(p.value,6),p.pivot_type) for p in s3.markers if p.day.year>=2022])
          print("S5",[(p.day.isoformat(),round(p.value,6),p.pivot_type) for p in s5.markers if p.day.year>=2022])

          bad=("2023-06-23","2024-08-02")
          assert not any(x.start.day.isoformat()==bad[0] and x.end.day.isoformat()==bad[1] for x in s2.high_sideways_segments)
          assert any(x.start.day.isoformat()=="2024-03-08" and x.end.day.isoformat()=="2024-12-27" for x in s2.low_sideways_segments)
          PY
