name: Diagnose Earnings V2 income accounts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Print KB Financial income-statement accounts
        env:
          PYTHONPATH: backend
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          DART_DIAGNOSE_CORP_CODE: "00688996"
          DART_DIAGNOSE_YEAR: "2025"
          DART_DIAGNOSE_QUARTER: "4"
          DART_DIAGNOSE_SCOPE: "CFS"
        run: python -m earnings_v2.diagnose_income_accounts
