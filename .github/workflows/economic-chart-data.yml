name: Refresh economic chart data

on:
  schedule:
    # 매일 07:30 KST. 모든 경제지표 차트의 최근 신규 관측값을 한 번에 추가합니다.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: economic-chart-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Collect regular economic and business-credit series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python -m signals.economic_chart_automatic
          PYTHONPATH=backend python -m signals.business_credit_monthly
      - name: Require PayNet login for direct delinquency/default data
        env:
          PAYNET_USERNAME: ${{ secrets.PAYNET_USERNAME }}
          PAYNET_PASSWORD: ${{ secrets.PAYNET_PASSWORD }}
        run: test -n "$PAYNET_USERNAME" && test -n "$PAYNET_PASSWORD"
      - name: Install PayNet browser dependency
        run: |
          pip install --disable-pip-version-check playwright
          playwright install chromium
      - name: Collect direct PayNet 31-180 delinquency and SBDFI
        env:
          PAYNET_USERNAME: ${{ secrets.PAYNET_USERNAME }}
          PAYNET_PASSWORD: ${{ secrets.PAYNET_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python -m signals.paynet_monthly
