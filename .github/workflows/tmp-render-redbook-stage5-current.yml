name: Trace US10Y_REAL Stage3 temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-render-redbook-stage5-current.yml"

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Trace US10Y_REAL Stage3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots, augment_spike_entry_points
          from historical_pivot_stage2 import finalize_sideways_protection
          from historical_pivot_stage3 import simplify_pivot_lines

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(
              db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US10Y_REAL"
          )
          raw=normalize_rows(rows)
          vals=[p.value for p in raw]
          lo,hi=min(vals),max(vals)
          pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          base=calculate_base_pivots(rows,freq)
          s1=augment_spike_entry_points(base,g)
          s2=finalize_sideways_protection(s1,g)
          s3=simplify_pivot_lines(s2,g)

          print("STAGE3_MARKERS",[(p.day.isoformat(),float(p.value),p.pivot_type) for p in s3.markers])
          print("STAGE3_SEGMENTS",[(s.start.day.isoformat(),float(s.start.value),s.end.day.isoformat(),float(s.end.value),s.kind) for s in s3.segments])
          print("PROTECTED",[(p.day.isoformat(),float(p.value),p.pivot_type) for p in s3.protected_points])
          PY
