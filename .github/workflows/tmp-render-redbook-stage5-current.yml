name: Recalculate tightening 2022 pivots temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-render-redbook-stage5-current.yml"

permissions:
  contents: read

jobs:
  recalculate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Recalculate and store tightening 2022 pivots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALGORITHM_VERSION: ${{ github.sha }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          import os
          import traceback

          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots, augment_spike_entry_points
          from historical_pivot_stage2 import finalize_sideways_protection
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import prune_same_trend_extremes
          from historical_pivot_stage5 import prune_unconfirmed_retracements
          from historical_pivot_store import store_pipeline_result

          CASE="tightening_2022"
          INDEX="NASDAQ_COMPOSITE"
          VERSION=os.environ["ALGORITHM_VERSION"]

          db=SupabaseRest()
          refs=db.request("GET","historical_indicator_ai_analysis",params={
              "select":"series_code,index_code",
              "case_code":f"eq.{CASE}",
              "index_code":f"eq.{INDEX}",
              "order":"series_code.asc",
          }) or []
          series_codes=sorted({str(r["series_code"]) for r in refs if r.get("series_code")})
          print("SERIES_COUNT",len(series_codes))

          ok=[]
          errors=[]
          for n,series in enumerate(series_codes,1):
              print(f"[{n}/{len(series_codes)}] {series}")
              try:
                  rows,freq,start,end=load_case_series(
                      db,case_code=CASE,index_code=INDEX,series_code=series
                  )
                  raw=normalize_rows(rows)
                  vals=[p.value for p in raw if start<=p.day<=end]
                  lo,hi=min(vals),max(vals)
                  pad=(hi-lo)*.08 if hi!=lo else 1.0
                  geometry=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

                  base=calculate_base_pivots(rows,freq)
                  stage1=augment_spike_entry_points(base,geometry)
                  stage2=finalize_sideways_protection(stage1,geometry)
                  stage3=simplify_pivot_lines(stage2,geometry)
                  stage4=prune_same_trend_extremes(stage3,geometry)
                  final=prune_unconfirmed_retracements(stage4)

                  stored=store_pipeline_result(
                      db,
                      case_code=CASE,
                      index_code=INDEX,
                      series_code=series,
                      algorithm_version=VERSION,
                      source_rows=rows,
                      frequency=freq,
                      buffer_start=start,
                      buffer_end=end,
                      base=base,
                      stage1=stage1,
                      stage2=stage2,
                      stage3=stage3,
                      stage4=stage4,
                      final=final,
                  )
                  ok.append((series,stored,len(final.markers)))
                  print(" STORED",stored,"FINAL_MARKERS",len(final.markers))
              except Exception as exc:
                  traceback.print_exc()
                  errors.append((series,f"{type(exc).__name__}: {exc}"))

          print("DONE",{"total":len(series_codes),"ok":len(ok),"errors":len(errors)})
          if errors:
              print("ERRORS",errors)
              raise SystemExit(1)
          PY
