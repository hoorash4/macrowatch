name: Render NFCI_RISK Stage2 temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-render-redbook-stage5-current.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt matplotlib
      - name: Render NFCI_RISK Stage 3 and Stage 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          import matplotlib.pyplot as plt
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots, augment_spike_entry_points
          from historical_pivot_stage2 import finalize_sideways_protection
          from historical_pivot_stage3 import simplify_pivot_lines, _consensus_runs, _build_waves, _unique
          from historical_pivot_stage4 import prune_same_trend_extremes
          from historical_pivot_stage5 import prune_unconfirmed_retracements

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(
              db,
              case_code="tightening_2022",
              index_code="NASDAQ_COMPOSITE",
              series_code="NFCI_RISK",
          )
          raw=normalize_rows(rows)
          vals=[p.value for p in raw]
          lo,hi=min(vals),max(vals)
          pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          base=calculate_base_pivots(rows,freq)
          s1=augment_spike_entry_points(base,g)
          s2=finalize_sideways_protection(s1,g)
          s3=simplify_pivot_lines(s2,g)
          s4=prune_same_trend_extremes(s3,g)
          s5=prune_unconfirmed_retracements(s4)

          def render_stage2(result,title,path):
              fig,ax=plt.subplots(figsize=(14,7))
              ax.plot([p.day for p in raw],[p.value for p in raw],linewidth=1.1,label="NFCI_RISK raw")
              highs=sorted(result.high_pivots,key=lambda p:p.day)
              lows=sorted(result.low_pivots,key=lambda p:p.day)
              if highs:
                  ax.plot([p.day for p in highs],[p.value for p in highs],marker="o",linewidth=2.0,label="Stage 2 high")
              if lows:
                  ax.plot([p.day for p in lows],[p.value for p in lows],marker="o",linewidth=2.0,label="Stage 2 low")
              for p in [*highs,*lows]:
                  ax.annotate(p.day.strftime("%Y-%m-%d"),(p.day,p.value),xytext=(0,8),textcoords="offset points",ha="center",fontsize=7)
              ax.set_title(f"NFCI_RISK · tightening_2022 · {title}")
              ax.set_ylabel("Index")
              ax.grid(True,alpha=.25)
              ax.legend()
              fig.tight_layout()
              fig.savefig(path,dpi=180)
              plt.close(fig)

          def render(result,title,path):
              fig,ax=plt.subplots(figsize=(14,7))
              ax.plot([p.day for p in raw],[p.value for p in raw],linewidth=1.1,label="NFCI_RISK raw")
              ordered=sorted(result.markers,key=lambda p:(p.day,p.pivot_type))
              ax.plot([p.day for p in ordered],[p.value for p in ordered],marker="o",linewidth=2.2,label=title)
              for p in ordered:
                  ax.annotate(p.day.strftime("%Y-%m-%d"),(p.day,p.value),xytext=(0,8),textcoords="offset points",ha="center",fontsize=7)
              ax.set_title(f"NFCI_RISK · tightening_2022 · {title}")
              ax.set_ylabel("Index")
              ax.grid(True,alpha=.25)
              ax.legend()
              fig.tight_layout()
              fig.savefig(path,dpi=180)
              plt.close(fig)

          print("S2_MARKERS",[(p.day.isoformat(),float(p.value),p.pivot_type) for p in s2.display_markers])
          print("S2_LOW",[(p.day.isoformat(),float(p.value),p.pivot_type) for p in s2.low_pivots])
          print("S2_HIGH",[(p.day.isoformat(),float(p.value),p.pivot_type) for p in s2.high_pivots])
          merged=_unique([*s2.high_pivots,*s2.low_pivots])
          runs=_consensus_runs(merged)
          waves=_build_waves(merged,runs,forced_anchor=None)
          print("CONSENSUS_RUNS",[
              (r.direction,
               [(a.isoformat(),b.isoformat(),hl.start.day.isoformat(),hl.end.day.isoformat(),ll.start.day.isoformat(),ll.end.day.isoformat())
                for a,b,hl,ll in r.intervals])
              for r in runs
          ])
          print("WAVES",[(w.direction,w.start.day.isoformat(),float(w.start.value),w.start.pivot_type,w.end.day.isoformat(),float(w.end.value),w.end.pivot_type) for w in waves])
          print("S3_MARKERS",[(p.day.isoformat(),float(p.value),p.pivot_type) for p in s3.markers])
          print("S3_RAPID_CAND",[
              (x.start.day.isoformat(),float(x.start.value),x.start.pivot_type,
               x.end.day.isoformat(),float(x.end.value),x.end.pivot_type,
               x.direction,float(x.visual_y_share))
              for x in s3.rapid_move_candidates
          ])
          print("S3_PROV",[(p.day.isoformat(),float(p.value),p.pivot_type) for p in s3.provisional_protected_points])
          print("S4_CONF",[(p.day.isoformat(),float(p.value),p.pivot_type) for p in s4.protected_points])
          print("S4_PROV",[(p.day.isoformat(),float(p.value),p.pivot_type) for p in s4.provisional_protected_points])
          print("S4_CAND",[
              (x.start.day.isoformat(),float(x.start.value),x.start.pivot_type,
               x.end.day.isoformat(),float(x.end.value),x.end.pivot_type,
               x.direction,float(x.visual_y_share))
              for x in s4.rapid_move_candidates
          ])
          print("S5_MARKERS",[(p.day.isoformat(),float(p.value),p.pivot_type) for p in s5.markers])
          render_stage2(s2,"Stage 2","nfci_risk_stage2.png")
          PY
      - name: Upload charts
        uses: actions/upload-artifact@v4
        with:
          name: nfci-risk-stage2
          path: nfci_risk_stage2.png
