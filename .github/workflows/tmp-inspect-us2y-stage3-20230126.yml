name: Inspect US2Y Stage3 2023-01-26 temp
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-inspect-us2y-stage3-20230126.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Inspect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          import historical_pivot_stage3 as s3m

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US2Y")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals); pad=(hi-lo)*.08 if hi!=lo else 1
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)

          target=("2023-01-26",4.17)

          print("S2_HIGHS",[(p.day.isoformat(),p.value,p.pivot_type) for p in s2.high_pivots])
          print("S2_LOWS",[(p.day.isoformat(),p.value,p.pivot_type) for p in s2.low_pivots])
          print("RAPID",[(x.start.day.isoformat(),x.start.value,x.end.day.isoformat(),x.end.value,x.direction) for x in s2.rapid_move_candidates])
          print("SIDEWAYS_H",[(x.start.day.isoformat(),x.start.value,x.end.day.isoformat(),x.end.value,x.protected) for x in s2.high_sideways_segments])
          print("SIDEWAYS_L",[(x.start.day.isoformat(),x.start.value,x.end.day.isoformat(),x.end.value,x.protected) for x in s2.low_sideways_segments])

          marker_only_spikes=tuple(spike for spike in s2.spike_peaks if spike.marker_only)
          marker_only_keys={s3m._key(spike.point) for spike in marker_only_spikes}
          merge_target_keys=s3m._transient_excursion_keys(s2,g)
          print("MERGE_TARGETS",[(d.isoformat(),v,t) for d,v,t in sorted(merge_target_keys)])

          points=s3m._unique(tuple(
              p for p in (*s2.high_pivots,*s2.low_pivots)
              if s3m._key(p) not in marker_only_keys and s3m._key(p) not in merge_target_keys
          ))
          print("POINTS_AFTER_EXCLUSIONS",[(p.day.isoformat(),p.value,p.pivot_type) for p in points])

          runs=s3m._consensus_runs(points)
          print("RUNS",[(r.direction,[(a.isoformat(),b.isoformat(),hl.start.day.isoformat(),hl.end.day.isoformat(),ll.start.day.isoformat(),ll.end.day.isoformat()) for a,b,hl,ll in r.intervals]) for r in runs])

          base=s3m._merge_window(points)
          print("BASE_VERTICES",[(p.day.isoformat(),p.value,p.pivot_type) for p in base])

          hard=s3m._hard_segments(s2)
          print("HARD",[(x.start.day.isoformat(),x.start.value,x.end.day.isoformat(),x.end.value,x.kind) for x in hard])

          filtered_base=[
              p for p in base
              if not any(h.start.day < p.day < h.end.day for h in hard)
          ]
          print("FILTERED_BASE",[(p.day.isoformat(),p.value,p.pivot_type) for p in filtered_base])

          structural={s3m._key(p):p for p in filtered_base}
          for candidate in s2.rapid_move_candidates:
              structural[s3m._key(candidate.start)]=candidate.start
              structural[s3m._key(candidate.end)]=candidate.end
          for h in hard:
              structural[s3m._key(h.start)]=h.start
              structural[s3m._key(h.end)]=h.end
          structural_points=sorted(structural.values(),key=lambda p:(p.day,p.pivot_type))
          print("STRUCTURAL",[(p.day.isoformat(),p.value,p.pivot_type) for p in structural_points])

          result=s3m.simplify_pivot_lines(s2,g)
          print("STAGE3",[(p.day.isoformat(),p.value) for p in result.markers])
          PY
