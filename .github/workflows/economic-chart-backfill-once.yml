name: Economic chart backfill once

on:
  # One explicit push-triggered run is used for the user-requested Korean export backfill.
  # Remove this push trigger after the run completes; normal backfills remain manual-only.
  push:
    paths:
      - ".github/workflows/economic-chart-backfill-once.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Backfill target
        required: true
        default: kospi-valuation
        type: choice
        options:
          - kospi-valuation
          - census-retail
          - korea-export
          - all

permissions:
  contents: read

concurrency:
  group: economic-chart-backfill-once
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Backfill selected economic chart series
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target != 'korea-export' }}
        env:
          PYTHONPATH: backend
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m signals.economic_chart_backfill --only "${{ inputs.target }}"
      - name: Backfill Korean export history
        if: ${{ github.event_name == 'push' || inputs.target == 'korea-export' || inputs.target == 'all' }}
        env:
          PYTHONPATH: backend
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m signals.korea_export_backfill
