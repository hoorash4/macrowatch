name: Economic chart backfill once

on:
  push:
    paths:
      - ".github/workflows/economic-chart-backfill-once.yml"

permissions:
  contents: read

concurrency:
  group: economic-chart-backfill-once
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Inspect KCS trade release pagination
        env:
          PYTHONPATH: backend
        run: python -m signals.korea_export_kcs_diagnostic
