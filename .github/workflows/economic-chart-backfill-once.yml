name: Economic chart backfill once

on:
  push:
    paths:
      - ".github/workflows/economic-chart-backfill-once.yml"

permissions:
  contents: read

concurrency:
  group: economic-chart-backfill-once
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Backfill official KCS intra-month export data
        env:
          PYTHONPATH: backend
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m signals.korea_export_backfill
