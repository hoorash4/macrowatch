name: Temporary approved life API probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe approved API
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          key=os.environ["DATA_GO_KR_SERVICE_KEY"]
          base="https://apis.data.go.kr/1160100/service/GetLifeInsuCompInfoService/"
          for op in ["getLifeInsuCompGeneInfo","getLifeInsuCompFinaInfo"]:
              for ym in ["201309","202412"]:
                  q=urllib.parse.urlencode({"serviceKey":key,"resultType":"json","pageNo":1,"numOfRows":9999,"basYm":ym})
                  try:
                      with urllib.request.urlopen(base+op+"?"+q,timeout=60) as r:
                          body=r.read().decode("utf-8","replace")
                      obj=json.loads(body)
                      rb=obj.get("response",{}).get("body",{})
                      items=rb.get("items",{}).get("item",[])
                      if isinstance(items,dict): items=[items]
                      sams=[x for x in items if "삼성생명" in str(x.get("fncoNm",""))]
                      print("RESULT",op,ym,"TOTAL",rb.get("totalCount"),"RECEIVED",len(items),"SAMSUNG",len(sams))
                      for x in sams[:30]: print("ROW",json.dumps(x,ensure_ascii=False))
                  except urllib.error.HTTPError as e:
                      print("HTTP_ERROR",op,ym,e.code,e.read().decode("utf-8","replace")[:1000])
                  except Exception as e:
                      print("ERROR",op,ym,repr(e))
          PY
