name: One-off pivot detail UI cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-pivot-detail-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply patch
        run: python tools/patch_pivot_ui.py
      - name: Verify patch
        run: |
          ! grep -R "0점 · 범위 근접\|범위 근접" -n assets/js/historical-insight historical-insight.html
          node --check assets/js/historical-insight/historical-insight.js
      - name: Commit result
        run: |
          git config user.name "hoorash4"
          git config user.email "hoorash4@gmail.com"
          rm .github/workflows/oneoff-pivot-detail-ui.yml tools/patch_pivot_ui.py
          git add assets/js/historical-insight/historical-insight.js assets/css/historical-insight.css historical-insight.html .github/workflows/oneoff-pivot-detail-ui.yml tools/patch_pivot_ui.py
          git commit -m "Polish pivot detail reasons and remove stale near-range label"
          git push
