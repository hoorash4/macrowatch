name: tmp PayNet endpoint inspect

on:
  push:
    branches: [main]
    paths: [".github/workflows/tmp-paynet-endpoint-inspect.yml"]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Inspect US and Canada page source
        run: |
          python - <<'PY' > paynet-source.txt 2>&1
          import re, requests
          from urllib.parse import urljoin
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/143 Safari/537.36'}
          for root in ['https://sbinsights.paynetonline.ca/loan-performance/','https://sbinsights.paynetonline.com/loan-performance/']:
              try:
                  r=requests.get(root,headers=H,timeout=30)
                  print('\nROOT',root,'STATUS',r.status_code,'LEN',len(r.text))
                  print(r.text[:2000])
                  if r.status_code != 200: continue
                  scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',r.text,re.I)
                  for src in scripts:
                      u=urljoin(root,src)
                      try:
                          s=requests.get(u,headers=H,timeout=30)
                          if s.status_code==200 and re.search(r'31-180|SBDI|SBDFI|loan.performance|ajax|chart',s.text,re.I):
                              print('\nSCRIPT',u,'LEN',len(s.text))
                              print(s.text)
                      except Exception as e: print('SCRIPTERR',u,e)
                  for pat in [r'url\s*:\s*["\'][^"\']+',r'/api/[^"\' ]+',r'/umbraco/[^"\' ]+',r'ajax[^"\' ]+',r'31-180.{0,300}']:
                      print('\nPAT',pat)
                      for m in re.finditer(pat,r.text,re.I|re.S): print(m.group(0)[:1000])
              except Exception as e: print('ROOTERR',root,type(e).__name__,e)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paynet-source
          path: paynet-source.txt
