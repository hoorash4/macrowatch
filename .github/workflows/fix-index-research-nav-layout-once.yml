name: Rebuild index research navigation grouping

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-index-research-nav-layout-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rebuild research navigation as one isolated group
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = ('          <span class="dashboard-nav-tool-divider" aria-hidden="true"></span>\n'
                 '          <a class="dashboard-nav-item dashboard-nav-tool" href="economic-charts.html"><i class="fa-solid fa-chart-line"></i><span>경제지표 챠트</span></a>\n'
                 '          <a class="dashboard-nav-item dashboard-nav-tool" href="historical-insight.html"><i class="fa-solid fa-clock-rotate-left"></i><span>히스토리컬 인사이트</span></a>')
          new = ('          <span class="dashboard-research-tools">\n'
                 '            <a class="dashboard-nav-item dashboard-nav-tool" href="economic-charts.html"><i class="fa-solid fa-chart-line"></i><span>경제지표 챠트</span></a>\n'
                 '            <a class="dashboard-nav-item dashboard-nav-tool" href="historical-insight.html"><i class="fa-solid fa-clock-rotate-left"></i><span>히스토리컬 인사이트</span></a>\n'
                 '          </span>')
          if old not in text:
              raise SystemExit('current research navigation block not found')
          text = text.replace(old, new, 1)
          text = re.sub(r'assets/css/styles\.css\?v=\d+', 'assets/css/styles.css?v=194', text, count=1)
          index.write_text(text, encoding='utf-8')

          styles = Path('assets/css/styles.css')
          css = styles.read_text(encoding='utf-8')
          marker = '/* Final isolated research navigation group: divider is mathematically centered. */'
          rule = (
              '\n\n/* Final isolated research navigation group: divider is mathematically centered. */\n'
              '.dashboard-research-tools{--research-nav-gap:clamp(.7rem,1.35vw,1.35rem);position:relative;display:flex;align-items:center;gap:var(--research-nav-gap);padding-left:var(--research-nav-gap)}\n'
              '.dashboard-research-tools::before{position:absolute;top:50%;left:0;width:1px;height:1.2rem;content:"";background:rgba(20,36,51,.18);transform:translate(-50%,-50%);pointer-events:none}\n'
              '.dashboard-research-tools .dashboard-nav-tool{margin:0!important;padding:.42rem 0!important}\n'
              '.dashboard-research-tools .dashboard-nav-tool::after{left:0!important;right:0!important}\n'
              '.dashboard-nav-tool-divider{display:none!important}\n'
              '.dashboard-nav-tool-group-start{margin-left:0!important;padding-left:0!important}\n'
              '.dashboard-nav-tool-group-start::before{display:none!important}\n'
              '.dashboard-nav-tool-group-start::after{left:0!important}\n'
              'html[data-theme="dark"] .dashboard-research-tools::before{background:rgba(203,213,225,.22)}\n'
              '@media(max-width:1180px){.dashboard-research-tools{--research-nav-gap:clamp(.55rem,1vw,.9rem)}}\n'
          )
          if marker not in css:
              styles.write_text(css + rule, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "MacroWatch Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/css/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Isolate and center research navigation group"
          git push origin main
