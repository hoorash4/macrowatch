name: Earnings V2.5 raw DART diagnostic

on:
  push:
    paths:
      - ".github/workflows/earnings-v25-raw-diagnostic.yml"
      - "backend/earnings_v25/diagnose_raw.py"
  workflow_dispatch:
    inputs:
      year:
        description: Fiscal year (2016-2018 only)
        required: true
        default: "2016"
        type: choice
        options: ["2016", "2017", "2018"]
      quarter:
        description: One fiscal quarter
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3", "4"]

permissions:
  contents: read

concurrency:
  group: earnings-v25-raw-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Inspect pending raw DART filings without database writes
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: backend
          EARNINGS_V2_DEADLINE_SECONDS: "1200"
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          EARNINGS_FINANCIAL_SOURCE_TOKEN: ${{ secrets.EARNINGS_FINANCIAL_SOURCE_TOKEN }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m unittest discover -s tests -p "test_earnings_v2*.py" -q
          for period in 2016:1 2016:3 2016:4 2018:1 2018:2 2018:3; do
            python -m earnings_v25.cli --year "${period%:*}" --quarter "${period#*:}" --pending-only --write
          done

