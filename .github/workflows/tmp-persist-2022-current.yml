name: Persist 2022 Historical current logic temp
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-persist-2022-current.yml"
permissions: {contents: read}
jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Build US+GLOBAL Historical candidates from economic chart registry
        run: |
          node - <<'NODE' > /tmp/candidates.json
          global.window={};
          require('./assets/js/charts/economic-series-catalog.js');
          const out=window.MacroWatchEconomicSeriesRegistry.allSeries
            .filter(item=>['US','GLOBAL'].includes(item.marketScope))
            .map(item=>({code:item.code,frequency:item.frequency,marketScope:item.marketScope}));
          process.stdout.write(JSON.stringify(out));
          NODE
      - name: Verify current pivot rules
        run: |
          PYTHONPATH=backend python -m unittest             tests.test_historical_pivot_protection_semantics             tests.test_historical_pivot_stage2             tests.test_historical_pivot_store
      - name: Recalculate and persist eligible 2022 Historical indicators
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import date,timedelta
          import json

          from common import SupabaseRest
          from historical_pivot_base import _get_rows_paginated,_single_row
          from historical_pivot_shared import ChartGeometry,normalize_rows,buffer_bounds
          from historical_pivot_stage1 import calculate_base_pivots,PIVOT_POLICIES
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements
          from historical_pivot_store import store_pipeline_result

          CASE='tightening_2022'
          INDEX='NASDAQ_COMPOSITE'
          ALGO='stage6-frontend-950x464-pad8-sideways5-no-xgap-v2'
          W=950.0; H=464.0; SX=W*.12; TX=W*.88

          with open('/tmp/candidates.json','r',encoding='utf-8') as f:
              candidates=json.load(f)

          db=SupabaseRest()
          cyc=_single_row(db,'historical_case_market_cycles',{
              'select':'start_date,trough_date',
              'case_code':f'eq.{CASE}',
              'index_code':f'eq.{INDEX}',
              'limit':'2',
          })
          start=date.fromisoformat(str(cyc['start_date'])[:10])
          trough=date.fromisoformat(str(cyc['trough_date'])[:10])
          bs,be=buffer_bounds(start,trough)

          ppd=(TX-SX)/(trough-start).days
          ds=start-timedelta(days=SX/ppd)
          de=trough+timedelta(days=(W-TX)/ppd)

          cov_rows=_get_rows_paginated(db,'economic_chart_series_coverage',{
              'select':'series_code,first_date,last_date,point_count',
              'order':'series_code.asc',
          })
          coverage={str(r['series_code']):r for r in cov_rows}

          eligible=[]
          excluded=[]
          for item in candidates:
              cv=coverage.get(item['code'])
              if cv and str(cv['first_date'])[:10] <= bs.isoformat() and str(cv['last_date'])[:10] >= be.isoformat():
                  eligible.append(item)
              else:
                  excluded.append({
                      **item,
                      'first_date':None if not cv else str(cv['first_date'])[:10],
                      'last_date':None if not cv else str(cv['last_date'])[:10],
                  })

          stored=[]; unsupported=[]; failed=[]
          for item in eligible:
              code=item['code']; freq=item['frequency']
              if freq not in PIVOT_POLICIES:
                  unsupported.append(item)
                  print('UNSUPPORTED',json.dumps(item,ensure_ascii=False))
                  continue
              try:
                  rows=_get_rows_paginated(db,'economic_chart_series_points',{
                      'select':'observation_date,value,frequency',
                      'series_code':f'eq.{code}',
                      'observation_date':f'gte.{bs.isoformat()}',
                      'and':f'(observation_date.lte.{be.isoformat()})',
                      'order':'observation_date.asc',
                  })
                  if not rows:
                      raise RuntimeError('no source rows in required buffer')
                  raw=normalize_rows(rows)
                  vis=[p for p in raw if ds<=p.day<=de]
                  if not vis:
                      raise RuntimeError('no points inside analytical frame')
                  lo=min(p.value for p in vis); hi=max(p.value for p in vis)
                  span=hi-lo
                  ypad=1.0 if span==0 else span*(0.08/0.84)
                  geom=ChartGeometry(ds,de,lo-ypad,hi+ypad,W,H)

                  s1=calculate_base_pivots(rows,freq)
                  s2=classify_special_structures(s1,geom)
                  s3=simplify_pivot_lines(s2,geom)
                  s4=finalize_rapid_moves(s3,geom)
                  s5=prune_same_trend_extremes(s4,geom)
                  s6=prune_unconfirmed_retracements(s5,geom)

                  n=store_pipeline_result(
                      db,
                      case_code=CASE,index_code=INDEX,series_code=code,
                      algorithm_version=ALGO,source_rows=rows,frequency=freq,
                      buffer_start=bs,buffer_end=be,
                      base=s1,stage1=s1,stage2=s2,stage3=s3,stage4=s4,stage5=s5,final=s6,
                  )
                  rec={'series':code,'frequency':freq,'source_points':len(rows),'stage6_pivots':len(s6.markers),'stored':n}
                  stored.append(rec)
                  print('STORED',json.dumps(rec,ensure_ascii=False))
              except Exception as exc:
                  rec={'series':code,'frequency':freq,'error':f'{type(exc).__name__}: {exc}'}
                  failed.append(rec)
                  print('FAILED',json.dumps(rec,ensure_ascii=False))

          print('BUFFER',bs.isoformat(),be.isoformat())
          print('CANDIDATE_COUNT',len(candidates))
          print('ELIGIBLE_COUNT',len(eligible))
          print('EXCLUDED',json.dumps(excluded,ensure_ascii=False))
          print('UNSUPPORTED_ALL',json.dumps(unsupported,ensure_ascii=False))
          print('SUMMARY_JSON',json.dumps({'stored':stored,'failed':failed},ensure_ascii=False))
          if failed:
              raise SystemExit(2)
          PY
