name: Measure US2Y 20pct drop candidates temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-measure-us2y-20pct-drops.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Measure
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows, screen_segment_angle_degrees
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import _entry_before_peak, _visual_y_share

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US2Y")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals); pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)
          s1=calculate_base_pivots(rows,freq)
          lows=tuple(sorted(s1.low_pivots,key=lambda p:p.day))
          highs=tuple(sorted(s1.high_pivots,key=lambda p:p.day))

          for a,b in zip(lows,lows[1:]):
              if b.value >= a.value:
                  continue
              entry=_entry_before_peak(
                  a_point=a,
                  peak=b,
                  opposite_rdp=highs,
                  opposite_candidates=s1.high_candidates,
                  direction="down",
              )
              share=_visual_y_share(entry,b,g)
              if share < 0.20:
                  continue
              xang=screen_segment_angle_degrees(entry,b,g)
              vdev=90.0-abs(xang)
              print("DROP20",
                    "A",a.day.isoformat(),a.value,
                    "ENTRY",entry.day.isoformat(),entry.value,
                    "B",b.day.isoformat(),b.value,
                    "SHARE",share,
                    "X_ANGLE",xang,
                    "Y_AXIS_ANGLE",vdev)
          PY
