name: Patch stale foreign-flow schedule test

on:
  push:
    paths:
      - ".github/workflows/patch-stale-foreign-flow-test.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Remove stale admin-controlled schedule assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_backend.py')
          text = path.read_text(encoding='utf-8')
          workflow_line = '        workflow = (ROOT / ".github/workflows/korea-foreign-flow.yml").read_text(encoding="utf-8")\n'
          assertion_line = '        self.assertIn(\'cron: "20 7 * * 1-5"\', workflow)\n'
          if workflow_line not in text or assertion_line not in text:
              raise SystemExit('stale schedule assertion not found')
          text = text.replace(workflow_line, '', 1).replace(assertion_line, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "MacroWatch CI"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_backend.py
          git commit -m "Stop pinning admin-controlled foreign flow schedule"
          git push
