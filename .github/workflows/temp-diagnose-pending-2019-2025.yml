name: Temporary Diagnose Pending Earnings 2019-2025

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Inspect raw DART and KIS responses
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import json, os, time
          import requests
          from earnings_v2.providers import KIS_BASE, KisClient
          from earnings_v2.repository import EarningsV2Repository

          targets = [
              ("2019Q1","오렌지라이프생명보험","00176792","079440",2019,1),
              ("2019Q2","에스앤케이","01338724","950180",2019,2),
              ("2019Q2","오렌지라이프생명보험","00176792","079440",2019,2),
              ("2019Q3","오렌지라이프생명보험","00176792","079440",2019,3),
              ("2019Q4","오렌지라이프생명보험","00176792","079440",2019,4),
              ("2020Q3","솔브레인","01489648","357780",2020,3),
              ("2020Q4","박셀바이오","01335851","323990",2020,4),
              ("2021Q2","F&F","01568413","383220",2021,2),
              ("2021Q2","박셀바이오","01335851","323990",2021,2),
              ("2021Q2","지에스홈쇼핑","00207755","028150",2021,2),
              ("2021Q3","박셀바이오","01335851","323990",2021,3),
              ("2021Q4","SK스퀘어","01596425","402340",2021,4),
              ("2021Q4","디어유","01456011","376300",2021,4),
              ("2022Q1","넥슨지티","00266943","041140",2022,1),
              ("2022Q1","에스앤케이","01338724","950180",2022,1),
              ("2022Q3","HPSP","01288827","403870",2022,3),
              ("2022Q3","새빗켐","00862880","107600",2022,3),
              ("2023Q2","기가비스","00765569","420770",2023,2),
              ("2023Q4","셀트리온헬스케어","00554024","091990",2023,4),
          ]
          report_codes={1:"11013",2:"11012",3:"11014",4:"11011"}
          dart="https://opendart.fss.or.kr/api"
          session=requests.Session()

          def emit(kind, payload):
              print(kind+" "+json.dumps(payload, ensure_ascii=False, separators=(",",":")), flush=True)

          for period,name,corp,ticker,year,q in targets:
              for fs in ("CFS","OFS"):
                  try:
                      r=session.get(dart+"/fnlttSinglAcntAll.json", params={
                          "crtfc_key":os.environ["OPENDART_API_KEY"],"corp_code":corp,
                          "bsns_year":str(year),"reprt_code":report_codes[q],"fs_div":fs,
                      },timeout=(10,60))
                      data=r.json()
                      rows=data.get("list") or []
                      income=[x for x in rows if str(x.get("sj_div") or "").upper() in {"IS","CIS"}]
                      slim=[{k:x.get(k) for k in ("rcept_no","fs_div","sj_div","account_id","account_nm","thstrm_nm","thstrm_amount","thstrm_add_amount","currency")} for x in income]
                      emit("DART",{"period":period,"name":name,"corp":corp,"fs":fs,"http":r.status_code,
                          "status":data.get("status"),"message":data.get("message"),"rows":len(rows),"income_rows":slim})
                  except Exception as e:
                      emit("DART_ERROR",{"period":period,"name":name,"corp":corp,"fs":fs,"error":type(e).__name__+":"+str(e)})
                  time.sleep(.2)
              try:
                  r=session.get(dart+"/list.json",params={
                      "crtfc_key":os.environ["OPENDART_API_KEY"],"corp_code":corp,
                      "bgn_de":f"{year}0101","end_de":f"{year+1}0630","pblntf_ty":"A","page_count":"100",
                  },timeout=(10,60))
                  data=r.json()
                  filings=[{k:x.get(k) for k in ("rcept_no","report_nm","rcept_dt","corp_name")} for x in (data.get("list") or [])
                           if any(w in str(x.get("report_nm") or "") for w in ("분기보고서","반기보고서","사업보고서"))]
                  emit("FILINGS",{"period":period,"name":name,"status":data.get("status"),"message":data.get("message"),"filings":filings})
              except Exception as e:
                  emit("FILINGS_ERROR",{"period":period,"name":name,"error":type(e).__name__+":"+str(e)})
              time.sleep(.2)

          repo=EarningsV2Repository.from_env()
          kis=KisClient(os.environ["KIS_APP_KEY"],os.environ["KIS_APP_SECRET"],
              cached_token=repo.cached_kis_token,save_token=repo.save_kis_token)
          token=kis._access_token()
          headers={"authorization":f"Bearer {token}","appkey":kis.app_key,"appsecret":kis.app_secret,
                   "tr_id":"FHKST66430200","custtype":"P"}
          seen=set()
          for period,name,corp,ticker,year,q in targets:
              key=(name,ticker)
              if key in seen: continue
              seen.add(key)
              try:
                  r=session.get(KIS_BASE+"/uapi/domestic-stock/v1/finance/income-statement",
                      params={"FID_DIV_CLS_CODE":"1","fid_cond_mrkt_div_code":"J","fid_input_iscd":ticker},
                      headers=headers,timeout=(10,60))
                  data=r.json()
                  slim=[{k:x.get(k) for k in ("stac_yymm","sale_account","bsop_prti","thtr_ntin")}
                        for x in (data.get("output") or []) if str(x.get("stac_yymm") or "").startswith(tuple(str(y) for y in range(year-1,year+2)))]
                  emit("KIS",{"name":name,"ticker":ticker,"http":r.status_code,"rt_cd":data.get("rt_cd"),
                      "msg_cd":data.get("msg_cd"),"msg1":data.get("msg1"),"rows":slim})
              except Exception as e:
                  emit("KIS_ERROR",{"name":name,"ticker":ticker,"error":type(e).__name__+":"+str(e)})
              time.sleep(.7)
          PY
