name: Backfill monthly business-credit charts once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/business-credit-backfill-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-credit-backfill-once
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require PayNet login for direct delinquency/default data
        env:
          PAYNET_USERNAME: ${{ secrets.PAYNET_USERNAME }}
          PAYNET_PASSWORD: ${{ secrets.PAYNET_PASSWORD }}
        run: test -n "$PAYNET_USERNAME" && test -n "$PAYNET_PASSWORD"
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check playwright
          playwright install chromium
      - name: Backfill direct PayNet 31-180 delinquency and SBDFI
        env:
          PAYNET_USERNAME: ${{ secrets.PAYNET_USERNAME }}
          PAYNET_PASSWORD: ${{ secrets.PAYNET_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python -m signals.paynet_backfill
      - name: Recover and revalidate other monthly business-credit charts
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EPIQ_BACKFILL_PAGES: "80"
        run: PYTHONPATH=backend python -m signals.business_credit_backfill
