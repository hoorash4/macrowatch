name: Inspect US2Y Stage5 2018 high temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-inspect-us2y-stage5-2018.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Inspect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows, screen_origin_angle_degrees
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          import historical_pivot_stage5 as s5m

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US2Y")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals); pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)
          s3=simplify_pivot_lines(s2,g)
          s4=finalize_rapid_moves(s3,g)

          line_map={}
          for seg in s4.segments:
              line_map[(seg.start.day,seg.start.value,seg.start.pivot_type)]=seg.start
              line_map[(seg.end.day,seg.end.value,seg.end.pivot_type)]=seg.end
          pts=tuple(sorted(line_map.values(), key=lambda p:(p.day,p.pivot_type)))
          print("POINTS",[(p.day.isoformat(),p.value,p.pivot_type) for p in pts])
          print("PROTECTED",[(p.day.isoformat(),p.value,p.pivot_type) for p in s4.protected_points])
          print("CANDIDATES",[(a.day.isoformat(),a.value,a.pivot_type,b.day.isoformat(),b.value,b.pivot_type) for a,b in s5m._process_window(pts,g,10.0)])
          PY
