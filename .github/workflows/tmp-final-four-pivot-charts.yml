name: Temporary final four pivot charts

on:
  push:
    paths:
      - ".github/workflows/tmp-final-four-pivot-charts.yml"
      - "tools/tmp_render_final_four_pivots.py"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests matplotlib
      - name: Render
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python tools/tmp_render_final_four_pivots.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-four-pivot-charts
          path: tmp_pivot_charts_final/*.png
