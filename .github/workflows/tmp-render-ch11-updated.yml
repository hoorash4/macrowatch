name: Render CH11 updated temp
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-render-ch11-updated.yml"
permissions: {contents: read}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check matplotlib
      - name: Verify and render
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p out
          PYTHONPATH=backend python -m unittest tests.test_historical_pivot_protection_semantics tests.test_historical_pivot_stage2 tests.test_historical_pivot_store
          PYTHONPATH=backend python - <<'PY'
          from datetime import date,timedelta
          import matplotlib.pyplot as plt
          from common import SupabaseRest
          from historical_pivot_base import _get_rows_paginated,_single_row
          from historical_pivot_shared import ChartGeometry,normalize_rows,buffer_bounds
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements

          CASE='tightening_2022'; INDEX='NASDAQ_COMPOSITE'; CODE='US_COMMERCIAL_CH11'
          W=950.; H=464.; SX=W*.12; TX=W*.88
          TOP=H*.08; BOTTOM=H*.08; DATA_H=H-TOP-BOTTOM

          db=SupabaseRest()
          cyc=_single_row(db,'historical_case_market_cycles',{'select':'start_date,trough_date','case_code':f'eq.{CASE}','index_code':f'eq.{INDEX}','limit':'2'})
          s=date.fromisoformat(str(cyc['start_date'])[:10]); t=date.fromisoformat(str(cyc['trough_date'])[:10])
          bs,be=buffer_bounds(s,t)
          ppd=(TX-SX)/(t-s).days
          ds=s-timedelta(days=SX/ppd); de=t+timedelta(days=(W-TX)/ppd)

          rows=_get_rows_paginated(db,'economic_chart_series_points',{'select':'observation_date,value,frequency','series_code':f'eq.{CODE}','observation_date':f'gte.{bs.isoformat()}','and':f'(observation_date.lte.{be.isoformat()})','order':'observation_date.asc'})
          raw=normalize_rows(rows)
          vis=[p for p in raw if ds<=p.day<=de]
          lo=min(p.value for p in vis); hi=max(p.value for p in vis); span=hi-lo
          ypad=1.0 if span==0 else span*(.08/.84)
          ymin=lo-ypad; ymax=hi+ypad
          geom=ChartGeometry(ds,de,ymin,ymax,W,H)

          s1=calculate_base_pivots(rows,rows[0]['frequency'])
          s2=classify_special_structures(s1,geom)
          s3=simplify_pivot_lines(s2,geom)
          s4=finalize_rapid_moves(s3,geom)
          s5=prune_same_trend_extremes(s4,geom)
          s6=prune_unconfirmed_retracements(s5,geom)

          print('S3',[(p.day.isoformat(),p.value) for p in s3.markers])
          print('S4_PROTECTED',[(p.day.isoformat(),p.value) for p in s4.protected_points])
          print('S6',[(p.day.isoformat(),p.value) for p in s6.markers])

          # Keep the analytical scale fixed. Only expand the presentation
          # canvas vertically enough to show all buffer data and labels.
          px_per_value=DATA_H/span if span else 1.0
          raw_min=min(p.value for p in raw); raw_max=max(p.value for p in raw)
          below=max(0.0,(ymin-raw_min)*px_per_value)
          above=max(0.0,(raw_max-ymax)*px_per_value)
          label_pad=34.0
          extra_bottom=below+label_pad
          extra_top=above+label_pad
          display_h=extra_bottom+H+extra_top

          extra_left=(ds-bs).days*ppd
          extra_right=(be-de).days*ppd
          full_w=extra_left+W+extra_right

          def x_of(d): return extra_left+(d-ds).days*ppd
          def y_core(v): return TOP+(v-lo)/span*DATA_H if span else H/2
          def y_of(v): return extra_bottom+y_core(v)

          def render(stage,name):
              scale=2.0; dpi=180
              fig=plt.figure(figsize=((full_w*scale)/dpi,(display_h*scale)/dpi),dpi=dpi)
              ax=fig.add_axes([0,0,1,1])
              ax.plot([scale*x_of(p.day) for p in raw],[scale*y_of(p.value) for p in raw],linewidth=1.35,label='raw')
              for seg in stage.segments:
                  ax.plot([scale*x_of(seg.start.day),scale*x_of(seg.end.day)],[scale*y_of(seg.start.value),scale*y_of(seg.end.value)],linewidth=3.2)
              for p in stage.markers:
                  ax.scatter([scale*x_of(p.day)],[scale*y_of(p.value)],s=38)
                  ax.annotate(p.day.strftime('%Y-%m-%d'),(scale*x_of(p.day),scale*y_of(p.value)),xytext=(0,8),textcoords='offset points',fontsize=7,ha='center')
              frame_left=scale*extra_left
              frame_right=frame_left+scale*W
              frame_bottom=scale*extra_bottom
              frame_top=frame_bottom+scale*H
              ax.axvspan(frame_left,frame_right,alpha=.08)
              ax.axhline(frame_bottom,linestyle=':',linewidth=.8)
              ax.axhline(frame_top,linestyle=':',linewidth=.8)
              ax.axvline(frame_left+scale*SX,linestyle='--',linewidth=1)
              ax.axvline(frame_left+scale*TX,linestyle='--',linewidth=1)
              ax.text(frame_left+scale*SX,frame_top-16,'START',ha='center',va='top',fontsize=9)
              ax.text(frame_left+scale*TX,frame_top-16,'TROUGH',ha='center',va='top',fontsize=9)
              ax.set_xlim(0,scale*full_w); ax.set_ylim(0,scale*display_h)
              ax.set_xticks([]); ax.set_yticks([])
              ax.set_title(name,fontsize=11,pad=10)
              fig.savefig(f'out/{name}.png',dpi=dpi)
              plt.close(fig)

          render(s3,'US_COMMERCIAL_CH11_STAGE3_UPDATED_2X')
          render(s6,'US_COMMERCIAL_CH11_STAGE6_UPDATED_2X')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ch11-updated
          path: out/*.png
          if-no-files-found: error
