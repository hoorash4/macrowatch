name: One-off show A/B detail without matched pivot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-show-ab-detail-without-match.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch detail visibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/historical-insight/historical-insight.js')
          s=p.read_text()
          old="function renderDetail(item){const root=$('historical-indicator-detail');if(!item||activeMode==='history'&&!item.results?.length){root.hidden=true;root.replaceChildren();return;}"
          new="function renderDetail(item){const root=$('historical-indicator-detail'),hasAB=Array.isArray(item?.pivots)&&item.pivots.some(pivot=>['A','B'].includes(String(pivot?.grade||'').toUpperCase()));if(!item||activeMode==='history'&&!item.results?.length&&!hasAB){root.hidden=true;root.replaceChildren();return;}"
          if old not in s: raise SystemExit('renderDetail anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check assets/js/historical-insight/historical-insight.js
      - name: Commit result
        run: |
          git config user.name "hoorash4"
          git config user.email "hoorash4@gmail.com"
          rm .github/workflows/oneoff-show-ab-detail-without-match.yml
          git add assets/js/historical-insight/historical-insight.js .github/workflows/oneoff-show-ab-detail-without-match.yml
          git commit -m "Show A/B reasons without confirmed match"
          git push
