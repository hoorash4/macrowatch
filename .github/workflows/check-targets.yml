name: Check macro targets

on:
  push:
    branches: [main]
    paths: [".github/workflows/check-targets.yml"]
  schedule:
    # GitHub Actions cron uses UTC. Managed from MacroWatch admin.
    - cron: "0 22 * * *"
  workflow_dispatch:

# check_targets.py와 common.py는 같은 실행 단위다. 공통 모듈 변경도 다음 예약 실행부터
# 자동 반영되며, 수동 실행으로 즉시 검증할 수 있다.

permissions:
  contents: read

concurrency:
  group: macro-target-check
  # A scheduled run and a manually started run must never send separate alerts.
  # Keep only the newest run; it aggregates every triggered target into one Kakao message.
  cancel-in-progress: true

jobs:
  check-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check targets and send alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python backend/check_targets.py

