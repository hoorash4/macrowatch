permissions:
  contents: read

concurrency:
  group: macro-target-check
  # A scheduled run and a manually started run must never send separate alerts.
  # Keep only the newest run; it aggregates every triggered target into one Kakao message.
  cancel-in-progress: true

jobs:
  check-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check targets and send alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          EMAIL_ADMIN: ${{ secrets.EMAIL_ADMIN }}
          EMAIL_APP_KEY: ${{ secrets.EMAIL_APP_KEY }}
        run: PYTHONPATH=backend python -m tracking.check_targets

