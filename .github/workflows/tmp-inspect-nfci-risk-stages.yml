name: Inspect NFCI Risk stages temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-inspect-nfci-risk-stages.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Inspect NFCI Risk stages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(
              db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="NFCI_RISK"
          )
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals); pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)
          s3=simplify_pivot_lines(s2,g)
          s4=finalize_rapid_moves(s3,g)
          s5=prune_same_trend_extremes(s4,g)
          s6=prune_unconfirmed_retracements(s5,g)

          def pts(seq):
              return [(p.day.isoformat(),round(float(p.value),6),p.pivot_type) for p in seq]
          def segs(seq):
              return [(s.start.day.isoformat(),s.start.pivot_type,s.end.day.isoformat(),s.end.pivot_type,s.kind) for s in seq]

          print("FREQ",freq,"RANGE",start,end)
          print("S1_HIGH",pts(s1.high_pivots))
          print("S1_LOW",pts(s1.low_pivots))
          print("S1_HCAND",pts(s1.high_candidates))
          print("S1_LCAND",pts(s1.low_candidates))

          print("S2_HIGH",pts(s2.high_pivots))
          print("S2_LOW",pts(s2.low_pivots))
          print("S2_SPIKES",[(x.point.day.isoformat(),None if x.entry is None else x.entry.day.isoformat(),x.marker_only,x.direction,round(x.angle_deg,3)) for x in s2.spike_peaks])
          print("S2_SIDE_H",[(x.start.day.isoformat(),x.end.day.isoformat(),x.protected,x.prior_trend,x.reference_side,round(x.angle_deg,3)) for x in s2.high_sideways_segments])
          print("S2_SIDE_L",[(x.start.day.isoformat(),x.end.day.isoformat(),x.protected,x.prior_trend,x.reference_side,round(x.angle_deg,3)) for x in s2.low_sideways_segments])
          print("S2_RAPID",[(x.start.day.isoformat(),x.end.day.isoformat(),x.direction,round(x.visual_y_share,3)) for x in s2.rapid_move_candidates])
          print("S2_PROV",pts(s2.provisional_protected_points))

          for name,res in [("S3",s3),("S4",s4),("S5",s5),("S6",s6)]:
              print(name+"_MARK",pts(res.markers))
              print(name+"_SEG",segs(res.segments))
              print(name+"_PROT",pts(res.protected_points))
              print(name+"_PROV",pts(res.provisional_protected_points))
              print(name+"_RAPID",[(x.start.day.isoformat(),x.end.day.isoformat(),x.direction,round(x.visual_y_share,3)) for x in res.rapid_move_candidates])

          target="2022-07-01"
          for name,res in [("S3",s3),("S4",s4),("S5",s5),("S6",s6)]:
              endpoints={p.day.isoformat() for s in res.segments for p in (s.start,s.end)}
              marker=[p for p in res.markers if p.day.isoformat()==target]
              if marker:
                  print("TARGET",name,"present","connected",target in endpoints,
                        "protected",any(p.day.isoformat()==target for p in res.protected_points),
                        "provisional",any(p.day.isoformat()==target for p in res.provisional_protected_points))
              else:
                  print("TARGET",name,"absent")
          PY
