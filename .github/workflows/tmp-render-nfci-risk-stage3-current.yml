name: Render NFCI Risk Stage3 current temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-render-nfci-risk-stage3-current.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check matplotlib
      - name: Render NFCI Risk Stage3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p tmp-nfci-risk-stage3-current
          PYTHONPATH=backend python - <<'PY'
          import matplotlib.pyplot as plt
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(
              db,
              case_code="tightening_2022",
              index_code="NASDAQ_COMPOSITE",
              series_code="NFCI_RISK",
          )
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals)
          pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)
          s3=simplify_pivot_lines(s2,g)

          print("S3",[(p.day.isoformat(),round(p.value,6),p.pivot_type) for p in s3.markers])
          print("PROVISIONAL",[(p.day.isoformat(),round(p.value,6),p.pivot_type) for p in s3.provisional_protected_points])

          fig,ax=plt.subplots(figsize=(14,7))
          ax.plot([p.day for p in raw],[p.value for p in raw],linewidth=1.0,label="raw")
          for seg in s3.segments:
              ax.plot([seg.start.day,seg.end.day],[seg.start.value,seg.end.value],linewidth=2.2)
          highs=[p for p in s3.markers if p.pivot_type=="high"]
          lows=[p for p in s3.markers if p.pivot_type=="low"]
          if highs:
              ax.scatter([p.day for p in highs],[p.value for p in highs],s=38,marker="^",label="Stage 3 high")
          if lows:
              ax.scatter([p.day for p in lows],[p.value for p in lows],s=38,marker="v",label="Stage 3 low")
          if s3.provisional_protected_points:
              ax.scatter(
                  [p.day for p in s3.provisional_protected_points],
                  [p.value for p in s3.provisional_protected_points],
                  s=70,facecolors="none",edgecolors="black",linewidths=1.2,
                  label="rapid provisional",
              )
          for p in s3.markers:
              ax.annotate(p.day.strftime("%Y-%m-%d"),(p.day,p.value),xytext=(0,8),textcoords="offset points",fontsize=7,ha="center")
          ax.set_title("NFCI Risk · Stage 3 · current")
          ax.set_xlim(start,end)
          ax.set_ylim(g.y_min,g.y_max)
          ax.grid(True,alpha=.2)
          ax.legend(loc="best")
          fig.tight_layout()
          fig.savefig("tmp-nfci-risk-stage3-current/NFCI_RISK_STAGE3_CURRENT.png",dpi=160)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nfci-risk-stage3-current
          path: tmp-nfci-risk-stage3-current/NFCI_RISK_STAGE3_CURRENT.png
          if-no-files-found: error
