name: tmp patch Equifax legacy URL
on:
  push:
    branches: [main]
    paths: [".github/workflows/tmp-patch-equifax-legacy-url.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch legacy filename and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/sources/paynet_loan_performance.py')
          s=p.read_text()
          needle='        f"small-business-indices-deck-{low}-{year}.pdf",\n'
          repl=needle+'        f"monthly-small-business-indices-{low}-{year}.pdf",\n'
          if 'monthly-small-business-indices-' not in s:
              if needle not in s:
                  raise SystemExit('patch anchor missing')
              s=s.replace(needle,repl,1)
              p.write_text(s)
          Path('.github/workflows/tmp-patch-equifax-legacy-url.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/sources/paynet_loan_performance.py .github/workflows/tmp-patch-equifax-legacy-url.yml
          git commit -m "Support legacy Equifax monthly small-business filenames"
          git push
