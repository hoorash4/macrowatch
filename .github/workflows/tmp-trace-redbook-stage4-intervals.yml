name: Trace REDBOOK Stage4 intervals temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-trace-redbook-stage4-intervals.yml"

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Trace intervals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots, augment_spike_entry_points
          from historical_pivot_stage2 import finalize_sideways_protection
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import _process_window, _sign

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="REDBOOK")
          raw=normalize_rows(rows); vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals); pad=(hi-lo)*.08
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          s1=augment_spike_entry_points(calculate_base_pivots(rows,freq),g)
          s2=finalize_sideways_protection(s1,g)
          s3=simplify_pivot_lines(s2,g)
          points=tuple(sorted(s3.markers,key=lambda p:(p.day,p.pivot_type)))
          print("POINTS",[(i,p.day.isoformat(),p.value,p.pivot_type) for i,p in enumerate(points)])
          starts=[0]
          for idx in range(1,len(points)-1):
              left=_sign(points[idx].value-points[idx-1].value)
              right=_sign(points[idx+1].value-points[idx].value)
              if left!=0 and right!=0 and left!=right:
                  starts.append(idx)
          print("STARTS",starts)
          for s in starts:
              ints=_process_window(points[s:],g,10.0)
              print("FROM",s,points[s].day.isoformat(),[(a.day.isoformat(),a.value,b.day.isoformat(),b.value) for a,b in ints])
          PY
