name: Refresh central-bank policy signals

on:
  workflow_run:
    workflows: ["Deploy Supabase changes"]
    types: [completed]
  schedule:
    # Official FOMC statements are checked daily.  Existing statement hashes are
    # skipped, so days without a new decision do not make an OpenAI request.
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "latest, recent, backfill, reanalyze, or score"
        required: false
        default: "latest"
        type: choice
        options: [latest, recent, backfill, reanalyze, score]

permissions:
  contents: read

concurrency:
  group: macrowatch-central-bank-policy
  cancel-in-progress: false

jobs:
  refresh-fed:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Analyze official FOMC statements
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 산식 코드가 배포된 직후에는 AI를 다시 호출하지 않고 전체 점수만 재계산합니다.
          MODE: ${{ github.event_name == 'workflow_run' && 'score' || inputs.mode || 'latest' }}
        run: |
          run_batch() {
            curl --silent --show-error --fail-with-body --max-time 300 \
              --request POST "$SUPABASE_URL/functions/v1/policy-pipeline" \
              --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              --header "Content-Type: application/json" \
              --data "{\"bank\":\"fed\",\"mode\":\"$MODE\",\"limit\":4}"
          }
          if [ "$MODE" = "backfill" ] || [ "$MODE" = "reanalyze" ]; then
            while true; do
              response=$(run_batch)
              echo "$response"
              [ "$(jq -r '.has_more // false' <<< "$response")" = "true" ] || break
            done
          else
            run_batch
          fi
      - name: Send pending FOMC briefing notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check --quiet requests
          python backend/send_policy_briefing_alerts.py
