name: Temporary debug NFCI Stage4 intervals
on:
  push:
    paths:
      - "tools/tmp_debug_nfci_stage4_intervals.py"
      - ".github/workflows/tmp-debug-nfci-stage4-intervals.yml"
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Debug
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python tools/tmp_debug_nfci_stage4_intervals.py
