name: Apply economic chart contract cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-economic-chart-contracts.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Align tests and chart reads with isolated backfill architecture
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(path, start, end, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              a = text.index(start)
              b = text.index(end, a)
              text = text[:a] + replacement + text[b:]
              p.write_text(text, encoding='utf-8')

          replace_between(
              'tests/test_backend.py',
              '    def test_backfill_entrypoints_are_removed(self) -> None:\n',
              '    def test_scheduled_earnings_runs_still_force_database_writes(self) -> None:\n',
              '''    def test_backfill_entrypoints_are_explicit_and_unscheduled(self) -> None:\n        # Retired Earnings backfill paths stay gone; explicit one-off backfills for\n        # other domains are allowed only when they are physically separate and unscheduled.\n        removed = (\n            ".github/workflows/earnings-us-backfill.yml",\n            ".github/workflows/earnings-us-universe-backfill.yml",\n            ".github/workflows/earnings-v2-historical-batch.yml",\n            ".github/workflows/earnings-v25-backfill.yml",\n            "backend/earnings_us/backfill.py",\n            "backend/earnings_us/backfill_cli.py",\n            "backend/earnings_v2/pipeline.py",\n            "backend/earnings_v2/cli.py",\n        )\n        for relative in removed:\n            self.assertFalse((ROOT / relative).exists(), relative)\n\n        backfill = (ROOT / ".github/workflows/economic-chart-backfill-once.yml").read_text(encoding="utf-8")\n        automatic = (ROOT / ".github/workflows/economic-chart-data.yml").read_text(encoding="utf-8")\n        automatic_code = (ROOT / "backend/signals/economic_chart_automatic.py").read_text(encoding="utf-8")\n        self.assertIn("workflow_dispatch:", backfill)\n        self.assertNotRegex(backfill, r"(?m)^  schedule:")\n        self.assertNotRegex(backfill, r"(?m)^  push:")\n        self.assertNotRegex(backfill, r"(?m)^  workflow_run:")\n        self.assertIn("signals.economic_chart_backfill", backfill)\n        self.assertIn("signals.korea_export_backfill", backfill)\n        self.assertIn("signals.economic_chart_automatic", automatic)\n        self.assertNotIn("signals.economic_chart_backfill", automatic)\n        self.assertNotIn("economic_chart_backfill", automatic_code)\n\n'''
          )

          replace_between(
              'tests/test_economic_charts.py',
              '    def test_economic_chart_collection_separates_automatic_bootstrap_and_alert_checking(self):\n',
              '    def test_core_series_include_fred_ecos_krx_and_derived_spreads(self):\n',
              '''    def test_economic_chart_collection_separates_automatic_and_explicit_backfill(self):\n        automatic_workflow = (ROOT / '.github/workflows/economic-chart-data.yml').read_text(encoding='utf-8')\n        backfill_workflow = (ROOT / '.github/workflows/economic-chart-backfill-once.yml').read_text(encoding='utf-8')\n        automatic = (ROOT / 'backend/signals/economic_chart_automatic.py').read_text(encoding='utf-8')\n        backfill = (ROOT / 'backend/signals/economic_chart_backfill.py').read_text(encoding='utf-8')\n        helpers = (ROOT / 'backend/signals/economic_chart_pipeline.py').read_text(encoding='utf-8')\n        tracker = (ROOT / 'backend/tracking/check_targets.py').read_text(encoding='utf-8')\n\n        self.assertIn('signals.economic_chart_automatic', automatic_workflow)\n        self.assertNotIn('signals.economic_chart_backfill', automatic_workflow)\n        self.assertIn('workflow_dispatch:', backfill_workflow)\n        self.assertNotIn('  schedule:', backfill_workflow)\n        self.assertNotIn('  push:', backfill_workflow)\n        self.assertIn('signals.economic_chart_backfill', backfill_workflow)\n        self.assertIn('signals.korea_export_backfill', backfill_workflow)\n        self.assertNotIn('economic_chart_backfill', automatic)\n        self.assertIn('timedelta(days=45)', automatic)\n        self.assertIn('timedelta(days=3660)', backfill)\n        self.assertNotIn('argparse', helpers)\n        self.assertNotIn('choices=("automatic", "bootstrap")', helpers)\n        self.assertIn('str(row["observation_date"]) not in existing', helpers)\n        self.assertIn('check_collected_series_alerts(db, changed)', automatic)\n        self.assertIn('!= "economic_chart"', tracker)\n        self.assertIn('deliver_queued_alerts(db, targets)', tracker)\n\n    def test_chart_reads_full_primary_history_and_merges_legacy_fallback_only_as_gap_cover(self):\n        script = (ROOT / 'assets/js/charts/economic-charts.js').read_text(encoding='utf-8')\n        backfill = (ROOT / 'backend/signals/economic_chart_backfill.py').read_text(encoding='utf-8')\n        self.assertIn('"US10Y": ("DGS10", "D")', (ROOT / 'backend/signals/economic_chart_pipeline.py').read_text(encoding='utf-8'))\n        self.assertIn('for code, (source_id, frequency) in FRED_SERIES.items()', backfill)\n        self.assertIn('new Map([...fallbackRows,...primaryRows].map', script)\n        self.assertIn("economic_chart_points", script)\n\n    def test_korea_export_is_collected_incrementally_and_backfilled_explicitly(self):\n        automatic = (ROOT / 'backend/signals/economic_chart_automatic.py').read_text(encoding='utf-8')\n        source = (ROOT / 'backend/sources/korea_export_intramonth.py').read_text(encoding='utf-8')\n        backfill = (ROOT / 'backend/signals/korea_export_backfill.py').read_text(encoding='utf-8')\n        self.assertIn('fetch_snapshots(export_start_month, max_pages=6)', automatic)\n        self.assertIn('KR_EXPORT_DAILY_AVG', automatic)\n        self.assertIn('cumulative_export_musd - d10.cumulative_export_musd', source)\n        self.assertIn('cumulative_workdays - d10.cumulative_workdays', source)\n        self.assertIn('cumulative_export_musd - d20.cumulative_export_musd', source)\n        self.assertIn('cumulative_workdays - d20.cumulative_workdays', source)\n        self.assertIn('timedelta(days=3660)', backfill)\n\n'''
          )

          js_path = Path('assets/js/charts/economic-charts.js')
          js = js_path.read_text(encoding='utf-8')
          old = "async function fetchSeries(m){const primary=await queryAll('economic_chart_points','observation_date,value','observation_date',[['series_code',m.code]]);const p=normalize(primary,'observation_date','value');if(p.length)return p;if(!m.fallback)return[];const [t,s,d,v]=m.fallback;return normalize(await queryAll(t,s,d),d,v);}" 
          new = "async function fetchSeries(m){const primary=await queryAll('economic_chart_points','observation_date,value','observation_date',[['series_code',m.code]]);const primaryRows=normalize(primary,'observation_date','value');if(!m.fallback)return primaryRows;const [t,s,d,v]=m.fallback;const fallbackRows=normalize(await queryAll(t,s,d),d,v);const merged=new Map([...fallbackRows,...primaryRows].map(row=>[row.time,row]));return [...merged.values()].sort((a,b)=>a.time.localeCompare(b.time));}"
          if old not in js:
              raise SystemExit('fetchSeries contract not found')
          js = js.replace(old, new)
          js = js.replace("pending:'무료 공식 장기 API가 없어 자체 주간 적재 경로를 준비 중입니다.'", "pending:'무료 장기 이력은 없어 최근 공개값부터 주간으로 자체 적재합니다.'")
          js = js.replace("pending:'관세청 누계 수출액과 조업일수를 구간값으로 변환하는 수집 경로를 준비 중입니다.'", "pending:'관세청 1~10일·1~20일·월말 누계와 조업일수로 독립 구간 일평균을 적재합니다.'")
          js_path.write_text(js, encoding='utf-8')
          PY
      - name: Commit contract cleanup
        run: |
          rm .github/workflows/patch-economic-chart-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_backend.py tests/test_economic_charts.py assets/js/charts/economic-charts.js .github/workflows/patch-economic-chart-contracts.yml
          git commit -m "Align economic chart tests with isolated backfill"
          git push
