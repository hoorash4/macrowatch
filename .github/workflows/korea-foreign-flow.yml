name: Refresh Korea foreign flow

on:
  schedule:
    - cron: "20 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: macrowatch-korea-foreign-flow
  # Keep only the newest run to avoid duplicate collection.
  cancel-in-progress: true

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect and persist KIS and ECOS source observations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --retry 2 --max-time 120 --request POST "$SUPABASE_URL/functions/v1/korea-foreign-flow" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{"collect_only":true}'

  derived:
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Calculate the Korea foreign-flow index from stored observations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --retry 2 --max-time 120 --request POST "$SUPABASE_URL/functions/v1/korea-foreign-flow" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{"finalize_only":true}'
