name: Refresh Korea foreign flow

on:
  schedule:
    - cron: "40 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: macrowatch-korea-foreign-flow
  # Keep only the newest run to avoid duplicate collection.
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect the latest KOSPI foreign flow and save the index
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --retry 2 --max-time 120 --request POST "$SUPABASE_URL/functions/v1/korea-foreign-flow" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}'
