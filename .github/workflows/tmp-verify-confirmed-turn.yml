name: Temporary verify confirmed-turn fix
on:
  push:
    paths:
      - "backend/historical_pivot_base.py"
      - "tests/test_historical_pivot_stage_boundaries.py"
      - "tools/tmp_verify_confirmed_turn.py"
      - ".github/workflows/tmp-verify-confirmed-turn.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytest matplotlib
      - name: Regression tests
        run: PYTHONPATH=backend pytest -q tests/test_historical_pivot_stage_boundaries.py
      - name: Render and assert four charts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python tools/tmp_verify_confirmed_turn.py
      - uses: actions/upload-artifact@v4
        with:
          name: confirmed-turn-four
          path: tmp_confirmed_turn_four/*.png
