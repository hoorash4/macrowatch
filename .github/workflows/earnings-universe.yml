name: Refresh earnings market-cap universes

on:
  schedule:
    # UTC 09:30/09:50 = 18:30/18:50 KST. The retry is harmless because the
    # date snapshot is a complete idempotent replacement.
    - cron: "30 9 * * 1-5"
    - cron: "50 9 * * 1-5"
    # UTC 23:30/23:50 Mon-Fri = 08:30/08:50 KST Tue-Sat, after the
    # preceding U.S. regular session has closed.
    - cron: "30 23 * * 1-5"
    - cron: "50 23 * * 1-5"
  workflow_dispatch:
    inputs:
      index_id:
        description: Market-cap universe to refresh
        required: true
        type: choice
        default: ALL_KR
        options: [ALL, ALL_KR, ALL_US, KOSPI100, KOSDAQ50, SP100, NASDAQ100]

permissions:
  contents: read

concurrency:
  group: macrowatch-earnings-universe
  cancel-in-progress: false

jobs:
  refresh-market-cap-universes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh market-cap snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INDEX_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.index_id || (startsWith(github.event.schedule, '30 23') || startsWith(github.event.schedule, '50 23')) && 'ALL_US' || 'ALL_KR' }}
        run: |
          curl --fail-with-body --retry 2 --max-time 480 \
            --request POST "$SUPABASE_URL/functions/v1/earnings-universe" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"index_id\":\"$INDEX_ID\"}"
