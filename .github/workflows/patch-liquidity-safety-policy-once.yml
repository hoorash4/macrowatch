name: Patch liquidity safety policy once

on:
  push:
    branches: [fix/schedule-reliability-20260912]
    paths:
      - ".github/workflows/patch-liquidity-safety-policy-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/schedule-reliability-20260912
          fetch-depth: 0
      - name: Align verified liquidity safety boundary and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path('supabase/functions/_shared/schedule-policy.ts')
          text = policy.read_text(encoding='utf-8')
          text = text.replace('earliestSafeTimeKst: "18:10",', 'earliestSafeTimeKst: "13:30",', 1)
          text = text.replace('dependencyLabel: "한국은행 및 관련 한국 일별 유동성 원천데이터",', 'dependencyLabel: "한국은행 및 관련 한국 유동성 원천데이터",', 1)
          text = text.replace('dependencyReason: "이 작업은 한국은행 및 관련 원천데이터가 모두 공개된 이후에 실행되어야 합니다.",', 'dependencyReason: "KOFR와 월간 통화·유동성 등 필수 한국 원천데이터가 공개된 이후에 실행되어야 합니다.",', 1)
          policy.write_text(text, encoding='utf-8')

          contracts = Path('tests/test_admin_contracts.ts')
          text = contracts.read_text(encoding='utf-8')
          text = text.replace('assert.throws(() => assertScheduleTime(liquidity, "18:09"), /18:10 KST 이후/);', 'assert.throws(() => assertScheduleTime(liquidity, "13:29"), /13:30 KST 이후/);', 1)
          text = text.replace('assert.doesNotThrow(() => assertScheduleTime(liquidity, "18:10"));', 'assert.doesNotThrow(() => assertScheduleTime(liquidity, "13:30"));', 1)
          text = text.replace('updateAutomationTime("liquidity.yml", "30 4 * * *", "17:59", "test-token"),\n      /18:10 KST 이후/,', 'updateAutomationTime("liquidity.yml", "30 4 * * *", "13:29", "test-token"),\n      /13:30 KST 이후/,', 1)
          text = text.replace('await updateAutomationTime("liquidity.yml", "30 4 * * *", "18:10", "test-token");', 'await updateAutomationTime("liquidity.yml", "30 4 * * *", "13:45", "test-token");', 1)
          text = text.replace('assert.match(decodeBase64Utf8(payload.content), /10 9 \\* \\* \\*/);', 'assert.match(decodeBase64Utf8(payload.content), /45 4 \\* \\* \\*/);', 1)
          contracts.write_text(text, encoding='utf-8')

          guard = Path('tests/test_admin_schedule_guard.js')
          text = guard.read_text(encoding='utf-8')
          text = text.replace("earliest_safe_time_kst: '18:10'", "earliest_safe_time_kst: '13:30'", 1)
          text = text.replace("'17:59'", "'13:29'", 1)
          text = text.replace('/18:10 KST 이후/', '/13:30 KST 이후/', 1)
          guard.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/patch-liquidity-safety-policy-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/schedule-policy.ts tests/test_admin_contracts.ts tests/test_admin_schedule_guard.js .github/workflows/patch-liquidity-safety-policy-once.yml
          git diff --cached --check
          git commit -m "Use verified liquidity source availability boundary"
          git push origin HEAD:fix/schedule-reliability-20260912
