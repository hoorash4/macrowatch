name: Temporary FSC financial API probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe documented financial-company sample history
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          import urllib.parse

          key = os.environ.get("DATA_GO_KR_SERVICE_KEY", "").strip()
          base = "https://apis.data.go.kr/1160100/service/GetFnCoFinaStatCredInfoService_V2/getFnCoSummFinaStat_V2"
          crno = "1101113892240"
          counts = {}
          details = {}
          for year in range(2000, 2027):
              query = urllib.parse.urlencode({
                  "serviceKey": key, "pageNo": 1, "numOfRows": 1000,
                  "resultType": "json", "crno": crno, "bizYear": year,
              }, safe="%")
              proc = subprocess.run(
                  ["curl", "-4", "--http1.1", "--silent", "--show-error", "--fail-with-body",
                   "--connect-timeout", "8", "--max-time", "15", base + "?" + query],
                  text=True, capture_output=True
              )
              if proc.returncode:
                  raise SystemExit(f"network failure year={year}: {proc.stderr.strip()}")
              payload = json.loads(proc.stdout)
              response = payload.get("response", {})
              header = response.get("header", {})
              body = response.get("body", {})
              wrapped = body.get("items", {})
              items = wrapped.get("item", []) if isinstance(wrapped, dict) else wrapped
              if isinstance(items, dict):
                  items = [items]
              if not isinstance(items, list):
                  items = []
              counts[year] = int(body.get("totalCount") or 0)
              if items:
                  details[year] = items
          available = [year for year, total in counts.items() if total > 0]
          print("SAMPLE_CRNO=", crno, flush=True)
          print("COUNTS=", json.dumps(counts, ensure_ascii=False), flush=True)
          print(f"RANGE oldest={min(available) if available else None} newest={max(available) if available else None}", flush=True)
          if available:
              print("OLDEST_ROWS=", json.dumps(details[min(available)], ensure_ascii=False), flush=True)
              print("Y2015_ROWS=", json.dumps(details.get(2015, []), ensure_ascii=False), flush=True)
