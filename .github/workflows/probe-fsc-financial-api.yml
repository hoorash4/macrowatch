name: Temporary FSC financial API probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe FSC history range and KB records
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          import urllib.parse

          key = os.environ.get("DATA_GO_KR_SERVICE_KEY", "").strip()
          if not key:
              raise SystemExit("DATA_GO_KR_SERVICE_KEY is missing")

          base = (
              "https://apis.data.go.kr/1160100/service/"
              "GetFnCoFinaStatCredInfoService_V2/getFnCoSummFinaStat_V2"
          )

          def fetch(year, rows=1):
              query = urllib.parse.urlencode({
                  "serviceKey": key,
                  "numOfRows": rows,
                  "pageNo": 1,
                  "resultType": "json",
                  "bizYear": year,
              }, safe="%")
              proc = subprocess.run(
                  ["curl", "-4", "--http1.1", "--silent", "--show-error", "--fail-with-body",
                   "--connect-timeout", "5", "--max-time", "15", base + "?" + query],
                  text=True, capture_output=True
              )
              if proc.returncode:
                  print(f"year={year} curl_exit={proc.returncode} error={proc.stderr.strip()}", flush=True)
                  return None, []
              payload = json.loads(proc.stdout)
              header = payload.get("FnCoSummFinaStat_header") or payload.get("response", {}).get("header") or {}
              body = payload.get("FnCoSummFinaStat_body") or payload.get("response", {}).get("body") or {}
              wrapped = body.get("items", {})
              items = wrapped.get("item", []) if isinstance(wrapped, dict) else wrapped
              if isinstance(items, dict):
                  items = [items]
              if not isinstance(items, list):
                  items = []
              if str(header.get("resultCode", "00")) != "00":
                  print(f"year={year} api_error={json.dumps(header, ensure_ascii=False)}", flush=True)
              return int(body.get("totalCount") or 0), items

          counts = {}
          for year in range(1990, 2027):
              total, _ = fetch(year)
              counts[year] = total
          available = [year for year, total in counts.items() if total and total > 0]
          print("year_counts=", json.dumps(counts, ensure_ascii=False), flush=True)
          print("oldest_available_year=", min(available) if available else None, flush=True)

          target_years = sorted(set(([min(available)] if available else []) + [2015, 2024, 2025]))
          for year in target_years:
              total, items = fetch(year, 10000)
              matches = []
              for row in items:
                  haystack = " ".join(str(v) for v in row.values())
                  if "국민" in haystack or "KB" in haystack.upper() or "1101113975517" in haystack:
                      matches.append(row)
              print(f"DETAIL year={year} total={total} returned={len(items)}", flush=True)
              print(f"KB_MATCHES_{year}=", json.dumps(matches, ensure_ascii=False), flush=True)
              if year == min(available, default=-1):
                  print("OLDEST_SAMPLE=", json.dumps(items[:10], ensure_ascii=False), flush=True)
