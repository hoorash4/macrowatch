name: Temporary FSC financial API probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify FSC global oldest record and KB coverage
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          import urllib.parse

          key = os.environ.get("DATA_GO_KR_SERVICE_KEY", "").strip()
          base = "https://apis.data.go.kr/1160100/service/GetFnCoFinaStatCredInfoService_V2/getFnCoSummFinaStat_V2"
          query = urllib.parse.urlencode({
              "serviceKey": key, "pageNo": 1, "numOfRows": 1000, "resultType": "json",
          }, safe="%")
          proc = subprocess.run(
              ["curl", "-4", "--http1.1", "--silent", "--show-error", "--fail-with-body",
               "--connect-timeout", "8", "--max-time", "60", base + "?" + query],
              text=True, capture_output=True
          )
          if proc.returncode:
              raise SystemExit(f"request failed: {proc.stderr.strip()}")
          payload = json.loads(proc.stdout)
          response = payload.get("response", {})
          header = response.get("header", {})
          body = response.get("body", {})
          wrapped = body.get("items", {})
          items = wrapped.get("item", []) if isinstance(wrapped, dict) else wrapped
          if isinstance(items, dict):
              items = [items]
          if not isinstance(items, list):
              items = []
          dates = sorted({str(row.get("basDt")) for row in items if row.get("basDt")})
          years = sorted({str(row.get("bizYear")) for row in items if row.get("bizYear")})
          crnos = {str(row.get("crno")) for row in items if row.get("crno")}
          oldest_date = dates[0] if dates else None
          oldest_rows = [row for row in items if str(row.get("basDt")) == str(oldest_date)]
          kb_crnos = {"1101113975517", "1101112365321", "1101110545553"}
          kb_rows = [row for row in items if str(row.get("crno")) in kb_crnos]
          print(f"GLOBAL header={json.dumps(header, ensure_ascii=False)} total={body.get('totalCount')} returned={len(items)} unique_crnos={len(crnos)}", flush=True)
          print(f"RANGE oldest_date={oldest_date} newest_date={dates[-1] if dates else None} oldest_year={years[0] if years else None} newest_year={years[-1] if years else None}", flush=True)
          print("OLDEST_ROWS=", json.dumps(oldest_rows, ensure_ascii=False), flush=True)
          print("KB_ROWS=", json.dumps(kb_rows, ensure_ascii=False), flush=True)
