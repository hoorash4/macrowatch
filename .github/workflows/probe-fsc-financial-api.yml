name: Temporary FSC financial API probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Discover live FSC record and its full history
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          import urllib.parse

          key = os.environ.get("DATA_GO_KR_SERVICE_KEY", "").strip()
          base = "https://apis.data.go.kr/1160100/service/GetFnCoFinaStatCredInfoService_V2/getFnCoSummFinaStat_V2"

          def call(extra, rows, timeout):
              query = urllib.parse.urlencode({
                  "serviceKey": key, "pageNo": 1, "numOfRows": rows,
                  "resultType": "json", **extra,
              }, safe="%")
              proc = subprocess.run(
                  ["curl", "-4", "--http1.1", "--silent", "--show-error", "--fail-with-body",
                   "--connect-timeout", "8", "--max-time", str(timeout), base + "?" + query],
                  text=True, capture_output=True
              )
              if proc.returncode:
                  raise SystemExit(f"request failed: {proc.stderr.strip()}")
              payload = json.loads(proc.stdout)
              response = payload.get("response", {})
              body = response.get("body", {})
              wrapped = body.get("items", {})
              items = wrapped.get("item", []) if isinstance(wrapped, dict) else wrapped
              if isinstance(items, dict):
                  items = [items]
              return response.get("header", {}), body, items if isinstance(items, list) else []

          header, body, items = call({}, 1, 60)
          print(f"LIVE header={json.dumps(header, ensure_ascii=False)} total={body.get('totalCount')} first={json.dumps(items[:1], ensure_ascii=False)}", flush=True)
          if not items:
              raise SystemExit("service returned no live records")
          first = items[0]
          crno = first.get("crno")
          if not crno:
              raise SystemExit("live record has no crno")
          header, body, items = call({"crno": crno}, 1000, 30)
          years = sorted({str(row.get("bizYear")) for row in items if row.get("bizYear")})
          print(f"HISTORY crno={crno} header={json.dumps(header, ensure_ascii=False)} total={body.get('totalCount')} years={json.dumps(years, ensure_ascii=False)}", flush=True)
          print("OLDEST=", json.dumps([row for row in items if str(row.get("bizYear")) == (years[0] if years else "")], ensure_ascii=False), flush=True)
