name: Temporary trace US10Y real 2022-2023
on:
  push:
    paths:
      - "tools/tmp_trace_us10y_real_2022_2023.py"
      - ".github/workflows/tmp-trace-us10y-real-2022-2023.yml"
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Trace
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python tools/tmp_trace_us10y_real_2022_2023.py
