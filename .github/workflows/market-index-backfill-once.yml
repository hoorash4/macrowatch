name: One-time canonical market index backfill

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/market-index-backfill-once.yml
      - backend/signals/market_index_collection.py

permissions:
  contents: read

jobs:
  backfill:
    if: contains(github.event.head_commit.message, 'Run canonical market index backfill')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Backfill canonical indices from 1990
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python -m signals.market_index_collection --mode backfill --start 1990-01-01
      - name: Verify automatic collection path
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python -m signals.market_index_collection --mode automatic
