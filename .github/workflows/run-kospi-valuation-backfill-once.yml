name: Run KOSPI valuation backfill once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-kospi-valuation-backfill-once.yml"

permissions:
  contents: read

concurrency:
  group: kospi-valuation-backfill-once
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Backfill ten years of KOSPI PER/PBR through validated pykrx source
        env:
          PYTHONPATH: backend
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m signals.economic_chart_backfill --only kospi-valuation
