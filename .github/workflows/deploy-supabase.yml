name: Deploy Supabase changes

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macrowatch-supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: xhghpywvthjuvespzdul
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply policy peak scoring schema
        run: |
          jq -Rs '{query: .}' supabase/migrations/20260826_add_policy_previous_peak_scoring.sql > /tmp/policy-peak-migration.json
          curl --silent --show-error --fail-with-body \
            --request POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/policy-peak-migration.json

      - name: Deploy Edge Functions
        run: |
          for fn in supabase/functions/*; do
            name="$(basename "$fn")"
            [ "$name" = "_shared" ] && continue
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
          done
