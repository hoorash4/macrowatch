name: Deploy Supabase changes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-supabase.yml"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/prompts/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macrowatch-supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: xhghpywvthjuvespzdul
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply policy peak scoring schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260826_add_policy_previous_peak_scoring.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260826_allow_uncertain_policy_admin_resolution.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260826_add_policy_normalization_reasons.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260826_allow_admin_policy_reason_override.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260826_remove_admin_activation_state.sql
          # The domestic ETF catalog was a one-time bootstrap. Never replay its
          # data seed here: the admin-managed registry is authoritative after
          # bootstrap, including deletions and newly registered ETFs.
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260827_add_sector_flow_prices.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260827_add_sector_etf_holdings.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260827_allow_raw_sector_etf_holdings.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260827_add_closed_membership_accounts.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260827_add_fomc_briefings.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260827_add_policy_expectation_spreads.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260827_add_em_capital_capacity.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260827_add_korea_foreign_flow.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260828_add_earnings_foundation.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260828_add_earnings_ingestion_ops.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260828_define_market_cap_earnings_universes.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260828_add_open_dart_ingestion_functions.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260828_add_open_dart_financial_worker_functions.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260828_add_open_dart_backfill_filing_identity.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260828_slim_earnings_storage.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260828_add_sec_earnings_functions.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260828_add_sector_intraday_prices.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260828_schedule_sector_flow.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260828_add_equity_bond_relative_value.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260829_add_earnings_growth_metrics.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260829_expand_market_index_prices.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260829_add_company_earnings_price_gaps.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260829_make_target_alerts_retryable.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260829_allow_partial_open_dart_financials.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260829_repair_financial_company_revenues.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260830_make_earnings_universe_collection_dynamic.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260830_add_market_earnings_analysis.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260830_add_quarterly_earnings_universe_reader.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260830_add_market_earnings_averages.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260830160231_label_market_earnings_fallback_averages.sql
          # The 20260831173/174/175 repair migrations contain one-time data
          # quarantine and queue-reset DML. They were applied once and must not
          # be replayed on every deploy; doing so can resurrect completed work.
          # Historical files above are replayed for idempotent deployments.
          # Always finish with the queue split, replay-safe quality schema and
          # the final provider boundary. Older definitions must not reclaim
          # incompatible jobs after a deployment replay.
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260831_add_earnings_collector_variant.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260831235950_finalize_earnings_quality_schema.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260831235960_parallelize_legacy_dart_companies.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260831235980_restore_legacy_earnings_2015.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260831235990_fix_earnings_filing_metadata_merge.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260831235995_repair_legacy_2015_shifted_headers_v3.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260831235997_preserve_legacy_filing_job_priority.sql
          # Final active earnings contract: operating income and net income only.
          # Historical revenue migrations remain above for schema replay, while
          # this migration prevents them from reactivating revenue collection.
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260901011000_remove_earnings_revenue_collection.sql
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/migrations/20260901012000_remove_earnings_revenue_derivatives.sql

      - name: Deploy Edge Functions
        run: |
          for fn in supabase/functions/*; do
            name="$(basename "$fn")"
            [ "$name" = "_shared" ] && continue
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
          done
