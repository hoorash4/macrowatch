name: Deploy Supabase changes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-supabase.yml"
      - "supabase/functions/**"
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      operation:
        description: "Deploy exactly one Supabase resource"
        required: true
        type: choice
        options: [function, migration]
      target:
        description: "Function slug or migration filename"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macrowatch-supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: xhghpywvthjuvespzdul
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve changed Supabase resources
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          OPERATION: ${{ inputs.operation }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          : > /tmp/migrations
          : > /tmp/functions

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$OPERATION" == "migration" ]]; then
              file="supabase/migrations/$TARGET"
              [[ "$TARGET" == *.sql && -f "$file" ]] || { echo "Invalid migration target: $TARGET" >&2; exit 1; }
              printf '%s\n' "$file" > /tmp/migrations
            else
              dir="supabase/functions/$TARGET"
              [[ "$TARGET" != "_shared" && -f "$dir/index.ts" ]] || { echo "Invalid function target: $TARGET" >&2; exit 1; }
              printf '%s\n' "$TARGET" > /tmp/functions
            fi
          else
            before="$BEFORE_SHA"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              before="${GITHUB_SHA}^"
            fi

            # Migration history is immutable. A schema change must be a new
            # migration, never an edit/replay of an old one.
            changed_old="$(git diff --name-only --diff-filter=MD "$before" "$GITHUB_SHA" -- 'supabase/migrations/*.sql')"
            if [[ -n "$changed_old" ]]; then
              echo "Existing migrations must not be modified or deleted:" >&2
              echo "$changed_old" >&2
              echo "Create a new migration instead." >&2
              exit 1
            fi
            git diff --name-only --diff-filter=A "$before" "$GITHUB_SHA" -- 'supabase/migrations/*.sql' | sort -u > /tmp/migrations

            git diff --name-only --diff-filter=ACMRT "$before" "$GITHUB_SHA" -- 'supabase/functions/**' | sort -u > /tmp/changed-function-files
            python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          root = Path("supabase/functions").resolve()
          changed = [Path(line.strip()).resolve() for line in Path("/tmp/changed-function-files").read_text().splitlines() if line.strip()]
          changed_shared = {path for path in changed if root in path.parents and path.relative_to(root).parts[0] == "_shared"}
          affected = {
              path.relative_to(root).parts[0]
              for path in changed
              if root in path.parents and path.relative_to(root).parts[0] != "_shared"
          }

          import_pattern = re.compile(r"(?:from\s+|import\s*)[\"']([^\"']+)[\"']")

          def resolve_import(source: Path, specifier: str) -> Path | None:
              if not specifier.startswith("."):
                  return None
              candidate = (source.parent / specifier).resolve()
              candidates = [candidate]
              if candidate.suffix == "":
                  candidates.extend([candidate.with_suffix(".ts"), candidate / "index.ts"])
              for path in candidates:
                  if path.is_file() and (path == root or root in path.parents):
                      return path
              return None

          graph: dict[Path, set[Path]] = {}
          for source in root.rglob("*.ts"):
              dependencies: set[Path] = set()
              try:
                  content = source.read_text(encoding="utf-8")
              except OSError:
                  continue
              for specifier in import_pattern.findall(content):
                  dependency = resolve_import(source, specifier)
                  if dependency is not None:
                      dependencies.add(dependency)
              graph[source.resolve()] = dependencies

          def reaches_changed_shared(starts: list[Path]) -> bool:
              stack = [path.resolve() for path in starts]
              seen: set[Path] = set()
              while stack:
                  current = stack.pop()
                  if current in seen:
                      continue
                  seen.add(current)
                  if current in changed_shared:
                      return True
                  stack.extend(graph.get(current, ()))
              return False

          if changed_shared:
              for directory in root.iterdir():
                  if not directory.is_dir() or directory.name == "_shared" or not (directory / "index.ts").is_file():
                      continue
                  if reaches_changed_shared(list(directory.rglob("*.ts"))):
                      affected.add(directory.name)

          Path("/tmp/functions").write_text("".join(f"{name}\n" for name in sorted(affected)), encoding="utf-8")
          PY
          fi

          echo "migrations<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/migrations >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "functions<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/functions >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Apply only new or explicitly selected migrations
        if: steps.changes.outputs.migrations != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MIGRATIONS: ${{ steps.changes.outputs.migrations }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            [[ -z "$migration" ]] && continue
            echo "Applying $migration"
            psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --file "$migration"
          done <<< "$MIGRATIONS"

      - name: Deploy only changed or explicitly selected Edge Functions
        if: steps.changes.outputs.functions != ''
        env:
          FUNCTIONS: ${{ steps.changes.outputs.functions }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r fn; do
            [[ -z "$fn" ]] && continue
            echo "Deploying function: $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done <<< "$FUNCTIONS"

      - name: Report no-op deployment
        if: steps.changes.outputs.migrations == '' && steps.changes.outputs.functions == ''
        run: echo "No Supabase database or Edge Function deployment is required for this change."
