name: Inspect PayNet loan-performance source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/equifax-archive-backfill-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equifax-archive-backfill-once
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Inspect public PayNet page and scripts
        run: |
          python - <<'PY' > paynet-diagnostic.txt 2>&1
          import re
          from urllib.parse import urljoin
          import requests

          url = "https://sbinsights.paynetonline.com/loan-performance/"
          headers = {"User-Agent": "Mozilla/5.0 (compatible; MacroWatch/1.0)"}
          r = requests.get(url, headers=headers, timeout=30)
          print("PAGE", r.status_code, r.url, r.headers.get("content-type"))
          r.raise_for_status()
          html = r.text
          print("HTML_LEN", len(html))
          for pat in (r"31-180", r"ajax", r"api", r"loan-performance", r"SBDI", r"SBDFI"):
              print("\nPATTERN", pat)
              for m in list(re.finditer(pat, html, re.I))[:30]:
                  print(html[max(0,m.start()-300):m.start()+900].replace("\n"," "))
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I)
          print("\nSCRIPTS", len(scripts))
          for src in scripts:
              full = urljoin(url, src)
              print("SCRIPT", full)
              try:
                  s = requests.get(full, headers=headers, timeout=30)
                  print("STATUS", s.status_code, "LEN", len(s.text))
                  if s.status_code != 200:
                      continue
                  text = s.text
                  if re.search(r"31-180|SBDI|SBDFI|loan-performance|ajax|api|chart", text, re.I):
                      print("MATCHING_SCRIPT", full)
                      for pat in (r"31-180", r"SBDI", r"SBDFI", r"ajax", r"api", r"loan-performance"):
                          for m in list(re.finditer(pat, text, re.I))[:30]:
                              print("SNIP", text[max(0,m.start()-450):m.start()+1200].replace("\n"," "))
              except Exception as e:
                  print("ERR", type(e).__name__, str(e))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paynet-diagnostic
          path: paynet-diagnostic.txt
