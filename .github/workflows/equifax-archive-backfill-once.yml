name: Backfill Equifax small-business archive once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/equifax-archive-backfill-once.yml"
      - "backend/sources/business_credit_monthly.py"
      - "backend/sources/equifax_archive_source.py"
      - "backend/sources/equifax_level_parser.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equifax-archive-backfill-once
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Diagnose latest Equifax PDF extraction
        run: |
          PYTHONPATH=backend python - <<'PY'
          from io import BytesIO
          import re
          import requests
          from pypdf import PdfReader
          from sources.business_credit_monthly import USER_AGENT

          urls = [
              "https://assets.equifax.com/marketing/US/assets/main-street-lending-report-july-2026.pdf",
              "https://assets.equifax.com/marketing/US/assets/main-street-lending-report-august-2026.pdf",
          ]
          for url in urls:
              response = requests.get(url, timeout=30, headers={"User-Agent": USER_AGENT})
              response.raise_for_status()
              text = "\n".join(page.extract_text() or "" for page in PdfReader(BytesIO(response.content)).pages)
              clean = re.sub(r"\s+", " ", text.replace("–", "-").replace("—", "-"))
              print("===", url, "===")
              for term in ("SBDFI", "SBDI"):
                  positions = [m.start() for m in re.finditer(term, clean, re.I)]
                  for pos in positions[:8]:
                      print(clean[max(0, pos - 180):pos + 700])
          PY
      - name: Recover exact levels from first-party Equifax PDFs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import date
          from common import SupabaseRest
          from signals.business_credit_backfill import _ten_year_start, _validate_rows
          from sources.equifax_archive_source import fetch_equifax_archive_rows

          end = date.today()
          start = _ten_year_start(end)
          found = fetch_equifax_archive_rows(start, end)
          db = SupabaseRest()
          for code in ("US_SBDI_31_90", "US_SBDI_91_180", "US_SBDFI"):
              rows = _validate_rows(code, found.get(code, []), start, end)
              if rows:
                  db.upsert("economic_chart_points", rows, conflict="series_code,observation_date")
              print(code, "upserted", len(rows), "first", rows[0]["observation_date"] if rows else None, "last", rows[-1]["observation_date"] if rows else None)
          PY
