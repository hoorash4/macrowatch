name: Verify historical frontend temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-verify-historical-frontend.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check assets/js/historical-insight/historical-insight.js
