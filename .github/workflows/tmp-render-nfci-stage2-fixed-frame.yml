name: Render NFCI Risk Stage2 fixed frame temp
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-render-nfci-stage2-fixed-frame.yml"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check matplotlib
      - name: Render exact fixed frame
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p out
          PYTHONPATH=backend python - <<'PY'
          from datetime import date, timedelta
          import matplotlib.pyplot as plt
          from common import SupabaseRest
          from historical_pivot_base import _get_rows_paginated, _single_row
          from historical_pivot_shared import ChartGeometry, normalize_rows, buffer_bounds
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures

          CASE="tightening_2022"
          INDEX="NASDAQ_COMPOSITE"
          CODE="NFCI_RISK"

          # User-fixed frontend frame:
          # full x plot = 950 px, y plot = 464 px
          # START and TROUGH sit at 12% and 88% of the x plot.
          FRAME_W=950.0
          FRAME_H=464.0
          LEFT_X=FRAME_W*0.12
          RIGHT_X=FRAME_W*0.88
          INNER_W=RIGHT_X-LEFT_X

          db=SupabaseRest()
          cycle=_single_row(db,"historical_case_market_cycles",{
              "select":"start_date,trough_date",
              "case_code":f"eq.{CASE}",
              "index_code":f"eq.{INDEX}",
              "limit":"2",
          })
          start=date.fromisoformat(str(cycle["start_date"])[:10])
          trough=date.fromisoformat(str(cycle["trough_date"])[:10])
          buffer_start,buffer_end=buffer_bounds(start,trough)

          # Exact x mapping: START->114 px, TROUGH->836 px.
          cycle_days=(trough-start).days
          px_per_day=INNER_W/cycle_days
          left_days=LEFT_X/px_per_day
          right_days=(FRAME_W-RIGHT_X)/px_per_day
          display_start=start-timedelta(days=left_days)
          display_end=trough+timedelta(days=right_days)

          rows=_get_rows_paginated(db,"economic_chart_series_points",{
              "select":"observation_date,value,frequency",
              "series_code":f"eq.{CODE}",
              "observation_date":f"gte.{buffer_start.isoformat()}",
              "and":f"(observation_date.lte.{buffer_end.isoformat()})",
              "order":"observation_date.asc",
          })
          raw=normalize_rows(rows)
          freq=rows[0]["frequency"]

          # Vertical frame: map the indicator's visible-case min/max to the full
          # 464-px plot height. Buffer does not rescale the frame.
          visible=[p for p in raw if display_start <= p.day <= display_end]
          lo=min(p.value for p in visible)
          hi=max(p.value for p in visible)
          if hi==lo:
              hi=lo+1.0

          # ChartGeometry accepts dates, so use exact dates bracketing the intended
          # fractional display bounds. x-scale remains anchored by START/TROUGH.
          geom=ChartGeometry(
              display_start, display_end,
              lo, hi,
              FRAME_W, FRAME_H,
          )

          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,geom)

          print("FRAME",FRAME_W,FRAME_H)
          print("START",start.isoformat(),"x",LEFT_X)
          print("TROUGH",trough.isoformat(),"x",RIGHT_X)
          print("PX_PER_DAY",px_per_day)
          print("DISPLAY",display_start.isoformat(),display_end.isoformat())
          print("BUFFER",buffer_start.isoformat(),buffer_end.isoformat())
          print("SIDEWAYS_H",[(s.start.day.isoformat(),s.start.value,s.end.day.isoformat(),s.end.value,round(s.angle_deg,6),s.protected) for s in s2.high_sideways_segments])
          print("SIDEWAYS_L",[(s.start.day.isoformat(),s.start.value,s.end.day.isoformat(),s.end.value,round(s.angle_deg,6),s.protected) for s in s2.low_sideways_segments])

          # Full-buffer canvas extends horizontally only. 950x464 case frame remains untouched.
          extra_left=(display_start-buffer_start).days*px_per_day
          extra_right=(buffer_end-display_end).days*px_per_day
          full_w=extra_left+FRAME_W+extra_right
          full_h=FRAME_H

          dpi=120
          fig=plt.figure(figsize=(full_w/dpi, full_h/dpi),dpi=dpi)
          ax=fig.add_axes([0,0,1,1])

          # Convert date to full-buffer x pixel, keeping the exact same px/day.
          def x_of(d):
              return extra_left + (d-display_start).days*px_per_day

          def y_of(v):
              return (v-lo)/(hi-lo)*FRAME_H

          # Raw
          xs=[x_of(p.day) for p in raw]
          ys=[y_of(p.value) for p in raw]
          ax.plot(xs,ys,linewidth=1.1)

          # Stage2 high/low RDP
          ax.plot([x_of(p.day) for p in s2.high_pivots],[y_of(p.value) for p in s2.high_pivots],linewidth=1.5,marker="^",markersize=4,label="Stage2 high")
          ax.plot([x_of(p.day) for p in s2.low_pivots],[y_of(p.value) for p in s2.low_pivots],linewidth=1.5,marker="v",markersize=4,label="Stage2 low")

          # Stage2 structures
          for seg in (*s2.high_sideways_segments,*s2.low_sideways_segments):
              ax.plot([x_of(seg.start.day),x_of(seg.end.day)],[y_of(seg.start.value),y_of(seg.end.value)],linewidth=4,label=f"sideways {seg.reference_side} {seg.angle_deg:.2f}°")
          for c in s2.rapid_move_candidates:
              ax.plot([x_of(c.start.day),x_of(c.end.day)],[y_of(c.start.value),y_of(c.end.value)],linewidth=4,label="rapid candidate")

          # Exact 950x464 frontend frame, with START/TROUGH fixed at 12%/88%.
          frame_left=extra_left
          frame_right=extra_left+FRAME_W
          ax.axvspan(frame_left,frame_right,alpha=.08,label="frontend frame 950×464")
          ax.axvline(frame_left+LEFT_X,linestyle="--",linewidth=1)
          ax.axvline(frame_left+RIGHT_X,linestyle="--",linewidth=1)
          ax.text(frame_left+LEFT_X,FRAME_H-12,"START",ha="center",va="top",fontsize=8)
          ax.text(frame_left+RIGHT_X,FRAME_H-12,"TROUGH",ha="center",va="top",fontsize=8)

          for p in s2.display_markers:
              ax.annotate(p.day.strftime("%Y-%m-%d"),(x_of(p.day),y_of(p.value)),xytext=(0,5),textcoords="offset points",fontsize=5,ha="center")

          ax.set_xlim(0,full_w)
          ax.set_ylim(0,FRAME_H)
          ax.set_xticks([])
          ax.set_yticks([])
          for spine in ax.spines.values():
              spine.set_visible(True)

          handles,labels=ax.get_legend_handles_labels()
          uniq=dict(zip(labels,handles))
          if uniq:
              ax.legend(uniq.values(),uniq.keys(),loc="upper right",fontsize=7,framealpha=.85)

          fig.savefig("out/NFCI_RISK_STAGE2_FIXED_950x464_BUFFER.png",dpi=dpi)
          plt.close(fig)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nfci-risk-stage2-fixed-950x464-buffer
          path: out/NFCI_RISK_STAGE2_FIXED_950x464_BUFFER.png
          if-no-files-found: error
