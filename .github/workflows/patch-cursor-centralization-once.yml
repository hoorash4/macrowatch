name: Patch chart cursor centralization once

on:
  push:
    branches: [fix/chart-cursor-centralization-20260912]
    paths:
      - ".github/workflows/patch-cursor-centralization-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/chart-cursor-centralization-20260912
          fetch-depth: 0
      - name: Apply cursor centralization patch
        run: python .github/scripts/cursor_patch_once.py
      - name: Commit patch and remove helper files
        shell: bash
        run: |
          rm -f .cursor-centralization-trigger .github/scripts/cursor_patch_once.py .github/workflows/patch-cursor-centralization-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/charts/equity-bond-attractiveness-chart.js assets/js/charts/liquidity-chart.js assets/js/charts/korea-foreign-flow-chart.js assets/js/charts/em-capacity-chart.js tests/test_dashboard.js .github/scripts/cursor_patch_once.py .github/workflows/patch-cursor-centralization-once.yml
          git diff --cached --check
          git commit -m "Finish shared cursor positioning across analysis charts"
          git push origin HEAD:fix/chart-cursor-centralization-20260912
