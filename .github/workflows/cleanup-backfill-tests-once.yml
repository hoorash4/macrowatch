name: Cleanup retired backfill test contract once

on:
  push:
    paths:
      - ".github/workflows/cleanup-backfill-tests-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Replace retired backfill contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_backend.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    def test_backfill_entrypoints_are_explicit_and_unscheduled(self) -> None:\n')
          end = text.index('    def test_scheduled_earnings_runs_still_force_database_writes(self) -> None:\n', start)
          replacement = '''    def test_backfill_runtime_entrypoints_are_retired(self) -> None:\n        removed = (\n            ".github/workflows/economic-chart-backfill-once.yml",\n            ".github/workflows/business-credit-backfill-once.yml",\n            ".github/workflows/korea-rehab-backfill-once.yml",\n            ".github/workflows/legacy-ch11-backfill-once.yml",\n            ".github/workflows/wti-futures-backfill.yml",\n            "backend/signals/business_credit_backfill.py",\n            "backend/signals/economic_chart_backfill.py",\n            "backend/signals/economic_chart_spread_backfill.py",\n            "backend/signals/korea_export_backfill.py",\n            "backend/signals/paynet_backfill.py",\n            "backend/signals/wti_futures_backfill.py",\n            "backend/sources/paynet_derived_history.py",\n        )\n        for relative in removed:\n            self.assertFalse((ROOT / relative).exists(), relative)\n\n        automatic = (ROOT / ".github/workflows/economic-chart-data.yml").read_text(encoding="utf-8")\n        automatic_code = (ROOT / "backend/signals/economic_chart_automatic.py").read_text(encoding="utf-8")\n        self.assertIn("signals.economic_chart_automatic", automatic)\n        self.assertIn("signals.business_credit_monthly", automatic)\n        self.assertIn("signals.paynet_monthly", automatic)\n        self.assertNotIn("backfill", automatic.lower())\n        self.assertNotIn("economic_chart_backfill", automatic_code)\n\n'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_backend.py
          git commit -m "Retire stale backfill test contract"
          git push
