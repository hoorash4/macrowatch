name: Earnings V2.5 financial income-statement probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earnings-v25-financial-income-statement-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Probe detailed financial income statements without database writes
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: backend
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EARNINGS_FINANCIAL_SOURCE_TOKEN: ${{ secrets.EARNINGS_FINANCIAL_SOURCE_TOKEN }}
        run: python -m earnings_v25.diagnose_financial_income_statement
