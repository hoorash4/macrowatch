name: Backfill Korean corporate rehabilitation once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/korea-rehab-backfill-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korea-rehab-backfill-once
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Rebuild official monthly corporate rehabilitation filings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import date
          from common import SupabaseRest
          from signals.business_credit_backfill import _ten_year_start, _validate_rows
          from sources.court_rehabilitation import fetch_korea_corporate_rehab_rows

          end = date.today()
          start = _ten_year_start(end)
          rows = _validate_rows(
              "KR_CORP_REHAB",
              fetch_korea_corporate_rehab_rows(start, end),
              start,
              end,
          )
          if not rows:
              raise RuntimeError("Supreme Court rehabilitation backfill returned no rows")
          SupabaseRest().upsert("economic_chart_points", rows, conflict="series_code,observation_date")
          print("KR_CORP_REHAB", "upserted", len(rows), "first", rows[0]["observation_date"], "last", rows[-1]["observation_date"])
          PY
