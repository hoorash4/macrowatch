name: Render five Stage6 charts temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-render-five-stage6.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check matplotlib
      - name: Render five Stage6 charts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p tmp-stage6-five
          PYTHONPATH=backend python - <<'PY'
          import matplotlib.pyplot as plt
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements

          SERIES = [
              ("NFCI_RISK", "NFCI Risk"),
              ("US10Y_REAL", "US 10Y Real Yield"),
              ("REDBOOK", "Redbook"),
              ("US_COMMERCIAL_CH11", "Commercial Chapter 11"),
              ("WTI", "WTI"),
          ]

          db = SupabaseRest()

          for series_code, title in SERIES:
              rows, freq, start, end = load_case_series(
                  db,
                  case_code="tightening_2022",
                  index_code="NASDAQ_COMPOSITE",
                  series_code=series_code,
              )
              raw = normalize_rows(rows)
              vals = [p.value for p in raw if start <= p.day <= end]
              if not vals:
                  raise RuntimeError(f"{series_code}: no values")
              lo, hi = min(vals), max(vals)
              pad = (hi - lo) * .08 if hi != lo else 1.0
              g = ChartGeometry(start, end, lo-pad, hi+pad, 1200, 600)

              s1 = calculate_base_pivots(rows, freq)
              s2 = classify_special_structures(s1, g)
              s3 = simplify_pivot_lines(s2, g)
              s4 = finalize_rapid_moves(s3, g)
              s5 = prune_same_trend_extremes(s4, g)
              s6 = prune_unconfirmed_retracements(s5, g)

              print(series_code, "S6", [(p.day.isoformat(), round(p.value,6), p.pivot_type) for p in s6.markers])

              fig, ax = plt.subplots(figsize=(14, 7))
              ax.plot([p.day for p in raw], [p.value for p in raw], linewidth=1.0, label="raw")

              for seg in s6.segments:
                  lw = 2.4 if seg.kind == "trend" else 2.8
                  ax.plot(
                      [seg.start.day, seg.end.day],
                      [seg.start.value, seg.end.value],
                      linewidth=lw,
                  )

              highs = [p for p in s6.markers if p.pivot_type == "high"]
              lows = [p for p in s6.markers if p.pivot_type == "low"]
              if highs:
                  ax.scatter([p.day for p in highs], [p.value for p in highs], s=42, marker="^", label="Stage 6 high")
              if lows:
                  ax.scatter([p.day for p in lows], [p.value for p in lows], s=42, marker="v", label="Stage 6 low")

              for p in s6.markers:
                  ax.annotate(
                      p.day.strftime("%Y-%m-%d"),
                      (p.day, p.value),
                      xytext=(0, 8),
                      textcoords="offset points",
                      fontsize=7,
                      ha="center",
                  )

              ax.set_title(f"{title} · Stage 6")
              ax.set_xlim(start, end)
              ax.set_ylim(g.y_min, g.y_max)
              ax.grid(True, alpha=.2)
              ax.legend(loc="best")
              fig.tight_layout()
              fig.savefig(f"tmp-stage6-five/{series_code}_STAGE6.png", dpi=160)
              plt.close(fig)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: five-stage6-charts
          path: tmp-stage6-five/*.png
          if-no-files-found: error
