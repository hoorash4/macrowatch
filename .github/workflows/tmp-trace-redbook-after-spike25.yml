name: Trace REDBOOK after spike filter temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-trace-redbook-after-spike25.yml"

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Trace
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots, augment_spike_entry_points
          from historical_pivot_stage2 import finalize_sideways_protection
          from historical_pivot_stage3 import simplify_pivot_lines, _consensus_runs, _legs
          from historical_pivot_stage4 import prune_same_trend_extremes
          from historical_pivot_stage5 import prune_unconfirmed_retracements

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="REDBOOK")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals); pad=(hi-lo)*.08
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)
          base=calculate_base_pivots(rows,freq)
          s1=augment_spike_entry_points(base,g)
          s2=finalize_sideways_protection(s1,g)
          pts=tuple(sorted((*s2.high_pivots,*s2.low_pivots),key=lambda p:(p.day,p.pivot_type)))
          print("HIGH_LEGS",[(l.start.day.isoformat(),l.start.value,l.end.day.isoformat(),l.end.value,l.direction) for l in _legs(pts,"high") if l.start.day.year>=2019 and l.start.day.year<=2021])
          print("LOW_LEGS",[(l.start.day.isoformat(),l.start.value,l.end.day.isoformat(),l.end.value,l.direction) for l in _legs(pts,"low") if l.start.day.year>=2019 and l.start.day.year<=2021])
          print("RUNS",[(r.direction,[(a.isoformat(),b.isoformat(),hl.start.day.isoformat(),hl.end.day.isoformat(),ll.start.day.isoformat(),ll.end.day.isoformat()) for a,b,hl,ll in r.intervals]) for r in _consensus_runs(pts)])
          s3=simplify_pivot_lines(s2,g)
          s4=prune_same_trend_extremes(s3,g)
          s5=prune_unconfirmed_retracements(s4)
          for name,obj in [("S3",s3),("S4",s4),("S5",s5)]:
              print(name,[(p.day.isoformat(),p.value,p.pivot_type) for p in obj.markers])
              print(name+"SEG",[(x.start.day.isoformat(),x.start.value,x.end.day.isoformat(),x.end.value,x.kind) for x in obj.segments])
          PY
