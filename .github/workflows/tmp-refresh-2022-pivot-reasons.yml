name: Refresh 2022 pivot reasons temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-refresh-2022-pivot-reasons.yml"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Syntax check
        run: python -m py_compile backend/historical_pivot_store.py
      - name: Refresh 2022 stored reasons
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALGORITHM_VERSION: ${{ github.sha }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          import os
          from datetime import date
          from common import SupabaseRest
          from historical_pivot_base import load_case_series, _single_row, _get_rows_paginated
          from historical_pivot_shared import ChartGeometry, normalize_rows, buffer_bounds
          from historical_pivot_stage1 import calculate_base_pivots, augment_spike_entry_points
          from historical_pivot_stage2 import finalize_sideways_protection
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import prune_same_trend_extremes
          from historical_pivot_stage5 import prune_unconfirmed_retracements
          from historical_pivot_store import store_pipeline_result

          CASE="tightening_2022"
          INDEX="NASDAQ_COMPOSITE"
          SERIES=[
              "US2Y","US10Y","US10Y_REAL",
              "HY_OAS","NFCI_CREDIT","NFCI_RISK","EM_OAS","WTI","RRP","TGA",
              "REDBOOK","WEI","EMRATIO","US_RETAIL_SALES","US_CPI","US_CORE_CPI",
              "US_PPI","US_CORE_PPI","US_PCE","US_CORE_PCE","US_SBDI_31_180",
              "US_SBDFI","US_COMMERCIAL_CH11"
          ]

          db=SupabaseRest()

          def geometry(rows,start,end):
              raw=normalize_rows(rows)
              vals=[p.value for p in raw if start<=p.day<=end]
              lo,hi=min(vals),max(vals)
              pad=(hi-lo)*.08 if hi!=lo else 1.0
              return ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          def run(code,rows,freq,start,end):
              g=geometry(rows,start,end)
              base=calculate_base_pivots(rows,freq)
              s1=augment_spike_entry_points(base,g)
              s2=finalize_sideways_protection(s1,g)
              s3=simplify_pivot_lines(s2,g)
              s4=prune_same_trend_extremes(s3,g)
              s5=prune_unconfirmed_retracements(s4)
              count=store_pipeline_result(
                  db,case_code=CASE,index_code=INDEX,series_code=code,
                  algorithm_version=os.environ["ALGORITHM_VERSION"],
                  source_rows=rows,frequency=freq,buffer_start=start,buffer_end=end,
                  base=base,stage1=s1,stage2=s2,stage3=s3,stage4=s4,final=s5,
              )
              print("OK",code,count)
              for row in __import__("historical_pivot_store").build_storage_rows(
                  base=base,stage1=s1,stage2=s2,stage3=s3,stage4=s4,final=s5
              )[:3]:
                  print("REASON",code,row["pivot_date"],row["selection_meta"]["reason_type"],row["selection_reason"])

          for code in SERIES:
              rows,freq,start,end=load_case_series(db,case_code=CASE,index_code=INDEX,series_code=code)
              run(code,rows,freq,start,end)

          cycle=_single_row(db,"historical_case_market_cycles",{
              "select":"start_date,trough_date",
              "case_code":f"eq.{CASE}","index_code":f"eq.{INDEX}","limit":"2",
          })
          start,end=buffer_bounds(date.fromisoformat(cycle["start_date"][:10]),date.fromisoformat(cycle["trough_date"][:10]))
          def load(code):
              return _get_rows_paginated(db,"economic_chart_points",{
                  "select":"observation_date,value,frequency",
                  "series_code":f"eq.{code}",
                  "observation_date":f"gte.{start.isoformat()}",
                  "and":f"(observation_date.lte.{end.isoformat()})",
                  "order":"observation_date.asc",
              })
          y10={r["observation_date"][:10]:float(r["value"]) for r in load("US10Y")}
          y2={r["observation_date"][:10]:float(r["value"]) for r in load("US2Y")}
          dates=sorted(set(y10)&set(y2))
          rows=tuple({"observation_date":d,"value":y10[d]-y2[d],"frequency":"D"} for d in dates)
          run("US10Y2Y",rows,"D",start,end)
          PY
