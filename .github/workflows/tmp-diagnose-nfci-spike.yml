name: Diagnose NFCI spike gate temp
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-diagnose-nfci-spike.yml"
permissions: {contents: read}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Diagnose
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import date,timedelta
          from common import SupabaseRest
          from historical_pivot_base import _get_rows_paginated,_single_row
          from historical_pivot_shared import ChartGeometry,normalize_rows,buffer_bounds,screen_angle_degrees
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import _entry_before_peak,_visual_y_share,_followup_rebreaks_peak
          db=SupabaseRest();CASE='tightening_2022';INDEX='NASDAQ_COMPOSITE';CODE='NFCI_RISK'
          cyc=_single_row(db,'historical_case_market_cycles',{'select':'start_date,trough_date','case_code':f'eq.{CASE}','index_code':f'eq.{INDEX}','limit':'2'})
          s=date.fromisoformat(str(cyc['start_date'])[:10]);t=date.fromisoformat(str(cyc['trough_date'])[:10]);bs,be=buffer_bounds(s,t)
          W=950.;H=464.;SX=W*.12;TX=W*.88;ppd=(TX-SX)/(t-s).days;ds=s-timedelta(days=SX/ppd);de=t+timedelta(days=(W-TX)/ppd)
          rows=_get_rows_paginated(db,'economic_chart_series_points',{'select':'observation_date,value,frequency','series_code':f'eq.{CODE}','observation_date':f'gte.{bs.isoformat()}','and':f'(observation_date.lte.{be.isoformat()})','order':'observation_date.asc'})
          raw=normalize_rows(rows);vis=[p for p in raw if ds<=p.day<=de];lo=min(p.value for p in vis);hi=max(p.value for p in vis);yp=(hi-lo)*(.08/.84);g=ChartGeometry(ds,de,lo-yp,hi+yp,W,H)
          a=calculate_base_pivots(rows,rows[0]['frequency'])
          highs=list(sorted(a.high_pivots,key=lambda p:p.day)); lows=list(sorted(a.low_pivots,key=lambda p:p.day))
          print('HIGHS',[(p.day.isoformat(),p.value) for p in highs])
          print('LOWS',[(p.day.isoformat(),p.value) for p in lows])
          for i in range(1,len(highs)-1):
              A,P,C=highs[i-1],highs[i],highs[i+1]
              if P.day.isoformat()!='2020-04-03': continue
              entry=_entry_before_peak(a_point=A,peak=P,opposite_rdp=lows,opposite_candidates=a.low_candidates,direction='up')
              opposite=[x for x in lows if A.day<=x.day<=C.day]
              ab=P.value-A.value; bc=P.value-C.value; ratio=bc/ab
              share=_visual_y_share(entry,P,g)
              angle=screen_angle_degrees(A,P,C,g)
              rebreak=_followup_rebreaks_peak(highs,peak=P,c_point=C,direction='up',followup_points=2)
              print('TARGET',A,P,C,'ENTRY',entry)
              print('OPPOSITE',[(x.day.isoformat(),x.value) for x in opposite])
              print('GATES',{'ab':ab,'bc':bc,'ratio':ratio,'share':share,'angle':angle,'rebreak':rebreak,'opp_above':any(x.value>max(A.value,C.value) for x in opposite)})
          PY
