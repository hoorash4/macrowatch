name: Refresh U.S. earnings from SEC

on:
  push:
    branches: [main]
    paths:
      - "backend/earnings/sec_edgar.py"
      - "backend/earnings/sec_parser.py"
      - "backend/earnings/collect_sec.py"
      - ".github/workflows/earnings-sec.yml"
  schedule:
    # UTC 04:30 Tue-Sat = 13:30 KST Tue-Sat. This follows the preceding
    # U.S. session and avoids the Korean OpenDART collection window.
    - cron: "30 4 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macrowatch-earnings-sec
  cancel-in-progress: true

jobs:
  refresh-sec-company-facts:
    runs-on: ubuntu-latest
    # The official SEC endpoint can reject shared GitHub runner addresses. Its
    # SEC-derived mirror fallback queries one CIK at a time and can take longer
    # during the initial ten-year backfill, so do not cut off a healthy run.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install worker dependency
        run: pip install -r backend/requirements.txt

      - name: Refresh SEC company facts
        env:
          PYTHONPATH: backend
          SEC_USER_AGENT: "MacroWatch hoorash4@users.noreply.github.com"
          SEC_REQUEST_INTERVAL_SECONDS: "0.2"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m earnings.collect_sec

      - name: Recalculate compact earnings growth metrics
        env:
          PYTHONPATH: backend
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m earnings.calculate_growth_metrics
