name: Build Historical Insight shell

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-historical-insight-once.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch navigation and shared styles
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          anchor = '<button type="button" class="dashboard-nav-item" data-dashboard-view="tracker"><i class="fa-solid fa-bell"></i><span>지표 추적 알림</span></button>'
          addition = anchor + '\n          <a class="dashboard-nav-item dashboard-nav-tool dashboard-nav-tool-group-start" href="economic-charts.html"><i class="fa-solid fa-chart-line"></i><span>경제지표 챠트</span></a>\n          <a class="dashboard-nav-item dashboard-nav-tool" href="historical-insight.html"><i class="fa-solid fa-clock-rotate-left"></i><span>히스토리컬 인사이트</span></a>'
          if 'historical-insight.html' not in text:
              if anchor not in text:
                  raise SystemExit('index navigation anchor not found')
              text = text.replace(anchor, addition, 1)
          text = text.replace('assets/css/styles.css?v=190', 'assets/css/styles.css?v=191')
          index.write_text(text, encoding='utf-8')

          styles = Path('assets/css/styles.css')
          css = styles.read_text(encoding='utf-8')
          marker = '/* ===== Research tool navigation ===== */'
          rule = '\n\n' + marker + '\n.dashboard-nav-tool{color:#536b7d;font-weight:750}.dashboard-nav-tool-group-start{margin-left:.15rem;padding-left:1rem}.dashboard-nav-tool-group-start::before{position:absolute;top:50%;left:.18rem;width:1px;height:1.2rem;content:"";background:rgba(20,36,51,.18);transform:translateY(-50%)}.dashboard-nav-tool:hover{color:var(--color-brand-navy)}.dashboard-nav-tool::after{height:2px;background:var(--color-brand-gold-dark)}html[data-theme="dark"] .dashboard-nav-tool,html[data-theme="dark"] .dashboard-nav-tool:hover{color:#d4bf95}html[data-theme="dark"] .dashboard-nav-tool-group-start::before{background:rgba(203,213,225,.22)}@media(max-width:1180px){.dashboard-nav-inner{gap:clamp(.55rem,1vw,.9rem)}.dashboard-wordmark{margin-right:clamp(.65rem,1.6vw,1.5rem)}.dashboard-nav-item{font-size:.76rem}.dashboard-nav-tool-group-start{padding-left:.8rem}}\n'
          if marker not in css:
              styles.write_text(css + rule, encoding='utf-8')

          econ = Path('economic-charts.html')
          text = econ.read_text(encoding='utf-8')
          old = '<a href="index.html#news">플로우 분석</a><a href="index.html#policy-signals">통화정책</a><a href="index.html#earnings-signals">기업이익</a><a href="index.html#stress">스트레스</a><a href="index.html#tracker">지표추적</a><a class="is-active" href="economic-charts.html" aria-current="page">경제지표 챠트</a>'
          new = '<a href="index.html#news">플로우 분석</a><a href="index.html#policy-signals">통화정책</a><a href="index.html#earnings-signals">기업이익</a><a href="index.html#stress">스트레스</a><a href="index.html#tracker">지표추적</a><span class="economic-nav-divider" aria-hidden="true"></span><a class="research-nav is-active" href="economic-charts.html" aria-current="page">경제지표 챠트</a><a class="research-nav" href="historical-insight.html">히스토리컬 인사이트</a>'
          if 'historical-insight.html' not in text:
              if old not in text:
                  raise SystemExit('economic navigation anchor not found')
              text = text.replace(old, new, 1)
          text = text.replace('assets/css/styles.css?v=190', 'assets/css/styles.css?v=191').replace('assets/css/economic-charts.css?v=11', 'assets/css/economic-charts.css?v=12')
          econ.write_text(text, encoding='utf-8')

          econ_css = Path('assets/css/economic-charts.css')
          css = econ_css.read_text(encoding='utf-8')
          marker = '/* Research tools are a distinct workspace family. */'
          rule = '\n\n' + marker + '\n.economic-nav-divider{width:1px;height:20px;align-self:center;margin:0 3px;background:#d7dde3}.economic-nav a.research-nav{border:1px solid #d8dee5;background:#f8fafc;color:#334155}.economic-nav a.research-nav:hover{border-color:#b8c3ce;background:#eef2f6;color:#111827}.economic-nav a.research-nav.is-active{border-color:#111827;background:#111827;color:#fff;box-shadow:0 2px 8px rgba(15,23,42,.12)}html[data-theme="dark"] .economic-nav-divider{background:#334155}html[data-theme="dark"] .economic-nav a.research-nav{border-color:#334155;background:#111c2f;color:#cbd5e1}html[data-theme="dark"] .economic-nav a.research-nav:hover{border-color:#64748b;background:#17243a;color:#fff}html[data-theme="dark"] .economic-nav a.research-nav.is-active{border-color:#d1a55d;background:#d1a55d;color:#071b42}\n'
          if marker not in css:
              econ_css.write_text(css + rule, encoding='utf-8')
          PY

      - name: Commit generated navigation
        run: |
          git config user.name "MacroWatch Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html economic-charts.html assets/css/styles.css assets/css/economic-charts.css
          git diff --cached --quiet && exit 0
          git commit -m "Wire Historical Insight navigation"
          git push origin main
