name: Refresh Korean earnings from OpenDART

on:
  push:
    branches: [main]
    paths:
      - "backend/earnings/**"
      - "supabase/migrations/*earnings*.sql"
      - "supabase/migrations/*financial*revenue*"
      - ".github/workflows/earnings-open-dart.yml"
  schedule:
    # UTC 10:30/10:50 = 19:30/19:50 KST. The second run is an idempotent
    # fallback for delayed disclosures or a transient provider failure.
    - cron: "30 10 * * 1-5"
    - cron: "50 10 * * 1-5"
  workflow_dispatch:
    inputs:
      sync_identifiers:
        description: "OpenDART 기업코드 전체 목록도 다시 동기화"
        required: false
        type: boolean
        default: false
      max_batches:
        description: "수동 백필에서 처리할 최대 분기 배치 수"
        required: false
        type: choice
        default: "20"
        options: ["3", "10", "20"]

permissions:
  contents: read

concurrency:
  group: macrowatch-earnings-open-dart
  cancel-in-progress: false

jobs:
  sync-open-dart-identifiers:
    runs-on: ubuntu-latest
    # A historical financial batch can require per-company fallback requests
    # when OpenDART's multi-company response omits required accounts. Keep the
    # batch cap for API safety, but allow enough time to finish and commit it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install worker dependency
        run: pip install -r backend/requirements.txt

      - name: Connect tracked companies to OpenDART
        # The full corporation-code ZIP is slow and changes infrequently. Run
        # it on the first daily schedule only; the 19:50 fallback and ordinary
        # manual retries continue from the already synchronized identifiers.
        if: github.event.schedule == '30 10 * * 1-5' || inputs.sync_identifiers == true
        env:
          PYTHONPATH: backend
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m earnings.sync_corp_codes

      - name: Discover periodic filings and enqueue work
        env:
          PYTHONPATH: backend
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m earnings.discover_filings

      - name: Recover official filing identity for historical backfill
        env:
          PYTHONPATH: backend
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPEN_DART_REQUEST_INTERVAL_SECONDS: "0.3"
          OPEN_DART_FILING_WORKERS: "4"
        run: python -m earnings.discover_backfill_filings

      - name: Collect queued financial periods in multi-company batches
        env:
          PYTHONPATH: backend
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Scheduled checks keep the conservative three-batch cap. A manual
          # historical backfill may process more batches within the same
          # 60-minute lease so a newly admitted universe does not take weeks.
          OPEN_DART_MAX_BATCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_batches || github.event_name == 'push' && '20' || '3' }}
          OPEN_DART_REQUEST_INTERVAL_SECONDS: "0.2"
        run: python -m earnings.collect_financials

      - name: Recalculate compact earnings growth metrics
        env:
          PYTHONPATH: backend
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m earnings.calculate_growth_metrics
