name: Refresh Korean earnings from OpenDART

on:
  schedule:
    # UTC 10:30/10:50 = 19:30/19:50 KST. The second run is an idempotent
    # fallback for delayed disclosures or a transient provider failure.
    - cron: "30 10 * * 1-5"
    - cron: "50 10 * * 1-5"
  workflow_dispatch:
    inputs:
      sync_identifiers:
        description: "OpenDART 기업코드 전체 목록도 다시 동기화"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macrowatch-earnings-open-dart
  cancel-in-progress: false

jobs:
  sync-open-dart-identifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install worker dependency
        run: pip install -r backend/requirements.txt

      - name: Connect tracked companies to OpenDART
        # The full corporation-code ZIP is slow and changes infrequently. Run
        # it on the first daily schedule only; the 19:50 fallback and ordinary
        # manual retries continue from the already synchronized identifiers.
        if: github.event.schedule == '30 10 * * 1-5' || inputs.sync_identifiers == true
        env:
          PYTHONPATH: backend
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m earnings.sync_corp_codes

      - name: Discover periodic filings and enqueue work
        env:
          PYTHONPATH: backend
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m earnings.discover_filings

      - name: Collect queued financial periods in multi-company batches
        env:
          PYTHONPATH: backend
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPEN_DART_MAX_BATCHES: "5"
          OPEN_DART_REQUEST_INTERVAL_SECONDS: "0.2"
        run: python -m earnings.collect_financials
