name: Refresh Korean earnings from OpenDART

on:
  # V2 3개 분기 백필이 검증될 때까지 V1은 수동 실행만 허용한다.
  workflow_dispatch:
    inputs:
      sync_identifiers:
        description: "OpenDART 기업코드 전체 목록도 다시 동기화"
        required: false
        type: boolean
        default: false
      max_batches:
        description: "수동 백필에서 처리할 최대 분기 배치 수"
        required: false
        type: choice
        default: "50"
        options: ["10", "20", "50"]

permissions:
  contents: read

concurrency:
  group: macrowatch-earnings-open-dart
  # A collector code fix must replace a stale run that is still retrying the
  # old provider path. Database leases make the replacement safe to resume.
  cancel-in-progress: true

jobs:
  sync-open-dart-identifiers:
    runs-on: ubuntu-latest
    # A historical financial batch can require per-company fallback requests
    # when OpenDART's multi-company response omits required accounts. Keep the
    # batch cap for API safety, but allow enough time to finish and commit it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install worker dependency
        run: pip install -r backend/requirements.txt

      - name: Connect tracked companies to OpenDART
        if: inputs.sync_identifiers == true
        env:
          PYTHONPATH: backend
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m earnings.sync_corp_codes

      - name: Discover periodic filings and enqueue work
        env:
          PYTHONPATH: backend
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m earnings.discover_filings

      - name: Recover official filing identity for historical backfill
        env:
          PYTHONPATH: backend
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPEN_DART_REQUEST_INTERVAL_SECONDS: "0.3"
          OPEN_DART_FILING_WORKERS: "4"
        run: python -m earnings.discover_backfill_filings

      - name: Collect queued financial periods in multi-company batches
        env:
          PYTHONPATH: backend
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # A batch is one year/report-code request for up to 100 companies.
          # Stop naturally when the queue is empty, but allow a newly admitted
          # or re-entering company to drain its ten-year backfill in one run.
          OPEN_DART_MAX_BATCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_batches || '50' }}
          OPEN_DART_REQUEST_INTERVAL_SECONDS: "0.2"
        run: python -m earnings.collect_financials

      - name: Recalculate compact earnings growth metrics
        env:
          PYTHONPATH: backend
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m earnings.calculate_growth_metrics

      - name: Recalculate market aggregates, breadth and contribution
        env:
          PYTHONPATH: backend
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m earnings.calculate_market_earnings

