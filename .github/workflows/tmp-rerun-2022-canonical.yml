name: Rerun 2022 historical pivots canonical

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-rerun-2022-canonical.yml"

permissions:
  contents: read

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Rerun canonical Historical pivots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import date
          import json
          from common import SupabaseRest
          from historical_pivot_base import _get_rows_paginated, _single_row
          from historical_pivot_shared import ChartGeometry, normalize_rows, buffer_bounds
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements
          from historical_pivot_store import store_pipeline_result

          CASE="tightening_2022"
          INDEX="NASDAQ_COMPOSITE"
          ALGO="stage6-canonical-frontend-case-x-19x8-v1"

          # Historical US-index universe: US + GLOBAL, D/W/M pipeline.
          SERIES=[
              "US2Y","US10Y","US10Y_REAL","US10Y2Y",
              "HY_OAS","NFCI_CREDIT","NFCI_RISK","EM_OAS",
              "WTI","RRP","TGA","REDBOOK","WEI","EMRATIO","US_RETAIL_SALES",
              "US_CPI","US_CORE_CPI","US_PPI","US_CORE_PPI","US_PCE","US_CORE_PCE",
              "US_SBDI_31_180","US_SBDFI","US_COMMERCIAL_CH11",
          ]

          db=SupabaseRest()
          cycle=_single_row(db,"historical_case_market_cycles",{
              "select":"start_date,trough_date",
              "case_code":f"eq.{CASE}",
              "index_code":f"eq.{INDEX}",
              "limit":"2",
          })
          cycle_start=date.fromisoformat(str(cycle["start_date"])[:10])
          cycle_trough=date.fromisoformat(str(cycle["trough_date"])[:10])
          buffer_start,buffer_end=buffer_bounds(cycle_start,cycle_trough)

          # Frontend focusCase(): cycle START~TROUGH plus 12% visible margin,
          # calculated from the index chart's actual chronological rows.
          market=_get_rows_paginated(db,"market_index_prices",{
              "select":"market_date,close",
              "index_code":f"eq.{INDEX}",
              "market_date":"gte.1990-01-01",
              "order":"market_date.asc",
          })
          market=[r for r in market if r.get("market_date") and r.get("close") is not None]
          start_index=next(i for i,r in enumerate(market) if str(r["market_date"])[:10] >= cycle_start.isoformat())
          end_index=max(i for i,r in enumerate(market) if str(r["market_date"])[:10] <= cycle_trough.isoformat())
          span=max(1,end_index-start_index)
          context=max(1,span*.12/(1-.24))
          display_start=date.fromisoformat(str(market[int(max(0,start_index-context))]["market_date"])[:10])
          import math
          display_end=date.fromisoformat(str(market[int(math.ceil(min(len(market)-1,end_index+context)))]["market_date"])[:10])

          print("CANONICAL_X",display_start.isoformat(),display_end.isoformat())
          print("BUFFER",buffer_start.isoformat(),buffer_end.isoformat())
          print("ASPECT","19:8")

          summary=[]; failed=[]
          for code in SERIES:
              try:
                  rows=_get_rows_paginated(db,"economic_chart_series_points",{
                      "select":"observation_date,value,frequency",
                      "series_code":f"eq.{code}",
                      "observation_date":f"gte.{buffer_start.isoformat()}",
                      "and":f"(observation_date.lte.{buffer_end.isoformat()})",
                      "order":"observation_date.asc",
                  })
                  if not rows:
                      raise RuntimeError("no source rows in ±24m buffer")
                  freqs={str(r.get("frequency") or "") for r in rows}
                  if len(freqs)!=1:
                      raise RuntimeError(f"inconsistent frequencies: {sorted(freqs)}")
                  freq=next(iter(freqs))
                  if freq not in {"D","W","M"}:
                      raise RuntimeError(f"unsupported historical pivot frequency: {freq}")

                  raw=normalize_rows(rows)
                  values=[p.value for p in raw]
                  lo,hi=min(values),max(values)
                  if hi==lo:
                      ypad=1.0
                  else:
                      ypad=(hi-lo)*0.05
                  geometry=ChartGeometry(
                      display_start,
                      display_end,
                      lo-ypad,
                      hi+ypad,
                      19.0,
                      8.0,
                  )

                  s1=calculate_base_pivots(rows,freq)
                  s2=classify_special_structures(s1,geometry)
                  s3=simplify_pivot_lines(s2,geometry)
                  s4=finalize_rapid_moves(s3,geometry)
                  s5=prune_same_trend_extremes(s4,geometry)
                  s6=prune_unconfirmed_retracements(s5,geometry)

                  stored=store_pipeline_result(
                      db,
                      case_code=CASE,index_code=INDEX,series_code=code,
                      algorithm_version=ALGO,
                      source_rows=rows,frequency=freq,
                      buffer_start=buffer_start,buffer_end=buffer_end,
                      base=s1,stage1=s1,stage2=s2,stage3=s3,stage4=s4,stage5=s5,final=s6,
                  )
                  item={"series":code,"frequency":freq,"source_points":len(rows),"final_pivots":len(s6.markers),"stored":stored}
                  summary.append(item); print("STORED",json.dumps(item,ensure_ascii=False))
              except Exception as exc:
                  item={"series":code,"error":f"{type(exc).__name__}: {exc}"}
                  failed.append(item); print("FAILED",json.dumps(item,ensure_ascii=False))

          print("SUMMARY_JSON",json.dumps({"stored":summary,"failed":failed},ensure_ascii=False))
          if failed:
              raise SystemExit(2)
          PY
