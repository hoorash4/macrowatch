name: Filter US2Y drop candidates temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-filter-us2y-drop-candidates.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Measure
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows, screen_segment_angle_degrees
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import _entry_before_peak, _visual_y_share

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US2Y")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals); pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)
          s1=calculate_base_pivots(rows,freq)
          lows=tuple(sorted(s1.low_pivots,key=lambda p:p.day))
          highs=tuple(sorted(s1.high_pivots,key=lambda p:p.day))
          all_points=sorted((*s1.high_pivots,*s1.low_pivots), key=lambda p:(p.day,p.pivot_type))

          for a,b in zip(lows,lows[1:]):
              if b.value >= a.value:
                  continue
              entry=_entry_before_peak(
                  a_point=a,
                  peak=b,
                  opposite_rdp=highs,
                  opposite_candidates=s1.high_candidates,
                  direction="down",
              )
              share=_visual_y_share(entry,b,g)
              if share < 0.20:
                  continue
              xang=screen_segment_angle_degrees(entry,b,g)
              vdev=90.0-abs(xang)
              if not (20.0 <= vdev <= 30.0):
                  continue

              following=[p for p in all_points if p.day>b.day]
              nextp=following[0] if following else None
              retr=None
              if nextp is not None:
                  drop=float(entry.value)-float(b.value)
                  retr=(float(nextp.value)-float(b.value))/drop if drop>0 else None
              print("CANDIDATE",
                    "ENTRY",entry.day.isoformat(),entry.value,
                    "B",b.day.isoformat(),b.value,
                    "SHARE",share,
                    "Y_AXIS_ANGLE",vdev,
                    "NEXT",None if nextp is None else (nextp.day.isoformat(),nextp.value,nextp.pivot_type),
                    "RETRACE",retr,
                    "KEEP",nextp is None or retr is None or retr < 0.30)
          PY
