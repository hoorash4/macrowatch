name: Refresh U.S. inflation model

on:
  schedule:
    # 08:35 KST, after the latest U.S. market and Cleveland Fed inputs settle.
    - cron: "35 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macrowatch-inflation-model
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Calculate and store inflation series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/inflation_pipeline.py
