name: Earnings V2.5 financial sector diagnostic

on:
  workflow_dispatch:
    inputs:
      year:
        description: Fiscal year (2016-2018 only)
        required: true
        default: "2018"
        type: choice
        options: ["2016", "2017", "2018"]
      quarter:
        description: One fiscal quarter
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3", "4"]

permissions:
  contents: read

concurrency:
  group: earnings-v25-financial-sector-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Inspect sector schemas without database writes
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: backend
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python -m earnings_v25.diagnose_financial_sectors --year "${{ inputs.year }}" --quarter "${{ inputs.quarter }}"
