name: Temporary diagnose Kangwon Land DART 2016Q1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and print safe financial rows
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          base = "https://opendart.fss.or.kr/api/fnlttSinglAcntAll.json"
          for fs_div in ("CFS", "OFS"):
              params = {
                  "crtfc_key": os.environ["OPENDART_API_KEY"],
                  "corp_code": "00255619",
                  "bsns_year": "2016",
                  "reprt_code": "11013",
                  "fs_div": fs_div,
              }
              url = base + "?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=60) as response:
                  payload = json.load(response)
              rows = payload.get("list") or []
              safe = []
              for row in rows:
                  if str(row.get("sj_div") or "").upper() not in {"IS", "CIS"}:
                      continue
                  safe.append({
                      "account_id": row.get("account_id"),
                      "account_nm": row.get("account_nm"),
                      "sj_div": row.get("sj_div"),
                      "fs_div": row.get("fs_div"),
                      "thstrm_nm": row.get("thstrm_nm"),
                      "thstrm_amount": row.get("thstrm_amount"),
                      "thstrm_add_amount": row.get("thstrm_add_amount"),
                      "rcept_no": row.get("rcept_no"),
                  })
              print(json.dumps({
                  "fs_div": fs_div,
                  "status": payload.get("status"),
                  "message": payload.get("message"),
                  "total_rows": len(rows),
                  "income_rows": safe,
              }, ensure_ascii=False))
          PY
