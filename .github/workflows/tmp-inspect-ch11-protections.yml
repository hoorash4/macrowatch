name: Inspect CH11 protections temp
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-inspect-ch11-protections.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Inspect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import date,timedelta
          from common import SupabaseRest
          from historical_pivot_base import _get_rows_paginated,_single_row
          from historical_pivot_shared import ChartGeometry,normalize_rows,buffer_bounds
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements

          CASE="tightening_2022"; INDEX="NASDAQ_COMPOSITE"; CODE="US_COMMERCIAL_CH11"
          W=950.0; H=464.0; SX=W*.12; TX=W*.88
          db=SupabaseRest()
          cyc=_single_row(db,"historical_case_market_cycles",{"select":"start_date,trough_date","case_code":f"eq.{CASE}","index_code":f"eq.{INDEX}","limit":"2"})
          start=date.fromisoformat(str(cyc["start_date"])[:10]); trough=date.fromisoformat(str(cyc["trough_date"])[:10])
          bs,be=buffer_bounds(start,trough); ppd=(TX-SX)/(trough-start).days
          ds=start-timedelta(days=SX/ppd); de=trough+timedelta(days=(W-TX)/ppd)
          rows=_get_rows_paginated(db,"economic_chart_series_points",{"select":"observation_date,value,frequency","series_code":f"eq.{CODE}","observation_date":f"gte.{bs.isoformat()}","and":f"(observation_date.lte.{be.isoformat()})","order":"observation_date.asc"})
          raw=normalize_rows(rows); vis=[p for p in raw if ds<=p.day<=de]; lo=min(p.value for p in vis); hi=max(p.value for p in vis); sp=hi-lo; yp=sp*(.08/.84)
          g=ChartGeometry(ds,de,lo-yp,hi+yp,W,H)
          s1=calculate_base_pivots(rows,rows[0]["frequency"]); s2=classify_special_structures(s1,g); s3=simplify_pivot_lines(s2,g); s4=finalize_rapid_moves(s3,g); s5=prune_same_trend_extremes(s4,g); s6=prune_unconfirmed_retracements(s5,g)
          print("S2_RAPID",[(x.start.day.isoformat(),x.end.day.isoformat(),x.direction) for x in s2.rapid_move_candidates])
          print("S2_SPIKES",[(x.entry.day.isoformat(),x.peak.day.isoformat()) for x in s2.spikes])
          print("S2_SIDE_H",[(x.start.day.isoformat(),x.end.day.isoformat(),x.protected) for x in s2.high_sideways_segments])
          print("S2_SIDE_L",[(x.start.day.isoformat(),x.end.day.isoformat(),x.protected) for x in s2.low_sideways_segments])
          print("S4_PROTECTED",[(p.day.isoformat(),p.value) for p in s4.protected_points])
          print("S3",[(p.day.isoformat(),p.value) for p in s3.markers])
          print("S5",[(p.day.isoformat(),p.value) for p in s5.markers])
          print("S6",[(p.day.isoformat(),p.value) for p in s6.markers])
          PY
