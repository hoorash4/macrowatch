name: Measure US2Y rapid drop vertical angles temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-measure-us2y-drop-angles.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Measure
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows, screen_segment_angle_degrees
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US2Y")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals)
          pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          s2=classify_special_structures(calculate_base_pivots(rows,freq),g)
          drops=[c for c in s2.rapid_move_candidates if c.direction<0]
          for c in drops:
              horizontal=screen_segment_angle_degrees(c.start,c.end,g)
              vertical=90.0-abs(horizontal)
              print("DROP",c.start.day.isoformat(),c.start.value,"->",c.end.day.isoformat(),c.end.value,
                    "X_ANGLE",horizontal,"VERTICAL_DEVIATION",vertical,"Y_SHARE",c.visual_y_share)
          PY
