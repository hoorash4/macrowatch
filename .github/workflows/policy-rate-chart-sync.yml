name: Sync stored U.S. policy rates to chart

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macrowatch-policy-rate-chart-sync
  cancel-in-progress: false

jobs:
  sync-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Project stored 2009+ FOMC rates to chart rows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python -m signals.policy_rate_chart_sync
