name: Diagnose OpenDART profit ratios

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query KB Financial profitability history
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: |
          python - <<'PY'
          import io, json, os, urllib.parse, urllib.request, zipfile
          import xml.etree.ElementTree as ET

          key = os.environ["OPENDART_API_KEY"]
          with urllib.request.urlopen("https://opendart.fss.or.kr/api/corpCode.xml?" + urllib.parse.urlencode({"crtfc_key": key}), timeout=30) as response:
              archive = zipfile.ZipFile(io.BytesIO(response.read()))
          root = ET.fromstring(archive.read("CORPCODE.xml"))
          corp_code = next((node.findtext("corp_code") or "").strip() for node in root.findall("list") if (node.findtext("stock_code") or "").strip() == "105560")
          result = {"corp_code_found": bool(corp_code), "periods": []}
          for year in (2015, 2016, 2017, 2018, 2025):
              for quarter, report_code in ((1,"11013"),(2,"11012"),(3,"11014"),(4,"11011")):
                  params = urllib.parse.urlencode({"crtfc_key": key, "corp_code": corp_code, "bsns_year": year, "reprt_code": report_code, "idx_cl_code": "M210000"})
                  with urllib.request.urlopen("https://opendart.fss.or.kr/api/fnlttSinglIndx.json?" + params, timeout=30) as response:
                      payload = json.load(response)
                  rows = [{"name": row.get("idx_nm"), "value": row.get("idx_val"), "scope": row.get("fs_div")} for row in payload.get("list", []) if "이익률" in str(row.get("idx_nm") or "")]
                  result["periods"].append({"year": year, "quarter": quarter, "status": payload.get("status"), "rows": rows})
          print(json.dumps(result, ensure_ascii=False, separators=(",",":")))
          PY
