name: Verify code structure

on:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "assets/**"
      - "backend/**"
      - "supabase/functions/**"
      - "tests/**"
      - "tools/build/**"
      - "docs/**"
      - ".github/workflows/pages-*.yml"
      - ".github/workflows/code-quality.yml"
  pull_request:
    paths:
      - "*.js"
      - "assets/**"
      - "backend/**"
      - "supabase/functions/**"
      - "tests/**"
      - "tools/build/**"
      - "docs/**"
      - ".github/workflows/*.yml"

permissions:
  contents: read

jobs:
  pages-contract:
    uses: ./.github/workflows/pages-build.yml

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check JavaScript syntax and behavior contracts
        run: |
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          for test in tests/test_*.js tests/test_*.ts; do node "$test"; done
      - name: Check Python syntax and behavior contracts
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          python -m compileall -q backend
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Supabase Edge Function types
        run: |
          failed=0
          for entry in supabase/functions/*/index.ts; do deno check "$entry" || failed=1; done
          exit "$failed"
