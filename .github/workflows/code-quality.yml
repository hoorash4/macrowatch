name: Verify code structure

on:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "backend/**"
      - "supabase/functions/**"
      - "tests/**"
      - ".github/workflows/code-quality.yml"
  pull_request:
    paths:
      - "*.js"
      - "backend/**"
      - "supabase/functions/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check JavaScript syntax and behavior contracts
        run: |
          node --check script.js
          node --check admin.js
          node --check auth.js
          node tests/test_dashboard.js
      - name: Check Python syntax and behavior contracts
        run: |
          python -m compileall -q backend
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Supabase Edge Function types
        # 현재 리팩터링 대상부터 엄격하게 검사한다. 기존 함수들의 타입 부채는
        # 기능별로 정리할 때 이 목록에 순차적으로 추가한다.
        run: deno check supabase/functions/news-pipeline/index.ts
