name: Refresh Korean market stress

on:
  push:
    branches: [main]
    paths:
      - backend/korea_stress_pipeline.py
      - supabase/migrations/20260825_add_korea_market_stress.sql
      - .github/workflows/korea-stress.yml
  schedule:
    - cron: "20 21 * * *"
  workflow_dispatch:
    inputs:
      years:
        description: "Backfill window in years"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install --disable-pip-version-check requests
      - name: Collect Korean market stress data
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/korea_stress_pipeline.py --years "${{ inputs.years || '3' }}"
