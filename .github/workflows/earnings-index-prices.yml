name: Refresh earnings benchmark index prices

on:
  workflow_run:
    workflows: ["Deploy Supabase changes"]
    types: [completed]
  schedule:
    # 분기 종료 뒤 두 번째 날 10:30 KST에 직전 분기 마지막 거래일을 확정합니다.
    - cron: "30 1 2 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      start_year:
        description: Backfill start year
        required: false
        default: "2016"

permissions:
  contents: read

concurrency:
  group: macrowatch-earnings-index-prices
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the matching Edge Function deployment
        if: github.event_name == 'workflow_run'
        run: sleep 30

      - name: Backfill completed-quarter benchmark closes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          START_YEAR: ${{ inputs.start_year || '2016' }}
        run: |
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 10 --max-time 300 --request POST \
            "$SUPABASE_URL/functions/v1/earnings-index-prices" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"start_year\":$START_YEAR}"
