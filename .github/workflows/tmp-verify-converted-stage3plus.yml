name: Verify converted Stage3plus temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-verify-converted-stage3plus.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check pytest
      - name: Verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m py_compile backend/historical_pivot_shared.py backend/historical_pivot_stage3.py backend/historical_pivot_stage4.py backend/historical_pivot_stage5.py backend/historical_pivot_stage6.py backend/historical_pivot_store.py
          pytest -q tests/test_historical_pivot_six_stage_architecture.py tests/test_historical_pivot_store.py
