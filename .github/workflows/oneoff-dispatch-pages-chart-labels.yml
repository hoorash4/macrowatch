name: One-off dispatch Pages chart labels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-dispatch-pages-chart-labels.yml'
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Dispatch Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref main
      - name: Remove one-off workflow
        run: |
          git config user.name "hoorash4"
          git config user.email "hoorash4@gmail.com"
          git rm .github/workflows/oneoff-dispatch-pages-chart-labels.yml
          git commit -m "Remove one-off Pages dispatcher"
          git push
