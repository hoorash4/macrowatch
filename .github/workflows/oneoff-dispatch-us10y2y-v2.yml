name: One-off dispatch US10Y2Y v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-dispatch-us10y2y-v2.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Dispatch US10Y2Y backfill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run historical-pivot-ai-backfill.yml \
            -f case_code=global_financial_crisis \
            -f index_code=SP500 \
            -f series_code=US10Y2Y \
            -f limit=0
      - name: Remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-dispatch-us10y2y-v2.yml
          git commit -m "Remove one-off US10Y2Y v2 dispatcher"
          git push
