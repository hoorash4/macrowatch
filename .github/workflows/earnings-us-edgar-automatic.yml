name: Earnings U.S. SEC automatic

on:
  schedule:
    # KST 11:30 new SEC filings. Snapshot collection has its own workflow.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      write:
        description: Persist U.S. SEC collection results
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: earnings-us-automatic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EARNINGS_WRITE_MODE: automatic
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Run U.S. SEC automatic collection phase
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: backend
          WRITE: ${{ github.event_name == 'schedule' && 'true' || inputs.write }}
          SEC_USER_AGENT: "MacroWatch/1.0 (contact: hoorash44@gmail.com)"
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--phase edgar)
          [[ "$WRITE" == "true" ]] && args+=(--write)
          timeout --signal=TERM --kill-after=10s 660s python -m earnings_us.automatic_cli "${args[@]}"
