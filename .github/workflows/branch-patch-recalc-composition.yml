name: Patch recalculation composition
on:
  push:
    branches:
      - fix/separate-stored-recalculation
    paths:
      - .github/workflows/branch-patch-recalc-composition.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/separate-stored-recalculation
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/earnings_v2/automatic.py')
          s = p.read_text()
          a = '                 financial_company: FinancialCompanyClient | None = None) -> None:\n        self.krx, self.dart, self.repository, self.kis, self.fx = krx, dart, repository, kis, fx\n        self.financial_company = financial_company\n'
          b = '                 financial_company: FinancialCompanyClient | None = None,\n                 recalculation: StoredQuarterRecalculation | None = None) -> None:\n        self.krx, self.dart, self.repository, self.kis, self.fx = krx, dart, repository, kis, fx\n        self.financial_company = financial_company\n        self.recalculation = recalculation or StoredQuarterRecalculation(repository)\n'
          if a not in s:
              raise SystemExit('constructor target missing')
          s = s.replace(a, b, 1)
          a = 'StoredQuarterRecalculation(self.repository).recalculate_quarter(year, quarter, write=True)'
          if a not in s:
              raise SystemExit('call target missing')
          s = s.replace(a, 'self.recalculation.recalculate_quarter(year, quarter, write=True)', 1)
          p.write_text(s)
          Path('.github/workflows/branch-patch-recalc-composition.yml').unlink()
          PY
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add -A
          git commit -m 'Inject isolated earnings recalculation service'
          git push origin HEAD:fix/separate-stored-recalculation
