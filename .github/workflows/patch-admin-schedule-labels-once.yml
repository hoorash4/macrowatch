name: Patch admin schedule labels once

on:
  push:
    branches: [fix/schedule-display-consistency-20260912]
    paths:
      - ".github/workflows/patch-admin-schedule-labels-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/schedule-display-consistency-20260912
          fetch-depth: 0
      - name: Align static admin labels with live cron values
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('admin.html')
          text = path.read_text(encoding='utf-8')
          old_news = '매일 오전 5시 30분에 최근 24시간 뉴스를 분석하고 결과만 DB에 저장합니다.'
          new_news = '매일 00시 30분에 최근 24시간 뉴스를 분석하고 결과만 DB에 저장합니다.'
          old_backup = '매주 일요일 오전 3시, Google Drive의 최신본과 직전본을 교체합니다.'
          new_backup = '매주 일요일 00시, Google Drive의 최신본과 직전본을 교체합니다.'
          assert old_news in text, 'news schedule label not found'
          assert old_backup in text, 'backup schedule label not found'
          path.write_text(text.replace(old_news, new_news, 1).replace(old_backup, new_backup, 1), encoding='utf-8')
          PY
          rm .github/workflows/patch-admin-schedule-labels-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/patch-admin-schedule-labels-once.yml
          git diff --cached --check
          git commit -m "Align admin schedule labels with live cron values"
          git push origin HEAD:fix/schedule-display-consistency-20260912
