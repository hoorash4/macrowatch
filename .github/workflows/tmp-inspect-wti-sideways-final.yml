name: Inspect WTI final sideways temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-inspect-wti-sideways-final.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Inspect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows, screen_segment_angle_degrees
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="WTI")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals)
          pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)
          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)
          print("LOW",[(p.day.isoformat(),p.value) for p in s2.low_pivots])
          print("HIGH",[(p.day.isoformat(),p.value) for p in s2.high_pivots])
          lows=sorted(s2.low_pivots,key=lambda p:p.day)
          for a,b in zip(lows,lows[1:]):
              print("LOW_PAIR",a.day.isoformat(),a.value,b.day.isoformat(),b.value,round(screen_segment_angle_degrees(a,b,g),3))
          highs=sorted(s2.high_pivots,key=lambda p:p.day)
          for a,b in zip(highs,highs[1:]):
              print("HIGH_PAIR",a.day.isoformat(),a.value,b.day.isoformat(),b.value,round(screen_segment_angle_degrees(a,b,g),3))
          print("SIDEWAYS_H",[(s.start.day.isoformat(),s.end.day.isoformat(),round(s.angle_deg,3),s.prior_trend,s.protected) for s in s2.high_sideways_segments])
          print("SIDEWAYS_L",[(s.start.day.isoformat(),s.end.day.isoformat(),round(s.angle_deg,3),s.prior_trend,s.protected) for s in s2.low_sideways_segments])
          PY
