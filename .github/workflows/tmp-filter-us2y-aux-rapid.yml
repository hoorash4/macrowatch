name: Filter US2Y auxiliary rapid candidates temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-filter-us2y-aux-rapid.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Measure
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows, screen_segment_angle_degrees
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import _entry_before_peak, _visual_y_share

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US2Y")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals); pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)
          s1=calculate_base_pivots(rows,freq)
          highs=tuple(sorted(s1.high_pivots,key=lambda p:p.day))
          lows=tuple(sorted(s1.low_pivots,key=lambda p:p.day))
          all_points=sorted((*highs,*lows), key=lambda p:(p.day,p.pivot_type))

          def next_point_after(day):
              xs=[p for p in all_points if p.day>day]
              return xs[0] if xs else None

          found=[]
          # up candidates: consecutive highs, entry from lows
          for a,b in zip(highs,highs[1:]):
              if b.value <= a.value: continue
              entry=_entry_before_peak(
                  a_point=a,peak=b,
                  opposite_rdp=lows,
                  opposite_candidates=s1.low_candidates,
                  direction="up",
              )
              share=_visual_y_share(entry,b,g)
              if not (0.20 <= share < 0.30): continue
              xang=screen_segment_angle_degrees(entry,b,g)
              vang=90.0-abs(xang)
              if vang > 25.0: continue
              nxt=next_point_after(b.day)
              move=float(b.value)-float(entry.value)
              retr=None if nxt is None or move<=0 else (float(b.value)-float(nxt.value))/move
              keep=nxt is None or retr is None or retr < 0.30
              found.append(("UP",entry,b,share,vang,nxt,retr,keep))

          # down candidates: consecutive lows, entry from highs
          for a,b in zip(lows,lows[1:]):
              if b.value >= a.value: continue
              entry=_entry_before_peak(
                  a_point=a,peak=b,
                  opposite_rdp=highs,
                  opposite_candidates=s1.high_candidates,
                  direction="down",
              )
              share=_visual_y_share(entry,b,g)
              if not (0.20 <= share < 0.30): continue
              xang=screen_segment_angle_degrees(entry,b,g)
              vang=90.0-abs(xang)
              if vang > 25.0: continue
              nxt=next_point_after(b.day)
              move=float(entry.value)-float(b.value)
              retr=None if nxt is None or move<=0 else (float(nxt.value)-float(b.value))/move
              keep=nxt is None or retr is None or retr < 0.30
              found.append(("DOWN",entry,b,share,vang,nxt,retr,keep))

          for side,entry,b,share,vang,nxt,retr,keep in sorted(found,key=lambda x:x[1].day):
              print("AUX",
                    side,
                    "ENTRY",entry.day.isoformat(),entry.value,entry.pivot_type,
                    "END",b.day.isoformat(),b.value,b.pivot_type,
                    "SHARE",share,
                    "Y_AXIS_ANGLE",vang,
                    "NEXT",None if nxt is None else (nxt.day.isoformat(),nxt.value,nxt.pivot_type),
                    "RETRACE",retr,
                    "KEEP",keep)
          PY
