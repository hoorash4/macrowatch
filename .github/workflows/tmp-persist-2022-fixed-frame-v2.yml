name: Persist 2022 pivots fixed frontend frame

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-persist-2022-fixed-frame-v2.yml"

permissions:
  contents: read

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Test pivot pipeline
        run: |
          PYTHONPATH=backend python -m unittest tests.test_historical_pivot_stage2 tests.test_historical_pivot_store
      - name: Recalculate and persist all US+GLOBAL D/W/M Historical indicators
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import date, timedelta
          import json

          from common import SupabaseRest
          from historical_pivot_base import _get_rows_paginated, _single_row
          from historical_pivot_shared import ChartGeometry, normalize_rows, buffer_bounds
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements
          from historical_pivot_store import store_pipeline_result

          CASE="tightening_2022"
          INDEX="NASDAQ_COMPOSITE"
          ALGO="stage6-frontend-950x464-pad8-sideways5-v1"

          SERIES=[
              "US2Y","US10Y","US10Y_REAL","US10Y2Y",
              "HY_OAS","NFCI_CREDIT","NFCI_RISK","EM_OAS",
              "WTI","RRP","TGA","REDBOOK","WEI","EMRATIO","US_RETAIL_SALES",
              "US_CPI","US_CORE_CPI","US_PPI","US_CORE_PPI","US_PCE","US_CORE_PCE",
              "US_SBDI_31_180","US_SBDFI","US_COMMERCIAL_CH11",
          ]

          FRAME_W=950.0
          FRAME_H=464.0
          START_X=FRAME_W*0.12
          TROUGH_X=FRAME_W*0.88
          INNER_W=TROUGH_X-START_X

          db=SupabaseRest()
          cycle=_single_row(db,"historical_case_market_cycles",{
              "select":"start_date,trough_date",
              "case_code":f"eq.{CASE}",
              "index_code":f"eq.{INDEX}",
              "limit":"2",
          })
          start=date.fromisoformat(str(cycle["start_date"])[:10])
          trough=date.fromisoformat(str(cycle["trough_date"])[:10])
          buffer_start,buffer_end=buffer_bounds(start,trough)

          cycle_days=(trough-start).days
          px_per_day=INNER_W/cycle_days
          display_start=start-timedelta(days=START_X/px_per_day)
          display_end=trough+timedelta(days=(FRAME_W-TROUGH_X)/px_per_day)

          print("FRAME",FRAME_W,FRAME_H)
          print("START",start.isoformat(),"x",START_X)
          print("TROUGH",trough.isoformat(),"x",TROUGH_X)
          print("DISPLAY",display_start.isoformat(),display_end.isoformat())
          print("BUFFER",buffer_start.isoformat(),buffer_end.isoformat())
          print("SIDEWAYS_ABS_DEG",5.0)

          stored_summary=[]
          failed=[]

          for code in SERIES:
              try:
                  rows=_get_rows_paginated(db,"economic_chart_series_points",{
                      "select":"observation_date,value,frequency",
                      "series_code":f"eq.{code}",
                      "observation_date":f"gte.{buffer_start.isoformat()}",
                      "and":f"(observation_date.lte.{buffer_end.isoformat()})",
                      "order":"observation_date.asc",
                  })
                  if not rows:
                      raise RuntimeError("no source rows in 24-month buffer")
                  freqs={str(r.get("frequency") or "") for r in rows}
                  if len(freqs)!=1:
                      raise RuntimeError(f"inconsistent frequencies: {sorted(freqs)}")
                  freq=next(iter(freqs))
                  if freq not in {"D","W","M"}:
                      raise RuntimeError(f"unexpected pivot frequency: {freq}")

                  raw=normalize_rows(rows)
                  visible=[p for p in raw if display_start <= p.day <= display_end]
                  if not visible:
                      raise RuntimeError("no points inside frontend case frame")

                  lo=min(p.value for p in visible)
                  hi=max(p.value for p in visible)
                  span=hi-lo
                  if span==0:
                      ypad=1.0
                  else:
                      # Frontend scaleMargins top/bottom = 8%:
                      # data min/max occupy 84% of the full 464px plot.
                      ypad=span*(0.08/0.84)

                  geometry=ChartGeometry(
                      display_start, display_end,
                      lo-ypad, hi+ypad,
                      FRAME_W, FRAME_H,
                  )

                  s1=calculate_base_pivots(rows,freq)
                  s2=classify_special_structures(s1,geometry)
                  s3=simplify_pivot_lines(s2,geometry)
                  s4=finalize_rapid_moves(s3,geometry)
                  s5=prune_same_trend_extremes(s4,geometry)
                  s6=prune_unconfirmed_retracements(s5,geometry)

                  stored=store_pipeline_result(
                      db,
                      case_code=CASE,
                      index_code=INDEX,
                      series_code=code,
                      algorithm_version=ALGO,
                      source_rows=rows,
                      frequency=freq,
                      buffer_start=buffer_start,
                      buffer_end=buffer_end,
                      base=s1,
                      stage1=s1,
                      stage2=s2,
                      stage3=s3,
                      stage4=s4,
                      stage5=s5,
                      final=s6,
                  )
                  item={
                      "series":code,
                      "frequency":freq,
                      "source_points":len(rows),
                      "stage6_pivots":len(s6.markers),
                      "stored":stored,
                  }
                  stored_summary.append(item)
                  print("STORED",json.dumps(item,ensure_ascii=False))
              except Exception as exc:
                  item={"series":code,"error":f"{type(exc).__name__}: {exc}"}
                  failed.append(item)
                  print("FAILED",json.dumps(item,ensure_ascii=False))

          print("SUMMARY_JSON",json.dumps({"stored":stored_summary,"failed":failed},ensure_ascii=False))
          if failed:
              raise SystemExit(2)
          PY
