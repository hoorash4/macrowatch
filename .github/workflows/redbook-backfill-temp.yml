name: Redbook history backfill temporary

on:
  push:
    paths:
      - "backend/signals/redbook_backfill_temp.py"
      - ".github/workflows/redbook-backfill-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    strategy:
      fail-fast: false
      max-parallel: 22
      matrix:
        year: [2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REDBOOK_YEAR: ${{ matrix.year }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - run: PYTHONPATH=backend python -u -m signals.redbook_backfill_temp
