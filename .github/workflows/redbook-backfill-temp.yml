name: Redbook history backfill temporary

on:
  push:
    paths:
      - "backend/signals/redbook_backfill_temp.py"
      - ".github/workflows/redbook-backfill-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - run: PYTHONPATH=backend python -u -m signals.redbook_backfill_temp
