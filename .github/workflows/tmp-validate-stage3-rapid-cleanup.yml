name: Validate Stage3 rapid cleanup temp

on:
  push:
    branches:
      - fix/stage3-drop-dead-rapid-provisionals
    paths:
      - ".github/workflows/tmp-validate-stage3-rapid-cleanup.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check pytest
      - name: Targeted tests
        run: |
          PYTHONPATH=backend pytest -q tests/test_historical_pivot_six_stage_architecture.py
      - name: Verify NFCI Risk
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(
              db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="NFCI_RISK"
          )
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals); pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)
          s3=simplify_pivot_lines(s2,g)
          s4=finalize_rapid_moves(s3,g)
          s5=prune_same_trend_extremes(s4,g)
          s6=prune_unconfirmed_retracements(s5,g)

          def pts(xs):
              return [(p.day.isoformat(),round(float(p.value),6),p.pivot_type) for p in xs]
          print("S2_PROV",pts(s2.provisional_protected_points))
          print("S3_PROV",pts(s3.provisional_protected_points))
          print("S3_RAPID",[(c.start.day.isoformat(),c.end.day.isoformat()) for c in s3.rapid_move_candidates])
          print("S4_PROT",pts(s4.protected_points))
          print("S6",pts(s6.markers))
          dates={p.day.isoformat() for p in s6.markers}
          assert "2022-07-01" not in dates, dates
          assert "2022-10-07" in dates, dates
          PY
