name: Earnings V2 final Korea backfill

on:
  push:
    paths:
      - ".github/workflows/earnings-v2-final-korea-backfill.yml"

permissions:
  contents: read

concurrency:
  group: earnings-v2-final-korea-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Replace 2019 Q1 through 2026 Q2 sequentially
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: backend
          EARNINGS_V2_DEADLINE_SECONDS: "1200"
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          first=true
          for ((index=2019*4; index<=2026*4+1; index++)); do
            year=$((index / 4))
            quarter=$((index % 4 + 1))
            args=(--year "$year" --quarter "$quarter" --write)
            if [[ "$first" == "false" ]]; then
              args+=(--trust-previous-backfill)
            fi
            echo "::group::Replace ${year}Q${quarter}"
            timeout --signal=TERM --kill-after=10s 1260s python -m earnings_v2.cli "${args[@]}"
            echo "::endgroup::"
            first=false
          done

