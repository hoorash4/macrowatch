name: Verify spike visual share temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-verify-spike-visual-share.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Run focused tests
        run: PYTHONPATH=backend python -m unittest tests.test_historical_pivot_stage1_spike_visual_share
      - name: Verify REDBOOK spikes are filtered
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots, augment_spike_entry_points

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(
              db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="REDBOOK"
          )
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals)
          pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)
          base=calculate_base_pivots(rows,freq)
          s1=augment_spike_entry_points(base,g)
          print("SPIKES",[(s.point.day.isoformat(),round(s.point.value,4),s.direction,round(s.angle_deg,3)) for s in s1.spike_peaks])
          assert not any(s.point.day.isoformat() in {"2020-12-01","2021-11-30"} for s in s1.spike_peaks)
          PY
