name: Patch dashboard schedule contract once

on:
  push:
    branches: [fix/schedule-reliability-20260912]
    paths:
      - ".github/workflows/patch-dashboard-schedule-contract-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/schedule-reliability-20260912
          fetch-depth: 0
      - name: Align dashboard schedule contract and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_dashboard.js')
          text = path.read_text(encoding='utf-8')
          old = """  const workflow = fs.readFileSync(path.join(__dirname, '..', '.github/workflows/sector-flow.yml'), 'utf8');
  assert.match(workflow, /10 0 \\* \\* 1-5/);
  assert.match(workflow, /30 3 \\* \\* 1-5/);
  assert.match(workflow, /30 3 \\* \\* 1-5'[\\s\\S]*'intraday'/);
  assert.match(workflow, /40 6 \\* \\* 1-5/);
"""
          new = """  const workflow = fs.readFileSync(path.join(__dirname, '..', '.github/workflows/sector-flow.yml'), 'utf8');
  const scheduleMigration = fs.readFileSync(path.join(__dirname, '..', 'supabase/migrations/20260912133500_stabilize_sector_flow_schedule.sql'), 'utf8');
  assert.doesNotMatch(workflow, /\\n  schedule:/);
  assert.match(workflow, /options: \\[open, intraday, close\\]/);
  assert.match(scheduleMigration, /10 0 \\* \\* 1-5/);
  assert.match(scheduleMigration, /30 3 \\* \\* 1-5/);
  assert.match(scheduleMigration, /40 6 \\* \\* 1-5/);
"""
          assert old in text, 'dashboard sector schedule contract block not found'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/patch-dashboard-schedule-contract-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_dashboard.js .github/workflows/patch-dashboard-schedule-contract-once.yml
          git diff --cached --check
          git commit -m "Align dashboard contract with Supabase sector scheduler"
          git push origin HEAD:fix/schedule-reliability-20260912
