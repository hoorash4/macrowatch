name: Diagnose KIS KB 2026 Q2 finance APIs

on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-kis-kb-2026q2.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query every KIS finance endpoint
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        shell: python
        run: |
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          base = "https://openapi.koreainvestment.com:9443"
          credentials = json.dumps({
              "grant_type": "client_credentials",
              "appkey": os.environ["KIS_APP_KEY"],
              "appsecret": os.environ["KIS_APP_SECRET"],
          }).encode()
          token_req = urllib.request.Request(
              f"{base}/oauth2/tokenP",
              data=credentials,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(token_req, timeout=20) as response:
              token = json.load(response)["access_token"]

          endpoints = [
              ("balance_sheet", "/uapi/domestic-stock/v1/finance/balance-sheet", "FHKST66430100"),
              ("income_statement", "/uapi/domestic-stock/v1/finance/income-statement", "FHKST66430200"),
              ("financial_ratio", "/uapi/domestic-stock/v1/finance/financial-ratio", "FHKST66430300"),
              ("profit_ratio", "/uapi/domestic-stock/v1/finance/profit-ratio", "FHKST66430400"),
              ("other_major_ratios", "/uapi/domestic-stock/v1/finance/other-major-ratios", "FHKST66430500"),
              ("stability_ratio", "/uapi/domestic-stock/v1/finance/stability-ratio", "FHKST66430600"),
              ("growth_ratio", "/uapi/domestic-stock/v1/finance/growth-ratio", "FHKST66430800"),
          ]
          params = urllib.parse.urlencode({
              "FID_DIV_CLS_CODE": "1",
              "fid_cond_mrkt_div_code": "J",
              "fid_input_iscd": "105560",
          })
          common_headers = {
              "authorization": f"Bearer {token}",
              "appkey": os.environ["KIS_APP_KEY"],
              "appsecret": os.environ["KIS_APP_SECRET"],
              "custtype": "P",
          }

          for index, (name, path, tr_id) in enumerate(endpoints):
              if index:
                  time.sleep(0.7)
              request = urllib.request.Request(
                  f"{base}{path}?{params}",
                  headers={**common_headers, "tr_id": tr_id},
              )
              print(f"\n=== {name} ===")
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except Exception as exc:
                  print(json.dumps({"request_error": type(exc).__name__}, ensure_ascii=False))
                  continue
              print(json.dumps({
                  "rt_cd": payload.get("rt_cd"),
                  "msg_cd": payload.get("msg_cd"),
                  "msg1": payload.get("msg1"),
              }, ensure_ascii=False))
              rows = payload.get("output") or []
              if isinstance(rows, dict):
                  rows = [rows]
              periods = [str(row.get("stac_yymm") or "") for row in rows if isinstance(row, dict)]
              print("periods=" + json.dumps(periods, ensure_ascii=False))
              selected = [row for row in rows if str(row.get("stac_yymm") or "").replace("-", "") == "202606"]
              if not selected and rows:
                  selected = [rows[0]]
                  print("202606_missing=true; latest_row_follows=true")
              for row in selected:
                  cleaned = {key: value for key, value in row.items() if value not in (None, "")}
                  print(json.dumps(cleaned, ensure_ascii=False, sort_keys=True))

