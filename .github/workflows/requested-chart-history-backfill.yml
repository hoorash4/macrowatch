name: Backfill requested chart history once

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: requested-chart-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Replace requested history from authoritative sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python -m operations.backfill_requested_chart_history
