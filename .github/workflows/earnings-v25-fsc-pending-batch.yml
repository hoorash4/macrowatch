name: Earnings V2.5 FSC pending batch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earnings-v25-fsc-pending-batch
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Fill 2016-2018 pending companies from FSC data
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: backend
          EARNINGS_V2_DEADLINE_SECONDS: "1200"
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EARNINGS_FINANCIAL_SOURCE_TOKEN: ${{ secrets.EARNINGS_FINANCIAL_SOURCE_TOKEN }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for year in 2016 2017 2018; do
            for quarter in 1 2 3 4; do
              echo "=== FSC V2.5 ${year}Q${quarter} ==="
              python -m earnings_v25.cli --year "$year" --quarter "$quarter" --pending-only --write
            done
          done
