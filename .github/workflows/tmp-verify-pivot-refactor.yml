name: Verify pivot refactor temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-verify-pivot-refactor.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Compile pivot modules
        run: python -m py_compile backend/historical_pivot_*.py
      - name: Run current stage-contract tests
        run: |
          PYTHONPATH=backend python -m unittest \
            tests.test_historical_pivot_stage1_spike_visual_share \
            tests.test_historical_pivot_stage2 \
            tests.test_historical_pivot_stage_boundaries \
            tests.test_historical_pivot_six_stage_architecture \
            tests.test_historical_pivot_store
      - name: Trace REDBOOK six-stage pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(
              db,
              case_code="tightening_2022",
              index_code="NASDAQ_COMPOSITE",
              series_code="REDBOOK",
          )
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals)
          pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)
          s3=simplify_pivot_lines(s2,g)
          s4=finalize_rapid_moves(s3,g)
          s5=prune_same_trend_extremes(s4,g)
          s6=prune_unconfirmed_retracements(s5)

          def pts(stage):
              return [(p.day.isoformat(),round(p.value,4),p.pivot_type) for p in stage.markers]

          print("S2_RAPID",[(c.start.day.isoformat(),c.end.day.isoformat(),c.direction,round(c.visual_y_share,4)) for c in s2.rapid_move_candidates])
          print("S3",pts(s3))
          print("S4_PROTECTED",[(p.day.isoformat(),p.value,p.pivot_type) for p in s4.protected_points])
          print("S5",pts(s5))
          print("S6",pts(s6))

          expected={
              ("2020-03-24",9.1,"high"),
              ("2020-06-09",-9.7,"low"),
          }
          actual={(p.day.isoformat(),round(p.value,1),p.pivot_type) for p in s5.markers}
          assert expected.issubset(actual), (expected, actual)
          PY

