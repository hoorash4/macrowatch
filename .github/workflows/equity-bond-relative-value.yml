name: Refresh equity-bond relative value

on:
  workflow_run:
    workflows: ["Deploy Supabase changes"]
    types: [completed]
  schedule:
    # 매월 2일 10:30 KST. 미국의 직전 월 마지막 거래일 자료가 확정된 뒤 실행합니다.
    - cron: "30 1 2 * *"
  workflow_dispatch:
    inputs:
      start_year:
        description: "Backfill start year"
        required: false
        default: "2002"

permissions:
  contents: read

concurrency:
  group: macrowatch-equity-bond-relative-value
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install model dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Collect monthly sources and run purged walk-forward model
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/equity_bond_pipeline.py --start-year "${{ inputs.start_year || '2002' }}"
