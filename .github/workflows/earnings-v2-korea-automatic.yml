name: Earnings V2 Korea automatic

on:
  schedule:
    # GitHub Actions cron uses UTC: KST 19:30 / 20:30 on weekdays.
    - cron: "30 10 * * 1-5"
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
    inputs:
      phase:
        description: Automatic collection phase
        required: true
        default: all
        type: choice
        options: [dart, kis, all]
      write:
        description: Persist automatic collection results
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: earnings-v2-korea-automatic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Run the selected automatic collection phase
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: backend
          EARNINGS_V2_AUTOMATIC_DEADLINE_SECONDS: "240"
          WRITE: ${{ github.event_name == 'schedule' && 'true' || inputs.write }}
          PHASE: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 10 * * 1-5' && 'dart' || 'kis') || inputs.phase }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          EARNINGS_FINANCIAL_SOURCE_TOKEN: ${{ secrets.EARNINGS_FINANCIAL_SOURCE_TOKEN }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          [[ "$WRITE" == "true" ]] && args+=(--write)
          args+=(--phase "$PHASE")
          timeout --signal=TERM --kill-after=10s 300s python -m earnings_v2.automatic_cli "${args[@]}"
