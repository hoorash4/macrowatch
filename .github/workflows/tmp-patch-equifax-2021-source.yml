name: tmp patch Equifax 2021 source
on:
  push:
    branches: [main]
    paths: [".github/workflows/tmp-patch-equifax-2021-source.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch verified source and remove temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/sources/paynet_loan_performance.py')
          s=p.read_text()
          anchor='    date(2021, 9, 1): (1.26, 0.43, 2.21, "Equifax-Nov-2021"),\n'
          extra=(
            '    date(2021, 8, 1): (1.26, 0.44, 2.34, "Equifax-Nov-2021-derived-from-Sep-MoM"),\n'
            '    date(2021, 7, 1): (1.29, 0.44, 2.50, "Equifax-Sep-2021"),\n'
            '    date(2021, 6, 1): (1.29, 0.46, 2.64, "Equifax-Aug-2021"),\n'
            '    date(2021, 5, 1): (1.31, 0.50, 2.81, "Equifax-Jul-2021"),\n'
            '    date(2021, 4, 1): (1.40, 0.55, 2.97, "Equifax-Jul-2021-derived-from-May-MoM"),\n'
          )
          if 'date(2021, 4, 1)' not in s:
              if anchor not in s: raise SystemExit('anchor missing')
              p.write_text(s.replace(anchor, anchor+extra, 1))
          for f in ['.github/workflows/tmp-equifax-2021-gap.yml','.github/workflows/tmp-patch-equifax-2021-source.yml']:
              q=Path(f)
              if q.exists(): q.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pin contemporaneous Equifax 2021 observations"
          git push
