name: Inspect US2Y 2023-05-04 temp
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-inspect-us2y-20230504.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Inspect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows, line_role_map
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          import historical_pivot_stage5 as s5mod
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US2Y")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals);pad=(hi-lo)*.08 if hi!=lo else 1
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)
          s1=calculate_base_pivots(rows,freq);s2=classify_special_structures(s1,g);s3=simplify_pivot_lines(s2,g);s4=finalize_rapid_moves(s3,g)

          line_map={}
          for seg in s4.segments:
              line_map[(seg.start.day,seg.start.value)]=seg.start
              line_map[(seg.end.day,seg.end.value)]=seg.end
          points=tuple(sorted(line_map.values(),key=lambda p:p.day))
          roles=line_role_map(points)
          print("S4_POINTS",[(p.day.isoformat(),p.value,roles[(p.day,p.value)]) for p in points])
          print("S4_PROTECTED",[(p.day.isoformat(),p.value) for p in s4.protected_points])
          print("S4_SEGMENTS",[(x.start.day.isoformat(),x.start.value,x.end.day.isoformat(),x.end.value,x.kind) for x in s4.segments])

          candidates=s5mod._process_window(points,g,10.0)
          print("S5_CANDIDATES",[(a.day.isoformat(),a.value,b.day.isoformat(),b.value) for a,b in candidates])

          # reproduce filtering only for visibility
          ordered=sorted(candidates,key=lambda item:(item[0].day,-item[1].day.toordinal()))
          filtered=[]
          for startp,endp in ordered:
              if not filtered:
                  filtered.append((startp,endp));continue
              ps,pe=filtered[-1]
              if startp.day==ps.day:
                  if endp.day>pe.day: filtered[-1]=(startp,endp)
                  continue
              if startp.day<pe.day: continue
              filtered.append((startp,endp))
          print("S5_FILTERED",[(a.day.isoformat(),a.value,b.day.isoformat(),b.value) for a,b in filtered])

          s5=prune_same_trend_extremes(s4,g)
          s6=prune_unconfirmed_retracements(s5,g)
          print("S5",[(p.day.isoformat(),p.value) for p in s5.markers])
          print("S6",[(p.day.isoformat(),p.value) for p in s6.markers])
          PY
