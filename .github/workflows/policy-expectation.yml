name: Refresh market-implied policy expectations

on:
  schedule:
    # 07:30 KST: after U.S. daily rate releases and 30 minutes after the 07:00 job.
    - cron: "50 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macrowatch-policy-expectation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: pip install --disable-pip-version-check requests
      - name: Collect and calculate daily policy expectations
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python -m signals.policy_expectation_pipeline --days 21
