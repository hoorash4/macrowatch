name: Refresh market-implied policy expectations

on:
  # ì ì¤í¤ë§ê° ë¨¼ì  ì ì©ë ë¤ ìµì´ ì´ë ¥ì ì±ì ë°°í¬ ììê³¼ì ê²½ìì ë§ìµëë¤.
  workflow_run:
    workflows: ["Deploy Supabase changes"]
    types: [completed]
  schedule:
    # 07:30 KST: after U.S. daily rate releases and 30 minutes after the 07:00 job.
    - cron: "50 20 * * *"
  workflow_dispatch:
    inputs:
      start_year:
        description: "Backfill starting year"
        required: false
        default: "2000"
        type: string

permissions:
  contents: read

concurrency:
  group: macrowatch-policy-expectation
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: pip install --disable-pip-version-check requests
      - name: Collect and calculate daily policy expectations
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PYTHONPATH=backend python -m signals.policy_expectation_pipeline --days 21
          else
            PYTHONPATH=backend python -m signals.policy_expectation_pipeline --start-year "${{ inputs.start_year || '2000' }}"
          fi
