name: Verify FOMC sources once

on:
  push:
    paths:
      - ".github/workflows/verify-fomc-sources-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh workflow run central-bank-policy.yml -f mode=latest
