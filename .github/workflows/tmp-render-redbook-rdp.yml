name: Render REDBOOK Stage1 RDP temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-render-redbook-rdp.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check matplotlib
      - name: Render REDBOOK RDP
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p tmp-redbook-rdp
          PYTHONPATH=backend python - <<'PY'
          import matplotlib.pyplot as plt
          from common import SupabaseRest
          from historical_pivot_base import load_case_series, ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots, augment_spike_entry_points

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(
              db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="REDBOOK"
          )
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals)
          pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          base=calculate_base_pivots(rows,freq)
          s1=augment_spike_entry_points(base,g)

          print("HIGH_RDP",[(p.day.isoformat(),round(p.value,4)) for p in base.high_pivots if 2020<=p.day.year<=2022])
          print("LOW_RDP",[(p.day.isoformat(),round(p.value,4)) for p in base.low_pivots if 2020<=p.day.year<=2022])
          print("SPIKES",[(s.point.day.isoformat(),round(s.point.value,4),s.direction,round(s.angle_deg,3),None if s.entry is None else (s.entry.day.isoformat(),round(s.entry.value,4)),s.marker_only) for s in s1.spike_peaks])

          fig,ax=plt.subplots(figsize=(14,7))
          ax.plot([p.day for p in raw],[p.value for p in raw],linewidth=1.0,label="raw")
          highs=sorted(base.high_pivots,key=lambda p:p.day)
          lows=sorted(base.low_pivots,key=lambda p:p.day)
          ax.plot([p.day for p in highs],[p.value for p in highs],linewidth=2.2,marker="^",label="high RDP")
          ax.plot([p.day for p in lows],[p.value for p in lows],linewidth=2.2,marker="v",label="low RDP")
          for idx,s in enumerate(s1.spike_peaks):
              ax.scatter([s.point.day],[s.point.value],s=130,marker="*",label="spike peak" if idx==0 else None,zorder=6)
              if s.entry is not None:
                  ax.plot([s.entry.day,s.point.day],[s.entry.value,s.point.value],linewidth=4,alpha=.45,label="spike entry→peak" if idx==0 else None)
          ax.set_title("REDBOOK · Stage 1 base high/low RDP + spike detection")
          ax.set_xlim(start,end)
          ax.set_ylim(g.y_min,g.y_max)
          ax.grid(True,alpha=.2)
          ax.legend(loc="best")
          fig.tight_layout()
          fig.savefig("tmp-redbook-rdp/REDBOOK_STAGE1_RDP.png",dpi=160)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: redbook-stage1-rdp
          path: tmp-redbook-rdp/REDBOOK_STAGE1_RDP.png
          if-no-files-found: error
