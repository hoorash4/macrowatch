name: Persist 2022 historical pivots temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-persist-2022-pivots.yml"

permissions:
  contents: read

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Run current Stage 1-6 pipeline and persist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          import json
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements
          from historical_pivot_store import store_pipeline_result

          CASE="tightening_2022"
          INDEX="NASDAQ_COMPOSITE"
          ALGO="stage6-971169d138a6"
          SERIES=[
              "US2Y","US10Y","US10Y_REAL","US10Y2Y",
              "HY_OAS","NFCI_CREDIT","NFCI_RISK","EM_OAS",
              "WTI","REDBOOK","WEI","EMRATIO","US_RETAIL_SALES",
              "US_CPI","US_CORE_CPI","US_PPI","US_CORE_PPI",
              "US_PCE","US_CORE_PCE",
              "US_SBDI_31_180","US_SBDFI","US_COMMERCIAL_CH11",
          ]

          db=SupabaseRest()
          summary=[]
          failed=[]
          for code in SERIES:
              try:
                  rows,freq,start,end=load_case_series(
                      db,case_code=CASE,index_code=INDEX,series_code=code
                  )
                  raw=normalize_rows(rows)
                  vals=[p.value for p in raw if start <= p.day <= end]
                  if not vals:
                      raise RuntimeError("no normalized values in buffer")
                  lo,hi=min(vals),max(vals)
                  pad=(hi-lo)*0.08 if hi != lo else 1.0
                  geometry=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

                  s1=calculate_base_pivots(rows,freq)
                  s2=classify_special_structures(s1,geometry)
                  s3=simplify_pivot_lines(s2,geometry)
                  s4=finalize_rapid_moves(s3,geometry)
                  s5=prune_same_trend_extremes(s4,geometry)
                  s6=prune_unconfirmed_retracements(s5,geometry)

                  stored=store_pipeline_result(
                      db,
                      case_code=CASE,
                      index_code=INDEX,
                      series_code=code,
                      algorithm_version=ALGO,
                      source_rows=rows,
                      frequency=freq,
                      buffer_start=start,
                      buffer_end=end,
                      base=s1,
                      stage1=s1,
                      stage2=s2,
                      stage3=s3,
                      stage4=s4,
                      stage5=s5,
                      final=s6,
                  )
                  item={"series":code,"frequency":freq,"source_points":len(rows),"final_pivots":len(s6.markers),"stored":stored}
                  summary.append(item)
                  print("STORED",json.dumps(item,ensure_ascii=False))
              except Exception as exc:
                  item={"series":code,"error":f"{type(exc).__name__}: {exc}"}
                  failed.append(item)
                  print("FAILED",json.dumps(item,ensure_ascii=False))

          print("SUMMARY_JSON",json.dumps({"stored":summary,"failed":failed},ensure_ascii=False))
          if failed:
              raise SystemExit(2)
          PY
