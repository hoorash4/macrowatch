name: One-off historical indicator list cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-history-list-cleanup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch historical indicator list
        run: |
          python - <<'PY'
          from pathlib import Path

          data_path = Path('assets/js/historical-insight/historical-indicator-data.js')
          data = data_path.read_text()
          old = "visible:results.length>0||nearMissPivots.length>0,aiSourced:true"
          new = "visible:results.length>0||scoredNearMisses.length>0,aiSourced:true"
          if old not in data:
              raise SystemExit('historical-indicator-data visible condition not found')
          data_path.write_text(data.replace(old, new, 1))

          ui_path = Path('assets/js/historical-insight/historical-insight.js')
          ui = ui_path.read_text()
          old_decl = "name=document.createElement('span'),score=document.createElement('em'),anchors=anchorSummary(item),nearMisses=nearMissSummary(item),signalState=item.evidence?.signalState;"
          new_decl = "name=document.createElement('span'),anchors=anchorSummary(item),nearMisses=nearMissSummary(item),signalState=item.evidence?.signalState;"
          if old_decl not in ui:
              raise SystemExit('historical score declaration not found')
          ui = ui.replace(old_decl, new_decl, 1)

          old_score = "name.textContent=item.meta.title;score.className='historical-indicator-score';score.textContent=activeMode==='history'?(item.results?.length?`${Math.round(item.overallScore)}점`:'0점 · 범위 근접'):signalState==='market_relevant_confirmed'?`시장 관련 ${Math.round(item.evidence.score)}점`:signalState==='structural_only'?`구조 유지 ${Math.round(item.evidence.score)}점`:signalState==='candidate'?`후보 ${Math.round(item.evidence.score)}점`:signalState==='watch'?`감시 ${Math.round(item.evidence.score)}점`:'신호 없음';label.append(input,name,score);"
          new_score = "name.textContent=item.meta.title;label.append(input,name);if(activeMode==='current'){const score=document.createElement('em');score.className='historical-indicator-score';score.textContent=signalState==='market_relevant_confirmed'?`시장 관련 ${Math.round(item.evidence.score)}점`:signalState==='structural_only'?`구조 유지 ${Math.round(item.evidence.score)}점`:signalState==='candidate'?`후보 ${Math.round(item.evidence.score)}점`:signalState==='watch'?`감시 ${Math.round(item.evidence.score)}점`:'신호 없음';label.append(score);}"
          if old_score not in ui:
              raise SystemExit('historical score rendering block not found')
          ui = ui.replace(old_score, new_score, 1)

          old_badge = "badge.textContent=`${type} 근접`;"
          if old_badge not in ui:
              raise SystemExit('near-miss badge text not found')
          ui = ui.replace(old_badge, "badge.textContent=type;", 1)
          ui_path.write_text(ui)
          PY
      - name: Commit patch and remove one-off workflow
        run: |
          rm .github/workflows/oneoff-history-list-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/historical-insight/historical-indicator-data.js assets/js/historical-insight/historical-insight.js .github/workflows/oneoff-history-list-cleanup.yml
          git commit -m "Hide historical list scores and reference-only rows"
          git push
