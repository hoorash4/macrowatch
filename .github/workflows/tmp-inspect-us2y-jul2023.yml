name: Inspect US2Y Jul2023 protection temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-inspect-us2y-jul2023.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Inspect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US2Y")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals);pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)
          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)
          s3=simplify_pivot_lines(s2,g)
          s4=finalize_rapid_moves(s3,g)

          print("HIGH_SIDEWAYS",[(x.start.day.isoformat(),x.start.value,x.end.day.isoformat(),x.end.value,x.prior_trend,x.angle_deg,x.protected) for x in s2.high_sideways_segments])
          print("LOW_SIDEWAYS",[(x.start.day.isoformat(),x.start.value,x.end.day.isoformat(),x.end.value,x.prior_trend,x.angle_deg,x.protected) for x in s2.low_sideways_segments])
          print("SPIKES",[(x.point.day.isoformat(),x.point.value,x.direction,x.marker_only,None if x.entry is None else (x.entry.day.isoformat(),x.entry.value)) for x in s2.spike_peaks])
          print("RAPID",[(x.start.day.isoformat(),x.start.value,x.end.day.isoformat(),x.end.value,x.direction) for x in s2.rapid_move_candidates])
          print("S3_SEGMENTS",[(x.start.day.isoformat(),x.start.value,x.end.day.isoformat(),x.end.value,x.kind) for x in s3.segments])
          print("S4_PROTECTED",[(p.day.isoformat(),p.value,p.pivot_type) for p in s4.protected_points])
          PY
