name: Render CH11 stage3 stage6 temp
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-render-ch11-stage3-stage6.yml"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check matplotlib
      - name: Render
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p out
          PYTHONPATH=backend python - <<'PY'
          from datetime import date, timedelta
          import matplotlib.pyplot as plt
          from common import SupabaseRest
          from historical_pivot_base import _get_rows_paginated, _single_row
          from historical_pivot_shared import ChartGeometry, normalize_rows, buffer_bounds
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements

          CASE="tightening_2022"; INDEX="NASDAQ_COMPOSITE"; CODE="US_COMMERCIAL_CH11"
          FRAME_W=950.0; FRAME_H=464.0
          START_X=FRAME_W*0.12; TROUGH_X=FRAME_W*0.88
          TOP_PAD=FRAME_H*0.08; BOTTOM_PAD=FRAME_H*0.08; DATA_H=FRAME_H-TOP_PAD-BOTTOM_PAD
          db=SupabaseRest()
          cycle=_single_row(db,"historical_case_market_cycles",{
              "select":"start_date,trough_date","case_code":f"eq.{CASE}","index_code":f"eq.{INDEX}","limit":"2"
          })
          start=date.fromisoformat(str(cycle["start_date"])[:10]); trough=date.fromisoformat(str(cycle["trough_date"])[:10])
          buffer_start,buffer_end=buffer_bounds(start,trough)
          px_per_day=(TROUGH_X-START_X)/(trough-start).days
          display_start=start-timedelta(days=START_X/px_per_day)
          display_end=trough+timedelta(days=(FRAME_W-TROUGH_X)/px_per_day)

          rows=_get_rows_paginated(db,"economic_chart_series_points",{
              "select":"observation_date,value,frequency",
              "series_code":f"eq.{CODE}",
              "observation_date":f"gte.{buffer_start.isoformat()}",
              "and":f"(observation_date.lte.{buffer_end.isoformat()})",
              "order":"observation_date.asc",
          })
          raw=normalize_rows(rows); freq=str(rows[0]["frequency"])
          visible=[p for p in raw if display_start<=p.day<=display_end]
          lo=min(p.value for p in visible); hi=max(p.value for p in visible); span=hi-lo
          ypad=1.0 if span==0 else span*(0.08/0.84)
          geom=ChartGeometry(display_start,display_end,lo-ypad,hi+ypad,FRAME_W,FRAME_H)

          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,geom)
          s3=simplify_pivot_lines(s2,geom)
          s4=finalize_rapid_moves(s3,geom)
          s5=prune_same_trend_extremes(s4,geom)
          s6=prune_unconfirmed_retracements(s5,geom)

          print("S3",[(p.day.isoformat(),p.value) for p in s3.markers])
          print("S6",[(p.day.isoformat(),p.value) for p in s6.markers])

          extra_left=(display_start-buffer_start).days*px_per_day
          extra_right=(buffer_end-display_end).days*px_per_day
          full_w=extra_left+FRAME_W+extra_right

          def render(stage,name):
              dpi=180
              fig=plt.figure(figsize=((full_w*2)/dpi,(FRAME_H*2)/dpi),dpi=dpi)
              ax=fig.add_axes([0,0,1,1])
              def x_of(d): return 2*(extra_left+(d-display_start).days*px_per_day)
              def y_of(v): return 2*(TOP_PAD+(v-lo)/span*DATA_H) if span else FRAME_H
              ax.plot([x_of(p.day) for p in raw],[y_of(p.value) for p in raw],linewidth=1.4,label="raw")
              for seg in stage.segments:
                  ax.plot([x_of(seg.start.day),x_of(seg.end.day)],[y_of(seg.start.value),y_of(seg.end.value)],linewidth=3.2)
              for p in stage.markers:
                  ax.scatter([x_of(p.day)],[y_of(p.value)],s=40)
                  ax.annotate(p.day.strftime("%Y-%m-%d"),(x_of(p.day),y_of(p.value)),xytext=(0,8),textcoords="offset points",fontsize=7,ha="center")
              frame_left=2*extra_left; frame_right=frame_left+2*FRAME_W
              ax.axvspan(frame_left,frame_right,alpha=.08)
              ax.axvline(frame_left+2*START_X,linestyle="--",linewidth=1)
              ax.axvline(frame_left+2*TROUGH_X,linestyle="--",linewidth=1)
              ax.text(frame_left+2*START_X,2*FRAME_H-16,"START",ha="center",va="top",fontsize=9)
              ax.text(frame_left+2*TROUGH_X,2*FRAME_H-16,"TROUGH",ha="center",va="top",fontsize=9)
              ax.set_xlim(0,2*full_w); ax.set_ylim(0,2*FRAME_H); ax.set_xticks([]); ax.set_yticks([])
              ax.set_title(name,fontsize=11,pad=10)
              fig.savefig(f"out/{name}.png",dpi=dpi)
              plt.close(fig)

          render(s3,"US_COMMERCIAL_CH11_STAGE3_2X")
          render(s6,"US_COMMERCIAL_CH11_STAGE6_2X")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ch11-stage3-stage6
          path: out/*.png
          if-no-files-found: error
