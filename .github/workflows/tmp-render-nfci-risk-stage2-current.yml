name: Render NFCI Risk Stage2 current temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-render-nfci-risk-stage2-current.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check matplotlib
      - name: Render NFCI Risk Stage2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p tmp-nfci-risk-stage2-current
          PYTHONPATH=backend python - <<'PY'
          import matplotlib.pyplot as plt
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(
              db,
              case_code="tightening_2022",
              index_code="NASDAQ_COMPOSITE",
              series_code="NFCI_RISK",
          )
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals)
          pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)

          print("HIGH",[(p.day.isoformat(),round(p.value,6)) for p in s2.high_pivots])
          print("LOW",[(p.day.isoformat(),round(p.value,6)) for p in s2.low_pivots])
          print("SPIKES",[(s.point.day.isoformat(),round(s.point.value,6),s.direction) for s in s2.spike_peaks])
          print("RAPID",[(c.start.day.isoformat(),round(c.start.value,6),c.end.day.isoformat(),round(c.end.value,6),c.direction) for c in s2.rapid_move_candidates])
          print("SIDEWAYS_H",[(s.start.day.isoformat(),s.end.day.isoformat(),s.protected) for s in s2.high_sideways_segments])
          print("SIDEWAYS_L",[(s.start.day.isoformat(),s.end.day.isoformat(),s.protected) for s in s2.low_sideways_segments])

          fig,ax=plt.subplots(figsize=(14,7))
          ax.plot([p.day for p in raw],[p.value for p in raw],linewidth=1.0,label="raw")

          if s2.high_pivots:
              ax.plot([p.day for p in s2.high_pivots],[p.value for p in s2.high_pivots],linewidth=1.8,label="upper RDP")
              ax.scatter([p.day for p in s2.high_pivots],[p.value for p in s2.high_pivots],s=34,marker="^")
          if s2.low_pivots:
              ax.plot([p.day for p in s2.low_pivots],[p.value for p in s2.low_pivots],linewidth=1.8,label="lower RDP")
              ax.scatter([p.day for p in s2.low_pivots],[p.value for p in s2.low_pivots],s=34,marker="v")

          for cand in s2.rapid_move_candidates:
              ax.plot([cand.start.day,cand.end.day],[cand.start.value,cand.end.value],linewidth=3.0,linestyle="--")
          for spike in s2.spike_peaks:
              ax.scatter([spike.point.day],[spike.point.value],s=90,marker="*")
              if spike.entry is not None:
                  ax.plot([spike.entry.day,spike.point.day],[spike.entry.value,spike.point.value],linewidth=3.0)

          for seg in (*s2.high_sideways_segments,*s2.low_sideways_segments):
              ax.plot([seg.start.day,seg.end.day],[seg.start.value,seg.end.value],linewidth=4.0,alpha=.55)

          for p in s2.provisional_protected_points:
              ax.scatter([p.day],[p.value],s=70,facecolors="none",edgecolors="black",linewidths=1.2)

          ax.set_title("NFCI Risk · Stage 2 · current")
          ax.set_xlim(start,end)
          ax.set_ylim(g.y_min,g.y_max)
          ax.grid(True,alpha=.2)
          ax.legend(loc="best")
          fig.tight_layout()
          fig.savefig("tmp-nfci-risk-stage2-current/NFCI_RISK_STAGE2_CURRENT.png",dpi=160)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nfci-risk-stage2-current
          path: tmp-nfci-risk-stage2-current/NFCI_RISK_STAGE2_CURRENT.png
          if-no-files-found: error
