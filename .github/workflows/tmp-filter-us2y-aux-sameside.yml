name: Filter US2Y aux rapid same-side temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-filter-us2y-aux-sameside.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Measure
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows, screen_segment_angle_degrees
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import _entry_before_peak, _visual_y_share

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US2Y")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals); pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)
          s1=calculate_base_pivots(rows,freq)
          highs=tuple(sorted(s1.high_pivots,key=lambda p:p.day))
          lows=tuple(sorted(s1.low_pivots,key=lambda p:p.day))

          found=[]

          for a,b in zip(highs,highs[1:]):
              if b.value <= a.value:
                  continue
              entry=_entry_before_peak(
                  a_point=a,peak=b,
                  opposite_rdp=lows,
                  opposite_candidates=s1.low_candidates,
                  direction="up",
              )
              share=_visual_y_share(entry,b,g)
              if not (0.20 <= share < 0.30):
                  continue
              vang=90.0-abs(screen_segment_angle_degrees(entry,b,g))
              if vang > 20.0:
                  continue
              next_same=next((p for p in highs if p.day>b.day),None)
              move=float(b.value)-float(entry.value)
              retr=0.0
              if next_same is not None and next_same.value < b.value and move>0:
                  retr=(float(b.value)-float(next_same.value))/move
              found.append(("UP",entry,b,share,vang,next_same,retr,retr<0.30))

          for a,b in zip(lows,lows[1:]):
              if b.value >= a.value:
                  continue
              entry=_entry_before_peak(
                  a_point=a,peak=b,
                  opposite_rdp=highs,
                  opposite_candidates=s1.high_candidates,
                  direction="down",
              )
              share=_visual_y_share(entry,b,g)
              if not (0.20 <= share < 0.30):
                  continue
              vang=90.0-abs(screen_segment_angle_degrees(entry,b,g))
              if vang > 20.0:
                  continue
              next_same=next((p for p in lows if p.day>b.day),None)
              move=float(entry.value)-float(b.value)
              retr=0.0
              if next_same is not None and next_same.value > b.value and move>0:
                  retr=(float(next_same.value)-float(b.value))/move
              found.append(("DOWN",entry,b,share,vang,next_same,retr,retr<0.30))

          for side,entry,b,share,vang,next_same,retr,keep in sorted(found,key=lambda x:x[1].day):
              print("AUX",
                    side,
                    "ENTRY",entry.day.isoformat(),entry.value,entry.pivot_type,
                    "END",b.day.isoformat(),b.value,b.pivot_type,
                    "SHARE",share,
                    "Y_AXIS_ANGLE",vang,
                    "NEXT_SAME",None if next_same is None else (next_same.day.isoformat(),next_same.value,next_same.pivot_type),
                    "RETRACE",retr,
                    "KEEP",keep)
          PY
