name: Analyze daily news

on:
  push:
    branches: [main]
  schedule:
    # 23:30 KST, with two fallbacks inside the requested 23:30-00:00 window.
    - cron: "30 14 * * *"
    - cron: "40 14 * * *"
    - cron: "50 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyze without saving results"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macrowatch-news-pipeline
  cancel-in-progress: false

jobs:
  analyze-news:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-news]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Run news pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEWS_PIPELINE_SECRET: ${{ secrets.NEWS_PIPELINE_TRIGGER_SECRET }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          request_batch() {
            local payload="$1" response status
            response=$(mktemp)
            status=$(curl --silent --show-error --output "$response" --write-out "%{http_code}" --max-time 300 \
              --request POST "$SUPABASE_URL/functions/v1/news-pipeline" \
              --header "x-news-pipeline-secret: $NEWS_PIPELINE_SECRET" \
              --header "Content-Type: application/json" \
              --data "$payload") || status=000
            cat "$response"
            rm "$response"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "news-pipeline request failed with HTTP $status" >&2
              return 1
            fi
          }
          offset=0
          while true; do
            response=$(request_batch "{\"lookback_hours\":24,\"offset\":$offset,\"limit\":10,\"dry_run\":$DRY_RUN,\"mark_complete\":true}")
            echo "$response"
            [ "$(jq -r '.already_completed // false' <<< "$response")" = "true" ] && break
            [ "$(jq -r '.has_more' <<< "$response")" = "true" ] || break
            offset=$(jq -r '.next_offset' <<< "$response")
          done
