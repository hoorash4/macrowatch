name: Analyze daily news

on:
  schedule:
    # 00:30 KST. A failed run is investigated and retried by the collection
    # path rather than by overlapping scheduled workflow runs.
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyze without saving results"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macrowatch-news-pipeline
  cancel-in-progress: false

jobs:
  analyze-news:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install notification dependency
        run: pip install requests

      - name: Run news pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEWS_PIPELINE_SECRET: ${{ secrets.NEWS_PIPELINE_TRIGGER_SECRET }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          request_batch() {
            local payload="$1" response status
            response=$(mktemp)
            status=$(curl --silent --show-error --output "$response" --write-out "%{http_code}" --max-time 300 \
              --request POST "$SUPABASE_URL/functions/v1/news-pipeline" \
              --header "x-news-pipeline-secret: $NEWS_PIPELINE_SECRET" \
              --header "Content-Type: application/json" \
              --data "$payload") || status=000
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              # 실패 응답은 command substitution에 가려지지 않도록 stderr에도 남긴다.
              cat "$response" >&2
              rm "$response"
              echo "news-pipeline request failed with HTTP $status" >&2
              return 1
            fi
            cat "$response"
            rm "$response"
          }
          offset=0
          limit=10
          lookback_hours=24
          [ "$DRY_RUN" = "true" ] && limit=1
          while true; do
            response=$(request_batch "{\"lookback_hours\":$lookback_hours,\"offset\":$offset,\"limit\":$limit,\"dry_run\":$DRY_RUN,\"mark_complete\":true}")
            echo "$response"
            if [ "$offset" -eq 0 ] && [ "$(jq '.errors | length' <<< "$response")" -gt 0 ]; then
              echo "::warning::일부 RSS 피드 수집에 실패했습니다: $(jq -c '.errors' <<< "$response")"
            fi
            [ "$DRY_RUN" = "true" ] && break
            [ "$(jq -r '.already_completed // false' <<< "$response")" = "true" ] && break
            [ "$(jq -r '.has_more' <<< "$response")" = "true" ] || break
            offset=$(jq -r '.next_offset' <<< "$response")
          done
