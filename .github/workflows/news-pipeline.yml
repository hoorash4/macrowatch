name: Analyze daily news

on:
  push:
    branches: [main]
  schedule:
    # 20:30 UTC = 05:30 KST
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyze without saving results"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macrowatch-news-pipeline
  cancel-in-progress: false

jobs:
  analyze-news:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-news]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run news pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          payload='{"lookback_hours":24}'
          if [ "$DRY_RUN" = "true" ]; then
            payload='{"lookback_hours":24,"dry_run":true}'
          fi
          curl --fail-with-body --retry 2 --max-time 900 \
            --request POST "$SUPABASE_URL/functions/v1/news-pipeline" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data "$payload"
