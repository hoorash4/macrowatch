name: Refresh Korea small business risk

on:
  workflow_run:
    workflows: ["Deploy Supabase changes"]
    types: [completed]
  schedule:
    # 06:40 KST: KOSIS와 금감원 신규 월을 매일 확인한다.
    - cron: "40 21 * * *"
  workflow_dispatch:
    inputs:
      replace:
        description: "외부 원자료로 10년 구간 전체 교체"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macrowatch-korea-small-business-risk
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install data clients
        run: pip install --disable-pip-version-check requests pypdf
      - name: Collect Korea small business risk
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.replace }}" = "true" ]; then
            PYTHONPATH=backend python -m signals.korea_small_business_risk_pipeline --start 2020-01 --replace
          else
            PYTHONPATH=backend python -m signals.korea_small_business_risk_pipeline --years 1 --bootstrap-if-empty
          fi
