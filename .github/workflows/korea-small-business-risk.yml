name: Refresh Korea small business risk

on:
  schedule:
    # 06:40 KST: KOSIS와 ECOS 신규 월을 매일 확인한다.
    - cron: "40 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macrowatch-korea-small-business-risk
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install data clients
        run: pip install --disable-pip-version-check requests pypdf olefile
      - name: Collect Korea small business risk
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python -m signals.korea_small_business_risk_pipeline --years 1
