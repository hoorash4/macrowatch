name: tmp patch Equifax usis pattern
on:
  push:
    branches: [main]
    paths: [".github/workflows/tmp-patch-equifax-usis-pattern.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch legacy usis filenames and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/sources/paynet_loan_performance.py')
          s=p.read_text()
          needle='        f"Equifax.MonthlyStrategicInsights.{full}{year}.pdf",\n'
          extra=(
              '        f"equifax-monthly-strategic-insights-{low}{year}.pdf",\n'
              '        f"equifax-monthly-strategic-insights-{low}-{year}.pdf",\n'
              '        f"equifax-monthly-strategic-insights-{abbr_low}{year}.pdf",\n'
          )
          if 'equifax-monthly-strategic-insights-{low}{year}.pdf' not in s:
              if needle not in s: raise SystemExit('anchor missing')
              p.write_text(s.replace(needle, needle+extra, 1))
          Path('.github/workflows/tmp-patch-equifax-usis-pattern.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support legacy Equifax USIS filenames"
          git push
