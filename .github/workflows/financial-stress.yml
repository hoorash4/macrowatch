name: Refresh U.S. market stress

on:
  schedule:
    # 06:10 KST: refresh the monthly and weekly market-stress series.
    - cron: "10 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macrowatch-financial-stress
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install spreadsheet reader
        run: pip install --disable-pip-version-check openpyxl requests
      - name: Collect U.S. market stress data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python -m signals.financial_stress_pipeline --years 3
