name: Refresh U.S. credit stress

on:
  schedule:
    # 06:10 KST: update the in-progress month's averages every day.
    - cron: "10 21 * * *"
  workflow_dispatch:
    inputs:
      years:
        description: "Backfill window in years (1-10)"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: macrowatch-financial-stress
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install spreadsheet reader
        run: pip install --disable-pip-version-check openpyxl requests
      - name: Collect monthly stress data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python backend/financial_stress_pipeline.py --years 3
          else
            python backend/financial_stress_pipeline.py --years "${{ inputs.years || '3' }}"
          fi
