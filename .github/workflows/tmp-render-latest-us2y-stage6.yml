name: Render latest US2Y Stage6 temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-render-latest-us2y-stage6.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check matplotlib
      - name: Render
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p tmp-latest-us2y-stage6
          PYTHONPATH=backend python - <<'PY'
          import matplotlib.pyplot as plt
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US2Y")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals)
          pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)
          s3=simplify_pivot_lines(s2,g)
          s4=finalize_rapid_moves(s3,g)
          s5=prune_same_trend_extremes(s4,g)
          s6=prune_unconfirmed_retracements(s5,g)

          print("S2_RAPID",[(c.start.day.isoformat(),c.start.value,c.end.day.isoformat(),c.end.value,c.direction,round(c.visual_y_share,4)) for c in s2.rapid_move_candidates])
          print("S3_MARKERS",[(p.day.isoformat(),p.value,p.pivot_type) for p in s3.markers])
          print("S4_PROTECTED",[(p.day.isoformat(),p.value,p.pivot_type) for p in s4.protected_points])
          print("S5_MARKERS",[(p.day.isoformat(),p.value,p.pivot_type) for p in s5.markers])
          print("S6_MARKERS",[(p.day.isoformat(),p.value,p.pivot_type) for p in s6.markers])

          fig,ax=plt.subplots(figsize=(14,7))
          ax.plot([p.day for p in raw],[p.value for p in raw],linewidth=1.0,label="raw")
          for seg in s6.segments:
              ax.plot([seg.start.day,seg.end.day],[seg.start.value,seg.end.value],linewidth=2.6)
          highs=[p for p in s6.markers if p.pivot_type=="high"]
          lows=[p for p in s6.markers if p.pivot_type=="low"]
          if highs: ax.scatter([p.day for p in highs],[p.value for p in highs],s=42,marker="^",label="Stage 6 high")
          if lows: ax.scatter([p.day for p in lows],[p.value for p in lows],s=42,marker="v",label="Stage 6 low")
          for p in s6.markers:
              ax.annotate(p.day.strftime("%Y-%m-%d"),(p.day,p.value),xytext=(0,8),textcoords="offset points",fontsize=7,ha="center")
          ax.set_title("US 2Y Treasury Yield · Stage 6 · latest")
          ax.set_xlim(start,end);ax.set_ylim(g.y_min,g.y_max);ax.grid(True,alpha=.2);ax.legend(loc="best")
          fig.tight_layout();fig.savefig("tmp-latest-us2y-stage6/US2Y_STAGE6_LATEST.png",dpi=160);plt.close(fig)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: latest-us2y-stage6
          path: tmp-latest-us2y-stage6/US2Y_STAGE6_LATEST.png
          if-no-files-found: error
