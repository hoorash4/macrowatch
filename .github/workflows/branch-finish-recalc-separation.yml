name: Finish recalculation separation

on:
  push:
    branches: [fix/separate-stored-recalculation]
    paths:
      - ".github/workflows/branch-finish-recalc-separation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/separate-stored-recalculation
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Patch composition and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/earnings_v2/automatic.py')
          text = path.read_text(encoding='utf-8')
          old = '''    def __init__(self, *, krx: KrxClient, dart: OpenDartClient, repository: EarningsV2Repository,
                 kis: KisClient | None = None, fx: EcosFxClient | None = None,
                 financial_company: FinancialCompanyClient | None = None) -> None:
        self.krx, self.dart, self.repository, self.kis, self.fx = krx, dart, repository, kis, fx
        self.financial_company = financial_company
'''
          new = '''    def __init__(self, *, krx: KrxClient, dart: OpenDartClient, repository: EarningsV2Repository,
                 kis: KisClient | None = None, fx: EcosFxClient | None = None,
                 financial_company: FinancialCompanyClient | None = None,
                 recalculation: StoredQuarterRecalculation | None = None) -> None:
        self.krx, self.dart, self.repository, self.kis, self.fx = krx, dart, repository, kis, fx
        self.financial_company = financial_company
        self.recalculation = recalculation or StoredQuarterRecalculation(repository)
'''
          if old not in text:
              raise SystemExit('automatic __init__ block not found')
          text = text.replace(old, new, 1)
          old_call = 'StoredQuarterRecalculation(self.repository).recalculate_quarter(year, quarter, write=True)'
          if old_call not in text:
              raise SystemExit('recalc call not found')
          text = text.replace(old_call, 'self.recalculation.recalculate_quarter(year, quarter, write=True)', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_earnings_v2.py')
          text = path.read_text(encoding='utf-8')
          old = '''        recalculated = []
        pipeline.recalculate_quarter = lambda year, quarter, **_kwargs: recalculated.append((year, quarter)) or {"status": "ready"}
'''
          new = '''        recalculated = []
        pipeline.recalculation.recalculate_quarter = lambda year, quarter, **_kwargs: recalculated.append((year, quarter)) or {"status": "ready"}
'''
          if old not in text:
              raise SystemExit('test_earnings_v2 recalc stub not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('tests/test_earnings_v2_fsc.py')
          text = path.read_text(encoding='utf-8')
          old = '        pipeline.recalculate_quarter = lambda *_args, **_kwargs: {"status": "ready"}\n'
          new = '        pipeline.recalculation.recalculate_quarter = lambda *_args, **_kwargs: {"status": "ready"}\n'
          if old not in text:
              raise SystemExit('test_earnings_v2_fsc recalc stub not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('tests/test_backend.py')
          text = path.read_text(encoding='utf-8')
          old = '''        pipeline = (ROOT / "backend/earnings_v2/automatic.py").read_text(encoding="utf-8")
'''
          # Replace only inside the manual pending test by anchoring nearby unique text.
          anchor = '    def test_earnings_v2_pending_rows_are_immediately_manually_resolvable(self):\n'
          start = text.index(anchor)
          end = text.index('\n    def test_earnings_v2_daily_collection_is_receipt_checkpointed', start)
          block = text[start:end]
          if old not in block:
              raise SystemExit('pipeline assignment not found in pending test')
          block = block.replace(old, old + '        recalculation = (ROOT / "backend/earnings_v2/recalculation.py").read_text(encoding="utf-8")\n', 1)
          block = block.replace('        self.assertIn("def recalculate_quarter", pipeline)\n', '        self.assertIn("def recalculate_quarter", recalculation)\n')
          block = block.replace('        self.assertIn(\'"mode": "stored_recalculation"\', pipeline)\n', '        self.assertIn(\'"mode": "stored_recalculation"\', recalculation)\n')
          block = block.replace('        self.assertIn("--write", workflow)\n', '''        self.assertIn("--write", workflow)
        for secret in ("KRX_OPEN_API_KEY", "OPENDART_API_KEY", "ECOS_API_KEY", "KIS_APP_KEY", "KIS_APP_SECRET", "EARNINGS_FINANCIAL_SOURCE_TOKEN", "DATA_GO_KR_SERVICE_KEY"):
            self.assertNotIn(secret, workflow)
''')
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_collector_isolation.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'self.assertIn("StoredQuarterRecalculation(self.repository).recalculate_quarter", automatic)',
              'self.assertIn("self.recalculation.recalculate_quarter", automatic)',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('.github/workflows/earnings-v2-korea.yml')
          text = path.read_text(encoding='utf-8')
          for line in (
              '          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}\n',
              '          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}\n',
              '          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}\n',
              '          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}\n',
              '          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}\n',
              '          EARNINGS_FINANCIAL_SOURCE_TOKEN: ${{ secrets.EARNINGS_FINANCIAL_SOURCE_TOKEN }}\n',
              '          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}\n',
          ):
              text = text.replace(line, '')
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/branch-finish-recalc-separation.yml').unlink()
          PY
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Run full Python suite
        env:
          PYTHONPATH: backend
          EARNINGS_WRITE_MODE: manual
        run: |
          python -m compileall -q backend
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish stored recalculation isolation"
          git push origin HEAD:fix/separate-stored-recalculation
