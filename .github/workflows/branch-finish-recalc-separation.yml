name: Finish recalculation separation
on:
  push:
    branches:
      - fix/separate-stored-recalculation
    paths:
      - .github/workflows/branch-finish-recalc-separation.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/separate-stored-recalculation
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Patch tests and manual workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_earnings_v2.py')
          s = p.read_text()
          s = s.replace('pipeline.recalculate_quarter = lambda year, quarter, **_kwargs: recalculated.append((year, quarter)) or {"status": "ready"}', 'pipeline.recalculation.recalculate_quarter = lambda year, quarter, **_kwargs: recalculated.append((year, quarter)) or {"status": "ready"}', 1)
          p.write_text(s)
          p = Path('tests/test_earnings_v2_fsc.py')
          s = p.read_text()
          s = s.replace('pipeline.recalculate_quarter = lambda *_args, **_kwargs: {"status": "ready"}', 'pipeline.recalculation.recalculate_quarter = lambda *_args, **_kwargs: {"status": "ready"}', 1)
          p.write_text(s)
          p = Path('tests/test_backend.py')
          s = p.read_text()
          marker = '    def test_earnings_v2_pending_rows_are_immediately_manually_resolvable(self):\n'
          a = s.index(marker)
          b = s.index('\n    def test_earnings_v2_daily_collection_is_receipt_checkpointed', a)
          block = s[a:b]
          line = '        pipeline = (ROOT / "backend/earnings_v2/automatic.py").read_text(encoding="utf-8")\n'
          block = block.replace(line, line + '        recalculation = (ROOT / "backend/earnings_v2/recalculation.py").read_text(encoding="utf-8")\n', 1)
          block = block.replace('        self.assertIn("def recalculate_quarter", pipeline)\n', '        self.assertIn("def recalculate_quarter", recalculation)\n', 1)
          block = block.replace('        self.assertIn(\'"mode": "stored_recalculation"\', pipeline)\n', '        self.assertIn(\'"mode": "stored_recalculation"\', recalculation)\n', 1)
          s = s[:a] + block + s[b:]
          p.write_text(s)
          p = Path('tests/test_collector_isolation.py')
          s = p.read_text().replace('self.assertIn("StoredQuarterRecalculation(self.repository).recalculate_quarter", automatic)', 'self.assertIn("self.recalculation.recalculate_quarter", automatic)')
          p.write_text(s)
          p = Path('.github/workflows/earnings-v2-korea.yml')
          lines = p.read_text().splitlines()
          forbidden = ('KRX_OPEN_API_KEY:', 'OPENDART_API_KEY:', 'ECOS_API_KEY:', 'KIS_APP_KEY:', 'KIS_APP_SECRET:', 'EARNINGS_FINANCIAL_SOURCE_TOKEN:', 'DATA_GO_KR_SERVICE_KEY:')
          p.write_text('\n'.join(line for line in lines if not any(token in line for token in forbidden)) + '\n')
          PY
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Test Python
        env:
          PYTHONPATH: backend
          EARNINGS_WRITE_MODE: manual
        run: |
          python -m compileall -q backend
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add backend tests .github/workflows/earnings-v2-korea.yml
          git commit -m 'Complete manual earnings recalculation isolation'
          git push origin HEAD:fix/separate-stored-recalculation
