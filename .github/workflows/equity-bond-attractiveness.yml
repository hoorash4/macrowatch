name: Refresh equity-bond attractiveness flow

on:
  schedule:
    # 매주 토요일 10:10 KST. 금요일까지 확정된 주간 가격·금리를 반영합니다.
    - cron: "10 1 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macrowatch-equity-bond-attractiveness
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Calculate and store weekly relative attractiveness
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python -m signals.equity_bond_attractiveness_pipeline
