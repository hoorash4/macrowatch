name: Store Chapter 11 pivots once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-store-ch11-pivots.yml"

permissions:
  contents: read

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Recalculate and store
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements
          from historical_pivot_store import store_pipeline_result

          db=SupabaseRest()
          case_code="tightening_2022"
          index_code="NASDAQ_COMPOSITE"
          series_code="US_COMMERCIAL_CH11"
          rows,freq,start,end=load_case_series(db,case_code=case_code,index_code=index_code,series_code=series_code)
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals)
          pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)
          s3=simplify_pivot_lines(s2,g)
          s4=finalize_rapid_moves(s3,g)
          s5=prune_same_trend_extremes(s4,g)
          s6=prune_unconfirmed_retracements(s5,g)

          count=store_pipeline_result(
              db,
              case_code=case_code,
              index_code=index_code,
              series_code=series_code,
              algorithm_version="779ed8e71a8396a6d2b396bdd9c72651ae1ff8a5",
              source_rows=rows,
              frequency=freq,
              buffer_start=start,
              buffer_end=end,
              base=s1,
              stage1=s1,
              stage2=s2,
              stage3=s3,
              stage4=s4,
              stage5=s5,
              final=s6,
          )
          print("STORED",count)
          print("FINAL",[(p.day.isoformat(),p.value,p.pivot_type) for p in s6.markers])
          PY
