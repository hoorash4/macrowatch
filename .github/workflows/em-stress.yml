name: Refresh Emerging Market Stress

on:
  push:
    branches: [main]
    paths:
      - backend/em_stress_pipeline.py
      - .github/workflows/em-stress.yml
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      years:
        description: "Backfill window in years"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: macrowatch-em-stress
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check requests
      - name: Collect emerging market stress data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/em_stress_pipeline.py --years "${{ inputs.years || '3' }}"
