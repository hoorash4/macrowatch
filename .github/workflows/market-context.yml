name: Refresh canonical market indices and context

on:
  schedule:
    # 07:00 UTC = 16:00 KST, after the Korean regular-session close.
    - cron: "0 7 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: Collection mode
        required: true
        default: automatic
        type: choice
        options: [automatic, backfill]

permissions:
  contents: read

concurrency:
  group: macrowatch-market-context
  cancel-in-progress: false

jobs:
  refresh-market-context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Collect S&P 500, Nasdaq Composite and KOSPI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ github.event_name == 'schedule' && 'automatic' || inputs.mode }}
        run: |
          PYTHONPATH=backend python -m signals.market_index_collection --mode "$MODE"

      - name: Refresh derived KOSPI market context
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'automatic' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --retry 2 --max-time 120 \
            --request POST "$SUPABASE_URL/functions/v1/market-context" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}'
