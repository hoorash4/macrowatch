name: Refresh KOSPI market context

on:
  schedule:
    # 07:00 UTC = 16:00 KST, after the 15:30 regular-session close and before midnight news analysis.
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macrowatch-market-context
  cancel-in-progress: false

jobs:
  refresh-market-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh KOSPI price history and indicators
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --retry 2 --max-time 120 \
            --request POST "$SUPABASE_URL/functions/v1/market-context" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}'
