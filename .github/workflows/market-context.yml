name: Refresh KOSPI market context

on:
  push:
    branches: [main]
  schedule:
    # 04:30 UTC = 13:30 KST, after the public API publishes the prior session.
    - cron: "30 4 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macrowatch-market-context
  cancel-in-progress: false

jobs:
  refresh-market-context:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-market]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh KOSPI price history and indicators
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --retry 2 --max-time 120 \
            --request POST "$SUPABASE_URL/functions/v1/market-context" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}'
