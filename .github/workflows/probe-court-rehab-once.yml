name: Probe court rehabilitation workbook once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-court-rehab-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - name: Inspect latest court rehabilitation workbook
        run: |
          python - <<'PY'
          import json, requests
          from io import BytesIO
          from openpyxl import load_workbook
          BASE='https://portal.scourt.go.kr'
          H={'User-Agent':'Mozilla/5.0 MacroWatch/1.0','Content-Type':'application/json'}
          body={'dma_search':{'cortStatsItmLclId':'G01','cortStatsItmMclId':'T09','cortStatsItmSclId':'S05','aojStatsYr':'2026','aojStatsMm':'07','ojdpAtflDvsCd':'07'},'dma_pageInfo':{'pageNo':1,'pageSize':10,'totalYn':'Y','totalCnt':10}}
          data=requests.post(BASE+'/pgp/pgp441/selectCortStatsMmDtl.on',json=body,headers=H,timeout=45).json()['data']['dlt_aojAlmnLst']
          row=next(x for x in data if x['cortStatsItmSclNm'].endswith('회생합의사건'))
          params={'fileNm':row['excelNm'],'filePathNm':row['excelPath'],'saveFileName':row['excelNtatcAtflNm']}
          r=requests.get(BASE+'/pgp/pgp003/downloadEml.on',params=params,headers={'User-Agent':H['User-Agent']},timeout=45)
          print(json.dumps({'status':r.status_code,'type':r.headers.get('content-type'),'bytes':len(r.content),'file':row['excelNm']},ensure_ascii=False))
          wb=load_workbook(BytesIO(r.content),data_only=True,read_only=True)
          print('SHEETS',wb.sheetnames)
          for ws in wb.worksheets:
            print('SHEET',ws.title,ws.max_row,ws.max_column)
            for vals in ws.iter_rows(min_row=1,max_row=min(ws.max_row,40),values_only=True):
              print(json.dumps(list(vals),ensure_ascii=False,default=str))
          PY
