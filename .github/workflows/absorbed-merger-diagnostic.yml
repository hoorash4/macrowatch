name: Absorbed merger diagnostic

on:
  push:
    branches: [codex/absorbed-merger-events]
    paths: [.github/workflows/absorbed-merger-diagnostic.yml]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect structured merger rows
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: |
          python - <<'PY'
          import io, json, os, re, urllib.parse, urllib.request, zipfile
          for corp_code, start, end in (
              ("00311030", "20150101", "20171231"),
              ("00111722", "20150101", "20171231"),
              ("00838421", "20170101", "20191231"),
          ):
              query = urllib.parse.urlencode({
                  "crtfc_key": os.environ["OPENDART_API_KEY"],
                  "corp_code": corp_code,
                  "bgn_de": start,
                  "end_de": end,
              })
              with urllib.request.urlopen(
                  "https://opendart.fss.or.kr/api/cmpMgDecsn.json?" + query,
                  timeout=30,
              ) as response:
                  payload = json.load(response)
              rows = [{key: row.get(key) for key in (
                  "rcept_no", "corp_code", "corp_name", "mg_mth", "mg_stn",
                  "mgptncmp_cmpnm", "mgsc_mgdt",
              )} for row in payload.get("list", [])]
              print(json.dumps({"corp_code": corp_code, "status": payload.get("status"), "rows": rows}, ensure_ascii=False))
              if corp_code in {"00311030", "00111722"}:
                  selected = []
                  page = 1
                  while True:
                      list_query = urllib.parse.urlencode({
                          "crtfc_key": os.environ["OPENDART_API_KEY"],
                          "corp_code": corp_code,
                          "bgn_de": start,
                          "end_de": end,
                          "pblntf_ty": "B",
                          "page_no": page,
                          "page_count": "100",
                      })
                      with urllib.request.urlopen(
                          "https://opendart.fss.or.kr/api/list.json?" + list_query,
                          timeout=30,
                      ) as response:
                          disclosures = json.load(response)
                      selected.extend({key: row.get(key) for key in ("rcept_no", "rcept_dt", "report_nm", "pblntf_ty", "pblntf_detail_ty")}
                                      for row in disclosures.get("list", [])
                                      if "합병" in str(row.get("report_nm")) or "상장폐지" in str(row.get("report_nm")))
                      if page >= int(disclosures.get("total_page") or 1):
                          break
                      page += 1
                  print(json.dumps({"corp_code": corp_code, "disclosures": selected}, ensure_ascii=False))
                  if corp_code == "00311030" and selected:
                      receipt_no = selected[-1]["rcept_no"]
                      document_query = urllib.parse.urlencode({
                          "crtfc_key": os.environ["OPENDART_API_KEY"],
                          "rcept_no": receipt_no,
                      })
                      with urllib.request.urlopen(
                          "https://opendart.fss.or.kr/api/document.xml?" + document_query,
                          timeout=30,
                      ) as response:
                          archive = zipfile.ZipFile(io.BytesIO(response.read()))
                      snippets = []
                      for name in archive.namelist():
                          content = archive.read(name)
                          try:
                              text = content.decode("utf-8")
                          except UnicodeDecodeError:
                              text = content.decode("cp949", errors="ignore")
                          text = re.sub(r"<[^>]+>", " ", text)
                          text = re.sub(r"\s+", " ", text)
                          for keyword in ("합병방법", "존속회사", "소멸회사", "합병기일"):
                              position = text.find(keyword)
                              if position >= 0:
                                  snippets.append(text[position:position + 500])
                      print(json.dumps({"corp_code": corp_code, "receipt_no": receipt_no, "snippets": snippets[:8]}, ensure_ascii=False))
          PY
      - name: Verify production parsers
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          PYTHONPATH: backend
        run: |
          python -m pip install -r backend/requirements.txt
          python - <<'PY'
          import json
          from datetime import date
          from earnings_v2.providers import OpenDartClient
          client = OpenDartClient.from_env()
          for corp_code, start, end in (
              ("00311030", date(2015, 1, 1), date(2017, 12, 31)),
              ("00838421", date(2017, 1, 1), date(2019, 12, 31)),
          ):
              events = client.absorbed_merger_filings(start, end, corp_code=corp_code)
              print(json.dumps({"corp_code": corp_code, "events": [event.db_row() for event in events]}, ensure_ascii=False, default=str))
          PY
