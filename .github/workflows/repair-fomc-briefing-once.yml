name: Repair FOMC briefing once

on:
  push:
    paths:
      - ".github/workflows/repair-fomc-briefing-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch existing FOMC collector
        run: gh workflow run central-bank-policy.yml -f mode=latest
