name: One-off bump Historical Insight JS v35
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-bump-history-js-v35.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Bump cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('historical-insight.html')
          s=p.read_text().replace('historical-insight.js?v=34','historical-insight.js?v=35')
          p.write_text(s)
          PY
      - name: Commit result
        run: |
          git config user.name "hoorash4"
          git config user.email "hoorash4@gmail.com"
          rm .github/workflows/oneoff-bump-history-js-v35.yml
          git add historical-insight.html .github/workflows/oneoff-bump-history-js-v35.yml
          git commit -m "Bump Historical Insight JS to v35"
          git push
