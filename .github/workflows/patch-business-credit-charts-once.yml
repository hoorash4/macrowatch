name: Patch business-credit chart catalog once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-business-credit-charts-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Add monthly business-credit chart entries
        run: |
          python - <<'PY'
          from pathlib import Path

          chart = Path('assets/js/charts/economic-charts.js')
          text = chart.read_text()
          anchor = " {code:'KR_EXPORT_DAILY_AVG',title:'한국 일평균 수출',frequency:'T',unit:'억달러/조업일',category:'고빈도 경기',decimals:2,pending:'관세청 1~10일·1~20일·월말 누계와 조업일수로 독립 구간 일평균을 적재합니다.'}"
          additions = """ {code:'KR_EXPORT_DAILY_AVG',title:'한국 일평균 수출',frequency:'T',unit:'억달러/조업일',category:'고빈도 경기',decimals:2,pending:'관세청 1~10일·1~20일·월말 누계와 조업일수로 독립 구간 일평균을 적재합니다.'},
           {code:'US_SBDI_31_90',title:'미국 단기 연체율',frequency:'M',unit:'%',category:'기업신용',decimals:2},
           {code:'US_SBDI_91_180',title:'미국 장기 연체율',frequency:'M',unit:'%',category:'기업신용',decimals:2},
           {code:'US_SBDFI',title:'미국 채무불이행률',frequency:'M',unit:'%',category:'기업신용',decimals:2},
           {code:'US_COMMERCIAL_CH11',title:'미국 기업 회생 신청건수',frequency:'M',unit:'건',category:'기업신용',decimals:0},
           {code:'KR_CORP_DELINQ',title:'한국 기업대출 연체율',frequency:'M',unit:'%',category:'기업신용',decimals:2},
           {code:'KR_DEFAULT_COMPANIES',title:'한국 부도업체수',frequency:'M',unit:'개',category:'기업신용',decimals:0},
           {code:'KR_CORP_REHAB',title:'한국 법인회생 신청건수',frequency:'M',unit:'건',category:'기업신용',decimals:0}"""
          if "US_SBDI_31_90" not in text:
              if anchor not in text:
                  raise SystemExit('economic chart anchor not found')
              text = text.replace(anchor, additions, 1)
              chart.write_text(text)

          manager = Path('assets/js/charts/economic-series-manager.js')
          text = manager.read_text()
          anchor = "  {code:'KR_EXPORT_DAILY_AVG',title:'한국 일평균 수출',frequency:'10일 구간',category:'고빈도 경기'}"
          additions = """  {code:'KR_EXPORT_DAILY_AVG',title:'한국 일평균 수출',frequency:'10일 구간',category:'고빈도 경기'},
            {code:'US_SBDI_31_90',title:'미국 단기 연체율',frequency:'월별',category:'기업신용'},
            {code:'US_SBDI_91_180',title:'미국 장기 연체율',frequency:'월별',category:'기업신용'},
            {code:'US_SBDFI',title:'미국 채무불이행률',frequency:'월별',category:'기업신용'},
            {code:'US_COMMERCIAL_CH11',title:'미국 기업 회생 신청건수',frequency:'월별',category:'기업신용'},
            {code:'KR_CORP_DELINQ',title:'한국 기업대출 연체율',frequency:'월별',category:'기업신용'},
            {code:'KR_DEFAULT_COMPANIES',title:'한국 부도업체수',frequency:'월별',category:'기업신용'},
            {code:'KR_CORP_REHAB',title:'한국 법인회생 신청건수',frequency:'월별',category:'기업신용'}"""
          if "US_SBDI_31_90" not in text:
              if anchor not in text:
                  raise SystemExit('series manager anchor not found')
              text = text.replace(anchor, additions, 1)
              manager.write_text(text)

          html = Path('economic-charts.html')
          text = html.read_text()
          text = text.replace('assets/js/charts/economic-charts.js?v=11', 'assets/js/charts/economic-charts.js?v=12')
          text = text.replace('assets/js/charts/economic-series-manager.js?v=1', 'assets/js/charts/economic-series-manager.js?v=2')
          html.write_text(text)
          PY
      - name: Commit chart catalog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/charts/economic-charts.js assets/js/charts/economic-series-manager.js economic-charts.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add monthly business-credit economic charts"
          git push origin HEAD:main
