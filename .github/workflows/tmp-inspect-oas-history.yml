name: Inspect OAS Historical source temp
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-inspect-oas-history.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Inspect FRED rows
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import date
          from signals.economic_chart_pipeline import _fred_rows
          for code,sid in [("HY_OAS","BAMLH0A0HYM2"),("EM_OAS","BAMLEMCBPIOAS")]:
              rows=_fred_rows(code,sid,"D",date(2018,3,23),date(2024,12,28))
              print(code,"N",len(rows))
              print(code,"FIRST",rows[:3])
              print(code,"LAST",rows[-3:])
              dates=[r["observation_date"] for r in rows]
              print(code,"MINMAX",min(dates) if dates else None,max(dates) if dates else None)
              vis=[r for r in rows if "2019-10-16" <= r["observation_date"] <= "2023-06-05"]
              print(code,"VISIBLE",len(vis),vis[:2],vis[-2:])
          PY
