name: Render US2Y Stage2 temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-render-us2y-stage2.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check matplotlib
      - name: Render
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p tmp-us2y-stage2
          PYTHONPATH=backend python - <<'PY'
          import matplotlib.pyplot as plt
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US2Y")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals)
          pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)

          fig,ax=plt.subplots(figsize=(14,7))
          ax.plot([p.day for p in raw],[p.value for p in raw],linewidth=1.0,label="raw")
          highs=list(s2.high_pivots); lows=list(s2.low_pivots)
          if highs: ax.scatter([p.day for p in highs],[p.value for p in highs],s=42,marker="^",label="Stage 2 high RDP")
          if lows: ax.scatter([p.day for p in lows],[p.value for p in lows],s=42,marker="v",label="Stage 2 low RDP")
          for p in sorted([*highs,*lows],key=lambda x:(x.day,x.pivot_type)):
              ax.annotate(p.day.strftime("%Y-%m-%d"),(p.day,p.value),xytext=(0,8),textcoords="offset points",fontsize=7,ha="center")
          for c in s2.rapid_move_candidates:
              ax.plot([c.start.day,c.end.day],[c.start.value,c.end.value],linewidth=2.6,label="rapid candidate")
          ax.set_title("US 2Y Treasury Yield · Stage 2 · RDP preserved")
          ax.set_xlim(start,end);ax.set_ylim(g.y_min,g.y_max);ax.grid(True,alpha=.2)
          handles,labels=ax.get_legend_handles_labels()
          unique=dict(zip(labels,handles))
          ax.legend(unique.values(),unique.keys(),loc="best")
          fig.tight_layout();fig.savefig("tmp-us2y-stage2/US2Y_STAGE2.png",dpi=160)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: us2y-stage2
          path: tmp-us2y-stage2/US2Y_STAGE2.png
          if-no-files-found: error
