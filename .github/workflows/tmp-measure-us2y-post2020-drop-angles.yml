name: Measure US2Y post-2020 drop angles temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-measure-us2y-post2020-drop-angles.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Measure
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows, screen_segment_angle_degrees
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US2Y")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals); pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)
          s3=simplify_pivot_lines(s2,g)
          s4=finalize_rapid_moves(s3,g)
          s5=prune_same_trend_extremes(s4,g)
          s6=prune_unconfirmed_retracements(s5,g)

          print("S2_RAPID_DROPS")
          for c in s2.rapid_move_candidates:
              if c.direction < 0 and c.start.day.year >= 2020:
                  xang=screen_segment_angle_degrees(c.start,c.end,g)
                  print(c.start.day.isoformat(),c.start.value,"->",c.end.day.isoformat(),c.end.value,
                        "Y_AXIS_ANGLE",90-abs(xang),"Y_SHARE",c.visual_y_share)

          print("S6_DOWN_SEGMENTS")
          for seg in s6.segments:
              if seg.start.day.year >= 2020 and seg.end.value < seg.start.value:
                  xang=screen_segment_angle_degrees(seg.start,seg.end,g)
                  print(seg.start.day.isoformat(),seg.start.value,"->",seg.end.day.isoformat(),seg.end.value,
                        "Y_AXIS_ANGLE",90-abs(xang))
          PY
