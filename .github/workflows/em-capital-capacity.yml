name: Refresh EM capital capacity

on:
  schedule:
    # 14:30 KST: refresh after U.S. daily data releases.
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      initialize_sources:
        description: Explicitly initialize the historical calculation cache
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macrowatch-em-capital-capacity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: pip install --disable-pip-version-check requests
      - name: Collect and calculate EM capital capacity
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          [[ "${{ inputs.initialize_sources || 'false' }}" == "true" ]] && args+=(--initialize-sources)
          PYTHONPATH=backend python -m signals.em_capital_capacity_pipeline "${args[@]}"
