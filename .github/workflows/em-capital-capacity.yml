name: Refresh EM capital capacity

on:
  workflow_run:
    workflows: ["Deploy Supabase changes"]
    types: [completed]
  schedule:
    # 08:30 KST: ë¯¸êµ­ ì¼ê° ìë£ ê°±ì  ì´í, 07:30 ì ì±ê¸ë¦¬ ê¸°ë ììê³¼ ë¶ë¦¬í©ëë¤.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macrowatch-em-capital-capacity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: pip install --disable-pip-version-check requests
      - name: Collect and calculate EM capital capacity
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python -m signals.em_capital_capacity_pipeline --years 3
