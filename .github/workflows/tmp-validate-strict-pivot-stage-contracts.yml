name: Validate strict pivot stage contracts temp

on:
  push:
    branches:
      - refactor/strict-pivot-stage-contracts
    paths:
      - ".github/workflows/tmp-validate-strict-pivot-stage-contracts.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check pytest
      - name: Compile pivot modules
        run: python -m compileall -q backend/historical_pivot_*.py
      - name: Run focused contract tests
        run: |
          PYTHONPATH=backend pytest -q             tests/test_historical_pivot_six_stage_architecture.py             tests/test_historical_pivot_store.py
      - name: Validate 24 production indicators and compare stored output
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import date
          from common import SupabaseRest
          from historical_pivot_base import _single_row, _get_rows_paginated
          from historical_pivot_shared import ChartGeometry, buffer_bounds, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements
          from historical_pivot_store import build_storage_rows

          CASE="tightening_2022"
          INDEX="NASDAQ_COMPOSITE"
          SERIES=[
              "US2Y","US10Y","US10Y_REAL","US10Y2Y",
              "HY_OAS","NFCI_CREDIT","NFCI_RISK","EM_OAS",
              "WTI","RRP","TGA","REDBOOK","WEI","EMRATIO",
              "US_RETAIL_SALES","US_CPI","US_CORE_CPI","US_PPI",
              "US_CORE_PPI","US_PCE","US_CORE_PCE","US_SBDI_31_180",
              "US_SBDFI","US_COMMERCIAL_CH11",
          ]

          db=SupabaseRest()
          cycle=_single_row(db,"historical_case_market_cycles",{
              "select":"start_date,trough_date",
              "case_code":f"eq.{CASE}",
              "index_code":f"eq.{INDEX}",
              "limit":"2",
          })
          bs,be=buffer_bounds(
              date.fromisoformat(str(cycle["start_date"])[:10]),
              date.fromisoformat(str(cycle["trough_date"])[:10]),
          )

          diffs=[]
          for code in SERIES:
              rows=_get_rows_paginated(db,"economic_chart_series_points",{
                  "select":"observation_date,value,frequency",
                  "series_code":f"eq.{code}",
                  "observation_date":f"gte.{bs.isoformat()}",
                  "and":f"(observation_date.lte.{be.isoformat()})",
                  "order":"observation_date.asc",
              })
              freq=next(iter({str(r.get("frequency") or "") for r in rows}))
              raw=normalize_rows(rows)
              vals=[p.value for p in raw]
              lo,hi=min(vals),max(vals)
              pad=(hi-lo)*.08 if hi!=lo else 1.0
              g=ChartGeometry(bs,be,lo-pad,hi+pad,1200,600)

              s1=calculate_base_pivots(rows,freq)
              s2=classify_special_structures(s1,g)
              s3=simplify_pivot_lines(s2,g)
              s4=finalize_rapid_moves(s3,g)
              s5=prune_same_trend_extremes(s4,g)
              s6=prune_unconfirmed_retracements(s5,g)

              out=build_storage_rows(
                  base=s1,stage1=s1,stage2=s2,stage3=s3,stage4=s4,stage5=s5,final=s6
              )
              actual=[
                  (r["pivot_date"],round(float(r["pivot_value"]),12),r["pivot_type"],
                   r["next_pivot_order"],r["segment_to_next"])
                  for r in out
              ]

              stored=_get_rows_paginated(db,"historical_indicator_pivots",{
                  "select":"pivot_order,pivot_date,pivot_value,pivot_type,next_pivot_order,segment_to_next",
                  "case_code":f"eq.{CASE}",
                  "index_code":f"eq.{INDEX}",
                  "series_code":f"eq.{code}",
                  "order":"pivot_order.asc",
              })
              expected=[
                  (str(r["pivot_date"])[:10],round(float(r["pivot_value"]),12),r["pivot_type"],
                   r.get("next_pivot_order"),r.get("segment_to_next"))
                  for r in stored
              ]
              if actual != expected:
                  diffs.append((code,expected,actual))
              detached={
                  (p.day,p.value,p.pivot_type)
                  for p in s6.markers
                  if all(
                      (p.day,p.value,p.pivot_type) not in {
                          (seg.start.day,seg.start.value,seg.start.pivot_type),
                          (seg.end.day,seg.end.value,seg.end.pivot_type),
                      }
                      for seg in s6.segments
                  )
              }
              marker_only={(p.day,p.value,p.pivot_type) for p in s6.marker_only_points}
              assert detached == marker_only, (code,detached,marker_only)
              print("OK",code,"S3",len(s3.markers),"S4",len(s4.markers),"S6",len(s6.markers),
                    "rapid_in_s3",len(s3.rapid_move_candidates),"marker_only",len(s6.marker_only_points))

          print("DIFF_COUNT",len(diffs))
          for code,expected,actual in diffs:
              print("DIFF",code)
              print("EXPECTED",expected)
              print("ACTUAL",actual)
          assert not diffs, f"final output changed for {len(diffs)} indicators"
          PY
