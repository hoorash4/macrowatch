name: Repair collection gaps once

on:
  push:
    paths:
      - ".github/workflows/repair-collection-gaps-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-repairs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch current market context collector
        run: |
          set -euo pipefail
          gh workflow run market-context.yml -f mode=automatic
          echo "Dispatched existing market-context workflow only; no schedule added."
