name: Repair collection gaps once

on:
  push:
    paths:
      - ".github/workflows/repair-collection-gaps-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Dispatch existing collection health check
        run: |
          set -euo pipefail
          gh workflow run collection-health.yml
          echo "Dispatched existing collection-health workflow only; no schedule added."
