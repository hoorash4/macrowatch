name: Fix research navigation underline

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-research-nav-underline-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Limit underline to menu label
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/css/styles.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* Fix research tool underline so it does not cross the group divider. */'
          rule = '''\n\n/* Fix research tool underline so it does not cross the group divider. */\n.dashboard-nav-tool-group-start::after { left: 1rem; }\n@media (max-width:1180px) { .dashboard-nav-tool-group-start::after { left: .8rem; } }\n'''
          if marker not in css:
              path.write_text(css + rule, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "MacroWatch Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/css/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Fix research navigation underline span"
          git push origin main
