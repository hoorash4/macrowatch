name: Backfill direct historical Equifax archives once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/legacy-equifax-backfill-once.yml"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Collect only explicitly reported historical Equifax levels
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import date
          from io import BytesIO
          import re
          from urllib.parse import urljoin
          import requests
          from pypdf import PdfReader
          from common import SupabaseRest
          from signals.economic_chart_pipeline import _insert_missing
          from sources.business_credit_monthly import _extract_equifax_levels

          UA={"User-Agent":"Mozilla/5.0 (compatible; MacroWatch/1.0)"}
          MONTHS={m:i for i,m in enumerate("January February March April May June July August September October November December".split(),1)}
          MP="(?:"+"|".join(MONTHS)+")"
          DETAIL_RE=re.compile(r'href=["\']([^"\']*/industry-data/\d+/[^"\']+)["\']',re.I)
          PDF_RE=re.compile(r'href=["\']([^"\']+\.pdf(?:\?[^"\']*)?)["\']',re.I)
          TITLE_RE=re.compile(rf'(?:SBLI|Lending Index|Economic Update|Strategic Insights)[^<\n]*?[-–]\s*({MP})\s+(20\d{{2}})',re.I)

          def get(url):
              r=requests.get(url,headers=UA,timeout=20)
              r.raise_for_status(); return r

          roots=[
              "https://www.equipmentfa.com/industry-data/source/729/paynet-inc",
              "https://www.equipmentfa.com/industry-data/category/145/Small%2BBusiness%2BLending%2BReports",
              "https://www.equipmentfa.com/industry-data/tags/6/2068/thomson-reuterspaynet-small-business-delinquency-index-sbdi",
          ]
          details=set()
          for root in roots:
              try: html=get(root).text
              except Exception: continue
              details |= {urljoin(root,x) for x in DETAIL_RE.findall(html)}

          def current_levels(text):
              levels=_extract_equifax_levels(text)
              if levels: return levels
              clean=re.sub(r'\s+',' ',text.replace('–','-').replace('—','-'))
              def one(label, extras=''):
                  m=re.search(rf'{label}.{{0,220}}?(?:fell|declined|decreased|edged|rose|increased|climbed|held\s+steady|remained|was|is|stands?|stood)?[^.;:]{{0,100}}?(?:to|at|is|was|of)?\s*([0-9]+(?:\.[0-9]+)?)%',clean,re.I)
                  if m: return float(m.group(1))
                  m=re.search(rf'{label}.{{0,120}}?([0-9]+(?:\.[0-9]+)?)%\s*\(Level\)',clean,re.I)
                  return float(m.group(1)) if m else None
              a=one(r'SBDI(?:\)|:)?\s*31\s*-\s*90(?:\s*Days(?:\s*Past\s*Due)?)?')
              b=one(r'SBDI(?:\)|:)?\s*91\s*-\s*180(?:\s*Days(?:\s*Past\s*Due)?)?')
              c=one(r'(?:Small\s+Business\s+Default\s+Index\s*\(SBDFI\)|SBDFI\b|Defaults?\b)')
              return (a,b,c)

          found={c:{} for c in ('US_SBDI_31_90','US_SBDI_91_180','US_SBDFI')}
          parsed=0
          for detail in sorted(details):
              try: html=get(detail).text
              except Exception: continue
              title=TITLE_RE.search(re.sub(r'\s+',' ',html))
              if not title:
                  # URL slug itself often ends in the report observation month/year.
                  slug=re.search(rf'-({MP})-(20\d{{2}})(?:$|[?/#])',detail,re.I)
                  if not slug: continue
                  month_name,year_s=slug.group(1),slug.group(2)
              else:
                  month_name,year_s=title.group(1),title.group(2)
              y=int(year_s); m=MONTHS[month_name.capitalize()]
              if not (date(2016,9,1)<=date(y,m,1)<=date.today()): continue
              pdfs={urljoin(detail,x) for x in PDF_RE.findall(html)}
              for pdf in sorted(pdfs):
                  if not any(k in pdf.lower() for k in ('economic-update','strategic','monthly','credit','small-business-report')): continue
                  try:
                      r=get(pdf)
                      text='\n'.join(p.extract_text() or '' for p in PdfReader(BytesIO(r.content)).pages)
                  except Exception: continue
                  vals=current_levels(text)
                  if not any(v is not None for v in vals): continue
                  for code,v in zip(found,vals):
                      if v is not None and 0 < v < 10:
                          found[code].setdefault((y,m),(v,pdf))
                  parsed+=1
                  break

          db=SupabaseRest()
          for code,vals in found.items():
              rows=[{'series_code':code,'observation_date':f'{y:04d}-{m:02d}-01','value':v,'frequency':'M','source':f'PayNet-archive:{u}'} for (y,m),(v,u) in sorted(vals.items())]
              inserted=_insert_missing(db,rows,date(2016,9,1))
              print(code,'fetched',len(rows),'inserted',inserted,'first',rows[0]['observation_date'] if rows else None,'last',rows[-1]['observation_date'] if rows else None)
              print('months',','.join(r['observation_date'][:7] for r in rows))
          print('detail_pages',len(details),'parsed_reports',parsed)
          PY
