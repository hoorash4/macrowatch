name: Test protection judgment fix temp

on:
  push:
    branches:
      - fix/protection-does-not-stop-judgment
    paths:
      - ".github/workflows/tmp-test-protection-judgment.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check matplotlib pytest
      - name: Compile
        run: python -m compileall -q backend
      - name: Render WTI stages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p tmp-protection-fix
          PYTHONPATH=backend python - <<'PY'
          import matplotlib.pyplot as plt
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(
              db,
              case_code="tightening_2022",
              index_code="NASDAQ_COMPOSITE",
              series_code="WTI",
          )
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals)
          pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)
          s3=simplify_pivot_lines(s2,g)
          s4=finalize_rapid_moves(s3,g)
          s5=prune_same_trend_extremes(s4,g)
          s6=prune_unconfirmed_retracements(s5,g)

          def dump(name,r):
              print(name,[(p.day.isoformat(),round(p.value,3),p.pivot_type) for p in r.markers])
              print(name+"_SEG",[(a.start.day.isoformat(),a.end.day.isoformat(),a.kind) for a in r.segments])
          dump("S3",s3); dump("S4",s4); dump("S5",s5); dump("S6",s6)

          target={p.day.isoformat() for p in s6.markers}
          assert "2018-10-03" not in target, target
          assert "2018-12-24" not in target, target
          assert "2018-04-06" in target, target
          assert "2020-01-06" in target, target
          assert "2020-04-20" in target, target

          fig,ax=plt.subplots(figsize=(14,7))
          ax.plot([p.day for p in raw],[p.value for p in raw],linewidth=1.0,label="raw")
          for seg in s6.segments:
              ax.plot([seg.start.day,seg.end.day],[seg.start.value,seg.end.value],linewidth=2.5)
          highs=[p for p in s6.markers if p.pivot_type=="high"]
          lows=[p for p in s6.markers if p.pivot_type=="low"]
          if highs:
              ax.scatter([p.day for p in highs],[p.value for p in highs],s=42,marker="^",label="Stage 6 high")
          if lows:
              ax.scatter([p.day for p in lows],[p.value for p in lows],s=42,marker="v",label="Stage 6 low")
          for p in s6.markers:
              ax.annotate(p.day.strftime("%Y-%m-%d"),(p.day,p.value),xytext=(0,8),textcoords="offset points",fontsize=7,ha="center")
          ax.set_title("WTI · Stage 6 · protection judges through")
          ax.set_xlim(start,end); ax.set_ylim(g.y_min,g.y_max); ax.grid(True,alpha=.2); ax.legend(loc="best")
          fig.tight_layout()
          fig.savefig("tmp-protection-fix/WTI_STAGE6_PROTECTION_FIX.png",dpi=160)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wti-stage6-protection-fix
          path: tmp-protection-fix/WTI_STAGE6_PROTECTION_FIX.png
          if-no-files-found: error
