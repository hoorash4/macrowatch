name: Patch economic account actions fix once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-economic-actions-fix-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix economic account actions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/charts/economic-charts.js')
          s=p.read_text()
          s=s.replace("const supabaseClient=window.supabase?.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);","const supabaseClient=window.supabase?.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey);\nwindow.macroWatchEconomicSupabase = supabaseClient;",1)
          p.write_text(s)

          p=Path('assets/js/charts/economic-page-actions.js')
          p.write_text("""(() => {\n  'use strict';\n  const client = window.macroWatchEconomicSupabase;\n  const functionClient = client && window.MacroWatchFrontend?.createFunctionClient?.(client);\n  const profileButton = document.getElementById('economic-profile-button');\n  const adminLink = document.getElementById('economic-admin-link');\n  const logoutButton = document.getElementById('economic-logout-button');\n  const modal = document.getElementById('economic-profile-modal');\n  const closeButton = document.getElementById('economic-profile-close');\n  const username = document.getElementById('economic-profile-username');\n  const email = document.getElementById('economic-profile-email');\n  const emailSave = document.getElementById('economic-profile-email-save');\n  const emailRemove = document.getElementById('economic-profile-email-remove');\n\n  async function invokeNotification(action, payload = {}) {\n    if (!functionClient) throw new Error('설정 기능을 불러오지 못했습니다.');\n    return functionClient.invoke('notification-settings', { action, ...payload }, { errorMessage: status => `이메일 설정 요청에 실패했습니다. (${status})` });\n  }\n\n  async function loadProfile() {\n    if (!client) return;\n    const { data: userData } = await client.auth.getUser();\n    const user = userData.user;\n    if (!user) { window.location.replace('index.html'); return; }\n    const { data: account } = await client.from('user_accounts').select('username,is_admin').eq('user_id', user.id).maybeSingle();\n    username.textContent = account?.username || '아이디 미등록';\n    adminLink.hidden = account?.is_admin !== true;\n    try {\n      const settings = await invokeNotification('status');\n      email.value = settings?.address || '';\n      emailRemove.hidden = !settings?.is_active;\n    } catch {\n      email.value = '';\n      emailRemove.hidden = true;\n    }\n  }\n\n  profileButton?.addEventListener('click', async () => {\n    modal.hidden = false;\n    await loadProfile();\n    closeButton?.focus();\n  });\n  closeButton?.addEventListener('click', () => { modal.hidden = true; profileButton?.focus(); });\n  modal?.addEventListener('click', e => { if (e.target === modal || e.target?.hasAttribute?.('data-economic-profile-close')) modal.hidden = true; });\n  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal && !modal.hidden) modal.hidden = true; });\n\n  emailSave?.addEventListener('click', async () => {\n    emailSave.disabled = true;\n    try { await invokeNotification('save', { address: email.value.trim() }); await loadProfile(); }\n    catch (error) { window.alert(error.message || '이메일 알림을 저장하지 못했습니다.'); }\n    finally { emailSave.disabled = false; }\n  });\n  emailRemove?.addEventListener('click', async () => {\n    emailRemove.disabled = true;\n    try { await invokeNotification('remove'); await loadProfile(); }\n    catch (error) { window.alert(error.message || '이메일 알림을 해제하지 못했습니다.'); }\n    finally { emailRemove.disabled = false; }\n  });\n\n  logoutButton?.addEventListener('click', async () => {\n    logoutButton.disabled = true;\n    try { await client?.auth.signOut(); } finally { window.location.replace('index.html'); }\n  });\n\n  async function updateAdminAccess() {\n    if (!client || !adminLink) return;\n    adminLink.hidden = true;\n    const { data: userData } = await client.auth.getUser();\n    const userId = userData.user?.id;\n    if (!userId) return;\n    const { data, error } = await client.from('user_accounts').select('is_admin').eq('user_id', userId).maybeSingle();\n    if (!error && data?.is_admin === true) adminLink.hidden = false;\n  }\n  updateAdminAccess().catch(error => console.warn('economic chart admin access check failed', error));\n})();\n""")

          p=Path('economic-charts.html')
          s=p.read_text()
          marker='  <div id="economic-alert-modal" class="economic-modal" hidden>'
          modal='''  <div id="economic-profile-modal" class="economic-modal" hidden>\n    <div class="economic-modal-backdrop" data-economic-profile-close></div>\n    <section class="economic-modal-card economic-profile-card" role="dialog" aria-modal="true" aria-labelledby="economic-profile-title">\n      <div class="economic-modal-head"><div><strong id="economic-profile-title">개인 설정</strong><small>계정과 이메일 알림 설정을 관리합니다.</small></div><button id="economic-profile-close" type="button" aria-label="닫기">×</button></div>\n      <div class="economic-profile-row"><span>현재 아이디</span><strong id="economic-profile-username">확인 중</strong></div>\n      <label>이메일 알림 주소<input id="economic-profile-email" type="email" autocomplete="email" placeholder="name@example.com"></label>\n      <div class="economic-profile-actions"><button id="economic-profile-email-remove" type="button" hidden>이메일 알림 해제</button><span></span><button id="economic-profile-email-save" type="button" class="primary">저장</button></div>\n      <p class="economic-modal-help">비밀번호 변경·카카오 연결·회원 탈퇴 등 전체 계정 설정은 메인 화면의 개인 설정과 동일한 계정에 적용됩니다.</p>\n    </section>\n  </div>\n\n'''
          assert marker in s
          s=s.replace(marker,modal+marker,1)
          s=s.replace('assets/js/charts/economic-page-actions.js?v=1','assets/js/charts/economic-page-actions.js?v=2')
          p.write_text(s)

          p=Path('assets/css/economic-charts.css')
          s=p.read_text()
          s += '.economic-profile-card{width:min(440px,calc(100vw - 28px))}.economic-profile-row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #e5e7eb;font-size:11px;color:#6b7280}.economic-profile-row strong{color:#111827}.economic-profile-actions{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;margin-top:12px}.economic-profile-actions button{border:1px solid #d1d5db;background:#fff;border-radius:7px;padding:7px 10px;font-size:10px;font-weight:750;color:#4b5563;cursor:pointer}.economic-profile-actions .primary{background:#111827;color:#fff;border-color:#111827}'
          p.write_text(s)
          PY
          rm .github/workflows/patch-economic-actions-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/charts/economic-charts.js assets/js/charts/economic-page-actions.js economic-charts.html assets/css/economic-charts.css .github/workflows/patch-economic-actions-fix-once.yml
          git diff --cached --check
          git commit -m 'Fix economic chart account actions'
          git push origin HEAD:main
