name: Temporary economic menu migration
on:
  push:
    branches:
      - fix/embed-economic-menu-20260913
    paths:
      - .github/scripts/embed_economic_menu.py
      - .github/workflows/tmp-embed-economic-menu.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/embed-economic-menu-20260913
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply migration
        run: python .github/scripts/embed_economic_menu.py
      - name: Remove temporary migration files
        run: rm -f .github/scripts/embed_economic_menu.py .github/workflows/tmp-embed-economic-menu.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Embed economic charts as a dashboard menu"
          git push origin HEAD:fix/embed-economic-menu-20260913
