name: Deploy Pages

on:
  push:
    branches: [main]
    # Frontend deployment is intentionally isolated from backend, collector,
    # database and Supabase Function changes.
    paths:
      - "*.html"
      - "*.js"
      - "assets/**"
      - "images/**"
      - "tools/build/**"
      - ".github/workflows/pages-build.yml"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/pages-build.yml
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
