name: Verify Stage2 sideways temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-verify-stage2-sideways.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Run focused tests
        run: |
          PYTHONPATH=backend python -m unittest tests.test_historical_pivot_stage2
          PYTHONPATH=backend python -m unittest tests.test_historical_pivot_stage_boundaries
