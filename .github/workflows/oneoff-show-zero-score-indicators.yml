name: One-off show zero-score Historical Insight indicators
on:
  push:
    paths:
      - '.github/workflows/oneoff-show-zero-score-indicators.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch zero-score visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/historical-insight/historical-insight.js')
          s=p.read_text()
          old="context.analyses.filter(item=>item.visible&&Number.isFinite(item.overallScore)&&item.overallScore>0)"
          new="context.analyses.filter(item=>item.visible&&item.overallScore!==null&&Number.isFinite(item.overallScore))"
          if old not in s:
              raise SystemExit('target filter not found')
          p.write_text(s.replace(old,new,1))
          h=Path('historical-insight.html')
          t=h.read_text()
          oldv='assets/js/historical-insight/historical-insight.js?v=36'
          newv='assets/js/historical-insight/historical-insight.js?v=37'
          if oldv not in t:
              raise SystemExit('html cache target not found')
          h.write_text(t.replace(oldv,newv,1))
          PY
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/historical-insight/historical-insight.js historical-insight.html
          git commit -m 'Show zero-score Historical Insight indicators'
          git rm .github/workflows/oneoff-show-zero-score-indicators.yml
          git commit -m 'Remove one-off zero-score indicator workflow'
          git push
