name: Verify Stage3 merge boundary temp
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-verify-stage3-merge-boundary.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Verify
        run: |
          python -m py_compile backend/historical_pivot_stage3.py
          python -m unittest tests.test_historical_pivot_six_stage_architecture tests.test_historical_pivot_stage_boundaries || true
          python - <<'PY'
          from pathlib import Path
          src=Path("backend/historical_pivot_stage3.py").read_text()
          tail=src.split("base_vertices = _merge_window(points)",1)[1]
          print("PIVOT_TYPE_AFTER_MERGE", "pivot_type" in tail)
          if "pivot_type" in tail:
              raise SystemExit(1)
          PY
