name: Diagnose KIS KB Financial income fields

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check requests
      - name: Compare annual and quarterly responses
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        shell: python
        run: |
          import json
          import os
          import requests

          base = "https://openapi.koreainvestment.com:9443"
          key = os.environ["KIS_APP_KEY"]
          secret = os.environ["KIS_APP_SECRET"]
          token_response = requests.post(
              f"{base}/oauth2/tokenP",
              json={"grant_type": "client_credentials", "appkey": key, "appsecret": secret},
              timeout=(5, 15),
          )
          token_response.raise_for_status()
          token = token_response.json()["access_token"]
          headers = {
              "authorization": f"Bearer {token}",
              "appkey": key,
              "appsecret": secret,
              "tr_id": "FHKST66430200",
              "custtype": "P",
          }
          for division, label in (("0", "annual"), ("1", "quarterly")):
              response = requests.get(
                  f"{base}/uapi/domestic-stock/v1/finance/income-statement",
                  params={
                      "FID_DIV_CLS_CODE": division,
                      "fid_cond_mrkt_div_code": "J",
                      "fid_input_iscd": "105560",
                  },
                  headers=headers,
                  timeout=(5, 15),
              )
              payload = response.json()
              rows = payload.get("output") if isinstance(payload, dict) else None
              safe_rows = [
                  {key: value for key, value in row.items() if value not in (None, "")}
                  for row in rows or [] if isinstance(row, dict)
              ]
              print(json.dumps({
                  "mode": label,
                  "http_status": response.status_code,
                  "rt_cd": payload.get("rt_cd") if isinstance(payload, dict) else None,
                  "msg_cd": payload.get("msg_cd") if isinstance(payload, dict) else None,
                  "msg1": payload.get("msg1") if isinstance(payload, dict) else None,
                  "rows": safe_rows,
              }, ensure_ascii=False))
