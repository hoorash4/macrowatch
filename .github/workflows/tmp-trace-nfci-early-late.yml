name: Temporary trace NFCI early and late
on:
  push:
    paths:
      - "tools/tmp_trace_nfci_early_late.py"
      - ".github/workflows/tmp-trace-nfci-early-late.yml"
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Trace
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python tools/tmp_trace_nfci_early_late.py
