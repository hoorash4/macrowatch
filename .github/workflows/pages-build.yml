name: Build Pages artifact

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Generate compatibility assets in container build output
        run: |
          # The Jekyll Docker action creates the output directory as root.
          sudo chown "$(id -u):$(id -g)" _site
          node tools/build/pages-compat.cjs _site
      - run: node tests/check_pages_build.cjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
