name: Verify US2Y Stage3 collapse temp
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-verify-us2y-stage3-collapse.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check matplotlib
      - name: Test and render
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -m py_compile backend/historical_pivot_stage3.py
          python -m unittest tests.test_historical_pivot_six_stage_architecture tests.test_historical_pivot_stage_boundaries
          mkdir -p out
          PYTHONPATH=backend python - <<'PY'
          import matplotlib.pyplot as plt
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows, line_role_map
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(db,case_code="tightening_2022",index_code="NASDAQ_COMPOSITE",series_code="US2Y")
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals); pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)
          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)
          s3=simplify_pivot_lines(s2,g)

          points={}
          for seg in s3.segments:
              points[(seg.start.day,seg.start.value)]=seg.start
              points[(seg.end.day,seg.end.value)]=seg.end
          ordered=sorted(points.values(),key=lambda p:p.day)
          roles=line_role_map(ordered)
          print("STAGE3",[(p.day.isoformat(),p.value,roles.get((p.day,p.value))) for p in ordered])

          dates={p.day.isoformat() for p in ordered}
          assert "2023-01-26" not in dates, dates
          assert "2023-05-04" in dates, dates

          fig,ax=plt.subplots(figsize=(15,7.5))
          ax.plot([p.day for p in raw],[p.value for p in raw],linewidth=1.0,label="raw")
          for seg in s3.segments:
              ax.plot([seg.start.day,seg.end.day],[seg.start.value,seg.end.value],linewidth=2.8)
          highs=[p for p in ordered if roles.get((p.day,p.value))=="high"]
          lows=[p for p in ordered if roles.get((p.day,p.value))=="low"]
          if highs: ax.scatter([p.day for p in highs],[p.value for p in highs],s=65,marker="^",label="relative high")
          if lows: ax.scatter([p.day for p in lows],[p.value for p in lows],s=65,marker="v",label="relative low")
          for p in ordered:
              ax.annotate(f"{p.day:%Y-%m-%d}",(p.day,p.value),xytext=(0,10),textcoords="offset points",fontsize=7,ha="center")
          ax.set_title("US2Y · Stage 3 · same-direction interiors collapsed")
          ax.set_xlim(start,end); ax.set_ylim(g.y_min,g.y_max)
          ax.grid(True,alpha=.2); ax.legend(loc="best")
          fig.tight_layout()
          fig.savefig("out/US2Y_STAGE3_COLLAPSED.png",dpi=180)
          plt.close(fig)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: us2y-stage3-collapsed
          path: out/US2Y_STAGE3_COLLAPSED.png
          if-no-files-found: error
