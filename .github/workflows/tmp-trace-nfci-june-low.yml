name: Trace NFCI Risk June low temp
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-trace-nfci-june-low.yml"
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Trace
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          from datetime import date
          import math
          from common import SupabaseRest
          from historical_pivot_base import _get_rows_paginated,_single_row
          from historical_pivot_shared import ChartGeometry,normalize_rows,buffer_bounds
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements

          db=SupabaseRest()
          CASE="tightening_2022"; INDEX="NASDAQ_COMPOSITE"; CODE="NFCI_RISK"
          cycle=_single_row(db,"historical_case_market_cycles",{
              "select":"start_date,trough_date","case_code":f"eq.{CASE}","index_code":f"eq.{INDEX}","limit":"2"})
          cs=date.fromisoformat(cycle["start_date"]); ct=date.fromisoformat(cycle["trough_date"])
          bs,be=buffer_bounds(cs,ct)
          market=_get_rows_paginated(db,"market_index_prices",{
              "select":"market_date,close","index_code":f"eq.{INDEX}","market_date":"gte.1990-01-01","order":"market_date.asc"})
          market=[r for r in market if r.get("market_date") and r.get("close") is not None]
          si=next(i for i,r in enumerate(market) if str(r["market_date"])[:10]>=cs.isoformat())
          ei=max(i for i,r in enumerate(market) if str(r["market_date"])[:10]<=ct.isoformat())
          span=max(1,ei-si); context=max(1,span*.12/(1-.24))
          ds=date.fromisoformat(str(market[int(max(0,si-context))]["market_date"])[:10])
          de=date.fromisoformat(str(market[int(math.ceil(min(len(market)-1,ei+context)))]["market_date"])[:10])

          rows=_get_rows_paginated(db,"economic_chart_series_points",{
              "select":"observation_date,value,frequency","series_code":f"eq.{CODE}",
              "observation_date":f"gte.{bs.isoformat()}","and":f"(observation_date.lte.{be.isoformat()})","order":"observation_date.asc"})
          freq=rows[0]["frequency"]
          raw=normalize_rows(rows); vals=[p.value for p in raw]; lo,hi=min(vals),max(vals); pad=(hi-lo)*.05 if hi!=lo else 1
          g=ChartGeometry(ds,de,lo-pad,hi+pad,19.0,8.0)
          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)
          s3=simplify_pivot_lines(s2,g)
          s4=finalize_rapid_moves(s3,g)
          s5=prune_same_trend_extremes(s4,g)
          s6=prune_unconfirmed_retracements(s5,g)

          def pts(obj):
              if hasattr(obj,"markers"): p=obj.markers
              elif hasattr(obj,"display_markers"): p=obj.display_markers
              else: p=()
              return [(x.day.isoformat(),x.value,getattr(x,"pivot_type",None)) for x in p]

          for name,obj in [("S1",s1),("S2",s2),("S3",s3),("S4",s4),("S5",s5),("S6",s6)]:
              print(name,[x for x in pts(obj) if x[0].startswith("2021-06") or x[0].startswith("2022-06") or x[0].startswith("2023-06")])
          print("S1_ALL",pts(s1))
          print("S2_ALL",pts(s2))
          print("S3_ALL",pts(s3))
          print("S4_ALL",pts(s4))
          print("S5_ALL",pts(s5))
          print("S6_ALL",pts(s6))
          print("S2_RAPID",[(c.start.day.isoformat(),c.start.value,c.end.day.isoformat(),c.end.value,c.direction) for c in s2.rapid_move_candidates])
          print("S4_PROTECTED",[(p.day.isoformat(),p.value) for p in s4.protected_points])
          PY
