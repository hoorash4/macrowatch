name: Temporary pivot stage-boundary verification
on:
  push:
    paths:
      - ".github/workflows/tmp-pivot-stage-boundary.yml"
      - "tools/tmp_verify_pivot_stage_boundary.py"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - name: Verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python tools/tmp_verify_pivot_stage_boundary.py
