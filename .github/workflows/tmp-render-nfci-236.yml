name: Render NFCI Risk Stage2 Stage3 Stage6 temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-render-nfci-236.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt
          pip install --disable-pip-version-check matplotlib
      - name: Render NFCI Risk stages 2 3 6
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p tmp-nfci-236
          PYTHONPATH=backend python - <<'PY'
          import matplotlib.pyplot as plt
          from common import SupabaseRest
          from historical_pivot_base import load_case_series
          from historical_pivot_shared import ChartGeometry, normalize_rows
          from historical_pivot_stage1 import calculate_base_pivots
          from historical_pivot_stage2 import classify_special_structures
          from historical_pivot_stage3 import simplify_pivot_lines
          from historical_pivot_stage4 import finalize_rapid_moves
          from historical_pivot_stage5 import prune_same_trend_extremes
          from historical_pivot_stage6 import prune_unconfirmed_retracements

          db=SupabaseRest()
          rows,freq,start,end=load_case_series(
              db,
              case_code="tightening_2022",
              index_code="NASDAQ_COMPOSITE",
              series_code="NFCI_RISK",
          )
          raw=normalize_rows(rows)
          vals=[p.value for p in raw if start<=p.day<=end]
          lo,hi=min(vals),max(vals)
          pad=(hi-lo)*.08 if hi!=lo else 1.0
          g=ChartGeometry(start,end,lo-pad,hi+pad,1200,600)

          s1=calculate_base_pivots(rows,freq)
          s2=classify_special_structures(s1,g)
          s3=simplify_pivot_lines(s2,g)
          s4=finalize_rapid_moves(s3,g)
          s5=prune_same_trend_extremes(s4,g)
          s6=prune_unconfirmed_retracements(s5,g)

          print("SIDEWAYS_H",[(s.start.day.isoformat(),s.end.day.isoformat(),round(s.angle_deg,3),s.prior_trend,s.protected) for s in s2.high_sideways_segments])
          print("SIDEWAYS_L",[(s.start.day.isoformat(),s.end.day.isoformat(),round(s.angle_deg,3),s.prior_trend,s.protected) for s in s2.low_sideways_segments])
          print("S3",[(p.day.isoformat(),round(p.value,6),p.pivot_type) for p in s3.markers])
          print("S6",[(p.day.isoformat(),round(p.value,6),p.pivot_type) for p in s6.markers])

          def base(ax,title):
              ax.plot([p.day for p in raw],[p.value for p in raw],linewidth=1.0,label="raw")
              ax.set_title(title)
              ax.set_xlim(start,end)
              ax.set_ylim(g.y_min,g.y_max)
              ax.grid(True,alpha=.2)

          fig,ax=plt.subplots(figsize=(14,7))
          base(ax,"NFCI Risk · Stage 2 · current")
          ax.plot([p.day for p in s2.high_pivots],[p.value for p in s2.high_pivots],linewidth=1.8,label="upper RDP")
          ax.plot([p.day for p in s2.low_pivots],[p.value for p in s2.low_pivots],linewidth=1.8,label="lower RDP")
          ax.scatter([p.day for p in s2.high_pivots],[p.value for p in s2.high_pivots],s=34,marker="^")
          ax.scatter([p.day for p in s2.low_pivots],[p.value for p in s2.low_pivots],s=34,marker="v")
          for seg in (*s2.high_sideways_segments,*s2.low_sideways_segments):
              ax.plot([seg.start.day,seg.end.day],[seg.start.value,seg.end.value],linewidth=4.0,alpha=.7)
          for cand in s2.rapid_move_candidates:
              ax.plot([cand.start.day,cand.end.day],[cand.start.value,cand.end.value],linewidth=3.0,linestyle="--")
          ax.legend(loc="best")
          fig.tight_layout()
          fig.savefig("tmp-nfci-236/NFCI_RISK_STAGE2_CURRENT.png",dpi=160)
          plt.close(fig)

          fig,ax=plt.subplots(figsize=(14,7))
          base(ax,"NFCI Risk · Stage 3 · current")
          for seg in s3.segments:
              ax.plot([seg.start.day,seg.end.day],[seg.start.value,seg.end.value],linewidth=2.4)
          highs=[p for p in s3.markers if p.pivot_type=="high"]
          lows=[p for p in s3.markers if p.pivot_type=="low"]
          if highs: ax.scatter([p.day for p in highs],[p.value for p in highs],s=40,marker="^",label="Stage 3 high")
          if lows: ax.scatter([p.day for p in lows],[p.value for p in lows],s=40,marker="v",label="Stage 3 low")
          ax.legend(loc="best")
          fig.tight_layout()
          fig.savefig("tmp-nfci-236/NFCI_RISK_STAGE3_CURRENT.png",dpi=160)
          plt.close(fig)

          fig,ax=plt.subplots(figsize=(14,7))
          base(ax,"NFCI Risk · Stage 6 · current")
          for seg in s6.segments:
              ax.plot([seg.start.day,seg.end.day],[seg.start.value,seg.end.value],linewidth=2.5)
          highs=[p for p in s6.markers if p.pivot_type=="high"]
          lows=[p for p in s6.markers if p.pivot_type=="low"]
          if highs: ax.scatter([p.day for p in highs],[p.value for p in highs],s=42,marker="^",label="Stage 6 high")
          if lows: ax.scatter([p.day for p in lows],[p.value for p in lows],s=42,marker="v",label="Stage 6 low")
          ax.legend(loc="best")
          fig.tight_layout()
          fig.savefig("tmp-nfci-236/NFCI_RISK_STAGE6_CURRENT.png",dpi=160)
          plt.close(fig)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nfci-risk-236-current
          path: tmp-nfci-236/*.png
          if-no-files-found: error
