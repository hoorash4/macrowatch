name: One-off post-trend schema and scoring update
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-post-trend-schema-score.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply post-trend schema and scorer changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          schema_path = Path('supabase/functions/_shared/pivot/pivot-schema.ts')
          schema = schema_path.read_text()
          schema = schema.replace('// Pivot schema v3: rerun marker for directional pivot-date prompt validation.\nexport const PIVOT_SCHEMA_VERSION = "pivot-schema-v3";', '// Pivot schema v4: optional A/B post-trend parent structure for relationship scoring.\nexport const PIVOT_SCHEMA_VERSION = "pivot-schema-v4";')
          anchor = '          confidence: { type: "number", minimum: 0, maximum: 1 },\n        },\n        required: ["date", "value", "type", "grade", "direction", "reason", "confidence"],'
          replacement = '''          confidence: { type: "number", minimum: 0, maximum: 1 },
          post_trend: {
            type: "object",
            additionalProperties: false,
            properties: {
              direction: { type: "string", enum: ["up", "down", "sideways"] },
              end_date: { type: "string", pattern: "^\\\\d{4}-\\\\d{2}-\\\\d{2}$" },
            },
            required: ["direction", "end_date"],
          },
        },
        required: ["date", "value", "type", "grade", "direction", "reason", "confidence"],'''
          if anchor not in schema:
              raise SystemExit('pivot schema anchor not found')
          schema = schema.replace(anchor, replacement, 1)
          type_anchor = '''export type PivotPoint = {
  date: string;'''
          type_replacement = '''export type PivotPostTrend = {
  direction: "up" | "down" | "sideways";
  end_date: string;
};

export type PivotPoint = {
  date: string;'''
          if type_anchor not in schema:
              raise SystemExit('PivotPoint type anchor not found')
          schema = schema.replace(type_anchor, type_replacement, 1)
          pivot_tail = '''  reason: string;
  confidence: number;
};'''
          pivot_tail_replacement = '''  reason: string;
  confidence: number;
  post_trend?: PivotPostTrend;
};'''
          if pivot_tail not in schema:
              raise SystemExit('PivotPoint tail anchor not found')
          schema = schema.replace(pivot_tail, pivot_tail_replacement, 1)
          schema_path.write_text(schema)

          score_path = Path('backend/historical_pivot_ai_score.py')
          score = score_path.read_text()
          score = score.replace('SCORING_VERSION = "pivot-ai-score-v4"', 'SCORING_VERSION = "pivot-ai-score-v5"')

          old_duration = '''def duration_score(indicator_days: int, market_days: int | None) -> float:
    if not market_days or market_days <= 0:
        return 100.0
    score = min(indicator_days / market_days, 1.0) * 100.0
    if market_days < 365 and indicator_days > market_days * 2:
        score *= max(0.7, market_days * 2 / indicator_days)
    return min(100.0, score)
'''
          new_duration = '''def duration_score(indicator_days: int, market_days: int | None) -> float:
    if not market_days or market_days <= 0:
        return 0.0
    return min(max(indicator_days, 0) / market_days, 1.0) * 100.0
'''
          if old_duration not in score:
              raise SystemExit('duration_score anchor not found')
          score = score.replace(old_duration, new_duration, 1)

          market_duration_old = '''def market_duration(reference_type: str, cycle: dict[str, Any]) -> int | None:
    start, peak, trough = cycle.get("start_date"), cycle.get("peak_date"), cycle.get("trough_date")
    if reference_type == "START" and start and peak:
        return max(1, days_between(str(start), str(peak)))
    if reference_type in {"PEAK", "TROUGH"} and peak and trough:
        return max(1, days_between(str(peak), str(trough)))
    return None
'''
          market_duration_new = '''def market_duration(reference_type: str, cycle: dict[str, Any]) -> int | None:
    start, peak, trough = cycle.get("start_date"), cycle.get("peak_date"), cycle.get("trough_date")
    if reference_type == "START" and start and peak:
        return max(1, days_between(str(start), str(peak)))
    if reference_type == "PEAK" and peak and trough:
        return max(1, days_between(str(peak), str(trough)))
    if reference_type == "TROUGH" and trough:
        return max(1, days_between(str(trough), shift_months(str(trough), 24)))
    return None


def post_trend_values(pivot: dict[str, Any]) -> tuple[str | None, str | None]:
    value = pivot.get("post_trend")
    if not isinstance(value, dict):
        return None, None
    direction = str(value.get("direction") or "")
    end_date = str(value.get("end_date") or "")[:10]
    if direction not in {"up", "down", "sideways"} or not end_date:
        return None, None
    try:
        if date.fromisoformat(end_date) < date.fromisoformat(str(pivot.get("date") or "")[:10]):
            return None, None
    except ValueError:
        return None, None
    return direction, end_date


def market_direction_for_reference(reference_type: str, cycle: dict[str, Any]) -> str | None:
    if reference_type == "START":
        return "up"
    if reference_type == "PEAK":
        return "down"
    if reference_type == "TROUGH":
        value = str(cycle.get("_post_trough_direction") or "")
        return value if value in {"up", "sideways"} else None
    return None


def relationship_from_post_trend(reference_type: str, post_direction: str, cycle: dict[str, Any]) -> str:
    market_direction = market_direction_for_reference(reference_type, cycle)
    if not market_direction:
        return "unclear"
    if post_direction == market_direction:
        return "positive"
    if post_direction == "down" and market_direction in {"up", "sideways"}:
        return "inverse"
    if market_direction == "down" and post_direction == "up":
        return "inverse"
    return "unclear"
'''
          if market_duration_old not in score:
              raise SystemExit('market_duration anchor not found')
          score = score.replace(market_duration_old, market_duration_new, 1)

          old_calc = '''    persistence = persistence_days(str(pivot["date"]), next_regime, regimes, analysis_end)
    duration = duration_score(persistence, market_duration(reference_type, cycle))
    base_score = min(100.0, structural * REFERENCE_WEIGHTS["structural"] + timing * REFERENCE_WEIGHTS["timing"] + duration * REFERENCE_WEIGHTS["duration"])
    relationship = structural_relationship(reference_type, previous, next_regime)
'''
          new_calc = '''    post_direction, post_end_date = post_trend_values(pivot)
    if post_direction and post_end_date:
        persistence = max(0, days_between(str(pivot["date"]), post_end_date))
        relationship = relationship_from_post_trend(reference_type, post_direction, cycle)
        relationship_source = "post_trend"
    else:
        # Legacy analyses remain scoreable until the updated prompt has been rerun.
        persistence = persistence_days(str(pivot["date"]), next_regime, regimes, analysis_end)
        relationship = structural_relationship(reference_type, previous, next_regime)
        relationship_source = "legacy_regime"
    duration = duration_score(persistence, market_duration(reference_type, cycle))
    base_score = min(100.0, structural * REFERENCE_WEIGHTS["structural"] + timing * REFERENCE_WEIGHTS["timing"] + duration * REFERENCE_WEIGHTS["duration"])
'''
          if old_calc not in score:
              raise SystemExit('result calculation anchor not found')
          score = score.replace(old_calc, new_calc, 1)

          old_fields = '''        "relationship": relationship,
        "nativeRelationship": relationship,
        "relationshipBonus": 0.0,
        "relationshipConfidence": 0.0,
'''
          new_fields = '''        "relationship": relationship,
        "nativeRelationship": relationship,
        "relationshipSource": relationship_source,
        "marketDirection": market_direction_for_reference(reference_type, cycle),
        "postTrendDirection": post_direction,
        "postTrendEndDate": post_end_date,
        "relationshipScore": duration,
        "relationshipBonus": 0.0,
        "relationshipConfidence": duration / 100.0,
'''
          if old_fields not in score:
              raise SystemExit('relationship fields anchor not found')
          score = score.replace(old_fields, new_fields, 1)

          old_normalize = '''        updated.update({
            "nativeRelationship": native,
            "relationship": "unclear" if cycle_relationship == "unresolved" else cycle_relationship,
            "cycleRelationship": cycle_relationship,
            "relationshipStatus": status,
            "score": float(result["baseScore"]),
            "markerStatus": "confirmed",
        })'''
          new_normalize = '''        updated.update({
            "nativeRelationship": native,
            "relationship": native,
            "cycleRelationship": cycle_relationship,
            "relationshipStatus": status,
            "score": float(result["baseScore"]),
            "markerStatus": "confirmed",
        })'''
          if old_normalize not in score:
              raise SystemExit('relationship normalization anchor not found')
          score = score.replace(old_normalize, new_normalize, 1)

          insert_before_score_rows = '''def score_rows(db: SupabaseRest, case_code: str | None = None, index_code: str | None = None, series_code: str | None = None) -> int:
'''
          helper = '''def post_trough_market_direction(db: SupabaseRest, index_code: str, trough_date: str | None) -> str | None:
    if not trough_date:
        return None
    end_date = shift_months(str(trough_date), 24)
    rows = fetch_all(db, "market_index_prices", {
        "select": "market_date,close",
        "index_code": f"eq.{index_code}",
        "market_date": f"gte.{trough_date}",
        "order": "market_date.asc",
    })
    usable = []
    for row in rows:
        market_date = str(row.get("market_date") or "")[:10]
        if not market_date or market_date > end_date:
            break
        try:
            close = float(row.get("close"))
        except (TypeError, ValueError):
            continue
        usable.append((market_date, close))
    if len(usable) < 2:
        return None
    # TROUGH 이후 시장은 제품 정의상 상승 또는 횡보로만 분류한다.
    return "up" if usable[-1][1] > usable[0][1] else "sideways"


'''+insert_before_score_rows
          if insert_before_score_rows not in score:
              raise SystemExit('score_rows anchor not found')
          score = score.replace(insert_before_score_rows, helper, 1)

          cycle_assign_old = '''            cycle_cache[key] = cycles[0]
        scored.append(score_analysis(row, cycle_cache[key]))
'''
          cycle_assign_new = '''            cycle = dict(cycles[0])
            cycle["_post_trough_direction"] = post_trough_market_direction(db, key[1], cycle.get("trough_date"))
            cycle_cache[key] = cycle
        scored.append(score_analysis(row, cycle_cache[key]))
'''
          if cycle_assign_old not in score:
              raise SystemExit('cycle cache anchor not found')
          score = score.replace(cycle_assign_old, cycle_assign_new, 1)

          score_path.write_text(score)
          PY
      - name: Verify syntax and targeted changes
        shell: bash
        run: |
          python -m py_compile backend/historical_pivot_ai_score.py
          grep -q 'pivot-schema-v4' supabase/functions/_shared/pivot/pivot-schema.ts
          grep -q 'post_trend' supabase/functions/_shared/pivot/pivot-schema.ts
          grep -q 'pivot-ai-score-v5' backend/historical_pivot_ai_score.py
          grep -q 'relationship_from_post_trend' backend/historical_pivot_ai_score.py
      - name: Commit result and remove one-off workflow
        shell: bash
        run: |
          git config user.name "hoorash4"
          git config user.email "hoorash4@gmail.com"
          rm .github/workflows/oneoff-post-trend-schema-score.yml
          git add supabase/functions/_shared/pivot/pivot-schema.ts backend/historical_pivot_ai_score.py .github/workflows/oneoff-post-trend-schema-score.yml
          git commit -m "Add post-trend relationship scoring"
          git push
