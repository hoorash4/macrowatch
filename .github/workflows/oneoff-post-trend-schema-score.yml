name: One-off post-trend schema and scoring update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-post-trend-schema-score.yml'
      - 'tools/oneoff_post_trend_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply patch
        run: python tools/oneoff_post_trend_patch.py
      - name: Verify
        run: |
          python -m py_compile backend/historical_pivot_ai_score.py
          grep -q 'pivot-schema-v4' supabase/functions/_shared/pivot/pivot-schema.ts
          grep -q 'post_trend' supabase/functions/_shared/pivot/pivot-schema.ts
          grep -q 'pivot-ai-score-v5' backend/historical_pivot_ai_score.py
          grep -q 'relationship_from_post_trend' backend/historical_pivot_ai_score.py
      - name: Commit result
        run: |
          git config user.name "hoorash4"
          git config user.email "hoorash4@gmail.com"
          rm .github/workflows/oneoff-post-trend-schema-score.yml tools/oneoff_post_trend_patch.py
          git add supabase/functions/_shared/pivot/pivot-schema.ts backend/historical_pivot_ai_score.py .github/workflows/oneoff-post-trend-schema-score.yml tools/oneoff_post_trend_patch.py
          git commit -m "Add post-trend relationship scoring"
          git push
