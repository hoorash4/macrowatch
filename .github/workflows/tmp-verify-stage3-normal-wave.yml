name: Temporary verify stage3 normal waves
on:
  push:
    paths:
      - "backend/historical_pivot_*.py"
      - "tests/test_historical_pivot_stage_boundaries.py"
      - "tools/tmp_verify_stage3_normal_wave.py"
      - ".github/workflows/tmp-verify-stage3-normal-wave.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pytest matplotlib
      - name: Stage tests
        run: PYTHONPATH=backend pytest -q tests/test_historical_pivot_stage_boundaries.py
      - name: Four real-data charts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: PYTHONPATH=backend python tools/tmp_verify_stage3_normal_wave.py
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-normal-wave-four
          path: tmp_stage3_normal_wave_four/*.png
